<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진로 특성에 맞는 직업 찾기</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f7fb; color: #1e293b; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1e3a8a; border-bottom: 2px solid #2563eb; padding-bottom: 10px; }
        .student-info { margin-bottom: 24px; background: #e0f2fe; padding: 14px 18px; border-radius: 10px; display: flex; align-items: center; gap: 12px; }
        .student-info label { font-weight: bold; color: #0369a1; }
        .student-info input { padding: 8px 12px; font-size: 1rem; border: 1px solid #7dd3fc; border-radius: 6px; width: 180px; outline: none; }
        .question-title { font-weight: 700; font-size: 1.05rem; margin: 24px 0 12px; color: #0f172a; }
        .words-box { background: #fffbeb; border: 2px dashed #f59e0b; padding: 16px; border-radius: 12px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; min-height: 60px; }
        .word-card { background: #fff; border: 1.5px solid #d97706; color: #b45309; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; user-select: none; transition: all 0.2s; }
        .word-card.selected { background: #f59e0b; color: #fff; border-color: #d97706; }
        .holland-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
        @media (max-width: 600px) { .holland-grid { grid-template-columns: 1fr; } }
        .holland-card { border: 1px solid #cbd5e1; border-radius: 10px; padding: 12px; background: #fafafa; cursor: pointer; min-height: 110px; transition: border-color 0.2s; }
        .type-header { font-weight: bold; color: #1d4ed8; margin-bottom: 8px; font-size: 0.95rem; }
        .placed-words { display: flex; flex-wrap: wrap; gap: 6px; }
        .placed-tag { background: #2563eb; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-block; }
        .text-input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; resize: vertical; outline: none; line-height: 1.5; }
        .submit-btn { width: 100%; padding: 16px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>진로 특성에 맞는 직업 찾기</h1>

    <div class="student-info">
        <label for="student-id">학번</label>
        <input type="text" id="student-id" placeholder="예: 10101" autocomplete="off">
    </div>

    <div class="question-title">1. 아래 보기를 터치한 후 해당되는 홀랜드 흥미 유형 칸을 터치해 봅시다. (배치된 단어를 누르면 취소됩니다)</div>
    
    <div class="words-box" id="words-box">
        <div class="word-card" onclick="selectWord(this)">로봇 연구원</div>
        <div class="word-card" onclick="selectWord(this)">운동 선수</div>
        <div class="word-card" onclick="selectWord(this)">물리학자</div>
        <div class="word-card" onclick="selectWord(this)">생물학자</div>
        <div class="word-card" onclick="selectWord(this)">영화감독</div>
        <div class="word-card" onclick="selectWord(this)">화가</div>
        <div class="word-card" onclick="selectWord(this)">가수</div>
        <div class="word-card" onclick="selectWord(this)">간호사</div>
        <div class="word-card" onclick="selectWord(this)">교사</div>
        <div class="word-card" onclick="selectWord(this)">상담가</div>
        <div class="word-card" onclick="selectWord(this)">변호사</div>
        <div class="word-card" onclick="selectWord(this)">쇼호스트</div>
        <div class="word-card" onclick="selectWord(this)">사서</div>
        <div class="word-card" onclick="selectWord(this)">세무사</div>
        <div class="word-card" onclick="selectWord(this)">회계사</div>
    </div>

    <div class="holland-grid">
        <div class="holland-card" data-type="R" onclick="placeWord(this)"><div class="type-header">R (실재형)</div><div class="placed-words"></div></div>
        <div class="holland-card" data-type="I" onclick="placeWord(this)"><div class="type-header">I (탐구형)</div><div class="placed-words"></div></div>
        <div class="holland-card" data-type="A" onclick="placeWord(this)"><div class="type-header">A (예술형)</div><div class="placed-words"></div></div>
        <div class="holland-card" data-type="S" onclick="placeWord(this)"><div class="type-header">S (사회형)</div><div class="placed-words"></div></div>
        <div class="holland-card" data-type="E" onclick="placeWord(this)"><div class="type-header">E (기업형)</div><div class="placed-words"></div></div>
        <div class="holland-card" data-type="C" onclick="placeWord(this)"><div class="type-header">C (관습형)</div><div class="placed-words"></div></div>
    </div>

    <div class="question-title">2. 자신의 관심 직업과 필요한 진로 특성을 적어 봅시다.</div>
    <input type="text" id="job-title" class="text-input" placeholder="나의 관심 직업 (예: 경찰관)" autocomplete="off">
    <textarea id="job-desc" class="text-input" rows="4" placeholder="관심 직업에 요구되는 진로 특성을 적어주세요." autocomplete="off"></textarea>

    <button id="submit-btn" class="submit-btn" onclick="submitWorksheet()">제출하기</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://career-and-job-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const correctAnswers = {
        "R": ["운동 선수"],
        "I": ["로봇 연구원", "물리학자", "생물학자"],
        "A": ["영화감독", "화가", "가수"],
        "S": ["간호사", "교사", "상담가"],
        "E": ["변호사", "쇼호스트"],
        "C": ["사서", "세무사", "회계사"]
    };

    let selectedWordElem = null;

    function selectWord(elem) {
        if(selectedWordElem) selectedWordElem.classList.remove('selected');
        selectedWordElem = elem;
        elem.classList.add('selected');
    }

    function placeWord(cardElem) {
        if(!selectedWordElem) return;
        const placedContainer = cardElem.querySelector('.placed-words');
        const text = selectedWordElem.innerText.trim();
        
        const tag = document.createElement('span');
        tag.className = 'placed-tag';
        tag.setAttribute('data-word', text);
        tag.innerText = text + ' ✕';
        
        tag.onclick = function(e) {
            e.stopPropagation();
            returnToBox(this, text);
        };
        
        placedContainer.appendChild(tag);
        selectedWordElem.style.display = 'none';
        selectedWordElem.classList.remove('selected');
        selectedWordElem = null;
    }

    function returnToBox(tagElem, text) {
        const words = document.querySelectorAll('.word-card');
        words.forEach(w => {
            if(w.innerText.trim() === text) {
                w.style.display = 'inline-block';
            }
        });
        tagElem.remove();
    }

    async function submitWorksheet() {
        const btn = document.getElementById('submit-btn');

        const studentId = document.getElementById('student-id').value.trim();
        const jobTitle = document.getElementById('job-title').value.trim();
        const jobDesc = document.getElementById('job-desc').value.trim();

        if(!studentId) { alert('학번을 입력해주세요.'); return; }

        const cards = document.querySelectorAll('.holland-card');
        let isCorrect = true;
        let totalPlaced = 0;

        cards.forEach(card => {
            const type = card.getAttribute('data-type');
            const placedTags = Array.from(card.querySelectorAll('.placed-tag')).map(tag => tag.getAttribute('data-word'));
            totalPlaced += placedTags.length;

            const targetCorrect = correctAnswers[type];
            if(placedTags.length !== targetCorrect.length) {
                isCorrect = false;
            } else {
                placedTags.forEach(item => { if(!targetCorrect.includes(item)) isCorrect = false; });
            }
        });

        if(totalPlaced < 15) { alert('1번 보기의 15개 카드를 모두 배치해 주세요.'); return; }
        if(!isCorrect) { alert('1번 정답이 틀렸습니다. 다시 확인해 보세요!'); return; }
        if(!jobTitle || !jobDesc) { alert('2번 답란을 모두 입력해주세요.'); return; }

        btn.disabled = true;
        btn.innerText = '확인 중...';

        try {
            // 전체 데이터를 받아온 뒤 직접 검사 (3초 타임아웃 적용)
            const ref = db.ref('holland_activity_submissions');
            
            const fetchPromise = ref.once('value');
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT")), 3000));

            let isDuplicate = false;

            try {
                const snapshot = await Promise.race([fetchPromise, timeoutPromise]);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let key in data) {
                        if (data[key] && data[key].studentId === studentId) {
                            isDuplicate = true;
                            break;
                        }
                    }
                }
            } catch (e) {
                console.warn("중복 검사 시간 초과 또는 실패. 바로 제출을 진행합니다.", e);
            }

            if (isDuplicate) {
                btn.disabled = false;
                btn.innerText = '제출하기';
                alert('이미 제출된 학번입니다. 수정이 필요하면 선생님께 문의해 주세요.');
                return;
            }

            // 중복이 없을 경우 데이터 전송
            btn.innerText = '제출 중...';
            await ref.push({
                studentId: studentId,
                jobTitle: jobTitle,
                jobDesc: jobDesc,
                submittedAt: new Date().toLocaleString('ko-KR')
            });

            alert('정답입니다! 성공적으로 제출되었습니다.');
            location.href = 'index.html';

        } catch (err) {
            btn.disabled = false;
            btn.innerText = '제출하기';
            alert('제출 에러: ' + err.message);
        }
    }
</script>

</body>
</html>
