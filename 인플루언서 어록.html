<!DOCTYPE html>
<html lang="ko">
<head>
<!-- <오.승.열.제.작.> -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인플루언서 어록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111418;
    --bg-2:#171B21;
    --card:#1C2129;
    --card-hover:#222834;
    --line:#2A313C;
    --text:#ECE8E0;
    --muted:#8E97A6;
    --gold:#E2B55E;
    --c1:#E2B55E; --c2:#E78A6E; --c3:#6CC3B0; --c4:#A99BE6; --c5:#72AEE6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{
    font-family:'Noto Sans KR',sans-serif;color:var(--text);line-height:1.6;
    background:
      radial-gradient(1200px 500px at 85% -10%, rgba(226,181,94,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(108,195,176,.07), transparent 60%),
      var(--bg);
    background-attachment:fixed;min-height:100vh;
    -webkit-text-size-adjust:100%;
  }

  /* ===== 상단 고정바 ===== */
  .bar{
    position:sticky;top:0;z-index:20;
    background:rgba(17,20,24,.82);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .bar-inner{
    max-width:1680px;margin:0 auto;padding:16px clamp(16px,3vw,48px);
    display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;
  }
  h1{
    font-family:'Nanum Myeongjo',serif;font-weight:800;letter-spacing:-.01em;line-height:1.25;
    font-size:clamp(20px,2vw,30px);white-space:nowrap;
    display:flex;align-items:center;gap:12px;
  }
  h1::before{
    content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 5px rgba(226,181,94,.18);flex:0 0 auto;
  }
  .btn{
    font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
    border-radius:12px;padding:10px 16px;border:1px solid rgba(226,181,94,.55);
    background:rgba(226,181,94,.08);color:var(--gold);transition:.15s;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{background:var(--gold);color:#1a1406;border-color:var(--gold)}
  .btn svg{width:16px;height:16px;flex:0 0 auto}
  .tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
  /* 제목 길이와 상관없이 버튼 위치가 고정되도록, 좁은 화면에서는 버튼·검색창을 항상 둘째 줄에 */
  @media (max-width:1199px){ .tools{flex-basis:100%;justify-content:flex-end} }
  .search{
    flex:0 1 460px;width:460px;min-width:0;display:flex;align-items:center;
    background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:4px 4px 4px 14px;
    transition:.15s;
  }
  .search:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(226,181,94,.15)}
  .search > svg{width:17px;height:17px;color:var(--muted);flex:0 0 auto;margin-right:8px}
  .search input{
    flex:1;min-width:0;border:none;outline:none;background:transparent;
    font-family:inherit;font-size:15px;color:var(--text);padding:7px 0;
  }
  .search input::-webkit-search-cancel-button{display:none}
  .search input::placeholder{color:#626b7a}
  .search .clear{
    border:none;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;
    width:30px;height:30px;border-radius:8px;display:none;
  }
  .search .clear:hover{color:var(--text);background:var(--line)}
  .search.has-value .clear{display:inline-block}
  .search .go{
    border:none;cursor:pointer;background:var(--gold);color:#1a1406;border-radius:9px;
    font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;white-space:nowrap;
  }
  .search .go:hover{background:#f0c878}

  /* ===== 본문 ===== */
  main{max-width:1680px;margin:0 auto;padding:28px clamp(16px,3vw,48px) 64px}
  .status{
    display:none;margin-bottom:18px;font-size:14px;color:var(--muted);
  }
  .status.show{display:block}
  .status b{color:var(--gold);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:20px;align-items:stretch}

  .card{
    --c:var(--c1);
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px 26px 20px;position:relative;overflow:hidden;
    transition:transform .2s, background .2s, border-color .2s;
    animation:rise .45s ease both;
  }
  .card:hover{transform:translateY(-3px);background:var(--card-hover);border-color:color-mix(in srgb, var(--c) 45%, var(--line))}
  .card::after{
    content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c);opacity:.85;
  }
  .card:nth-child(5n+2){--c:var(--c2)}
  .card:nth-child(5n+3){--c:var(--c3)}
  .card:nth-child(5n+4){--c:var(--c4)}
  .card:nth-child(5n+5){--c:var(--c5)}
  .mark-q{
    font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:54px;line-height:.7;color:var(--c);
    display:block;height:26px;margin-bottom:8px;opacity:.95;
  }
  .quote{
    white-space:pre-line;
    margin-bottom:18px;
    font-family:'Nanum Myeongjo',serif;font-weight:700;
    font-size:clamp(17px,1.15vw,20px);line-height:1.75;letter-spacing:-.01em;
    word-break:keep-all;overflow-wrap:anywhere;color:var(--text);
  }
  .meta{
    margin-top:auto;padding-top:14px;border-top:1px dashed var(--line);
    display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
  }
  .author{font-size:13.5px;color:var(--muted);line-height:1.5;word-break:keep-all}
  .author strong{display:block;color:var(--text);font-weight:700;font-size:14.5px}
  .no{font-size:11.5px;color:#5c6574;letter-spacing:.1em;font-weight:700;white-space:nowrap}
  mark{background:var(--gold);color:#1a1406;border-radius:4px;padding:0 2px}

  .end-note{text-align:center;color:var(--muted);font-size:13.5px;margin-top:34px;letter-spacing:.06em}
  .end-note[hidden]{display:none}
  .end-note .maker{color:var(--bg);margin-top:4px}   /* 배경과 같은 색 */
  .end-main::before,.end-main::after{content:"";display:inline-block;width:40px;height:1px;background:var(--line);vertical-align:middle;margin:0 12px}
  .empty{padding:90px 0;text-align:center;color:var(--muted);font-size:16px;line-height:1.9}
  .empty b{color:var(--text)}

  .to-top{
    position:fixed;right:22px;bottom:22px;z-index:15;width:46px;height:46px;border-radius:14px;
    border:1px solid rgba(226,181,94,.5);cursor:pointer;background:rgba(28,33,41,.92);color:var(--gold);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s;
  }
  .to-top.show{opacity:1;pointer-events:auto}
  .to-top:hover{background:var(--gold);color:#1a1406}
  .to-top svg{width:20px;height:20px}

  @media (max-width:520px){
    .btn .lbl{display:none}
    .btn{padding:9px;border-radius:11px}
    .btn svg{width:19px;height:19px}
  }

  /* ===== 프레젠테이션 ===== */
  body.presenting{overflow:hidden}
  .pres{
    position:fixed;inset:0;z-index:100;
    background:
      radial-gradient(1000px 600px at 80% 0%, rgba(226,181,94,.12), transparent 60%),
      radial-gradient(900px 600px at 0% 100%, rgba(108,195,176,.10), transparent 60%),
      #0C0E12;
    display:flex;flex-direction:column;
  }
  .pres[hidden]{display:none}
  .show-bg{
    position:absolute;inset:0;background-size:cover;background-position:center 22%;background-repeat:no-repeat;
    opacity:0;transition:opacity .5s ease;filter:grayscale(.3) saturate(.8) brightness(.8) blur(1.5px);transform:scale(1.02);
  }
  .show-bg.on{opacity:.22}
  .show-shade{
    position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 75% 65% at 50% 50%, rgba(12,14,18,.78), rgba(12,14,18,.5) 70%, rgba(12,14,18,.8)),
      linear-gradient(to bottom, rgba(12,14,18,.45), rgba(12,14,18,.2) 25%, rgba(12,14,18,.2) 70%, rgba(12,14,18,.85));
  }
  .show-stage{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:6vh 7vw 14vh}
  .show-slide{max-width:1300px;width:100%;text-align:center;transition:opacity .28s ease, transform .28s ease}
  .show-slide.out{opacity:0;transform:translateY(10px)}
  .show-mark{
    display:block;font-family:'Nanum Myeongjo',serif;font-weight:800;color:var(--sc,var(--gold));
    font-size:clamp(70px,9vw,150px);line-height:.6;height:clamp(40px,5vw,80px);margin-bottom:2vh;
  }
  .show-quote{
    white-space:normal;
    font-family:'Nanum Myeongjo',serif;font-weight:800;color:#F4F0E8;text-shadow:0 2px 6px rgba(0,0,0,.6),0 4px 28px rgba(0,0,0,.7);
    font-size:clamp(26px,4.2vw,68px);line-height:1.55;letter-spacing:-.02em;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  .show-quote .ln{display:block;text-wrap:balance;word-break:keep-all;overflow-wrap:break-word}
  .show-author{word-break:keep-all;text-wrap:balance}
  .show-author strong{white-space:nowrap}
  .show-author{text-shadow:0 1px 4px rgba(0,0,0,.7),0 2px 16px rgba(0,0,0,.7);margin-top:4vh;font-size:clamp(15px,1.6vw,26px);color:#B4BBC7}
  .show-author strong{color:var(--sc,var(--gold));font-weight:700;margin-right:.5em}
  .show-progress{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.06)}
  .show-progress span{display:block;height:100%;width:0;background:var(--sc,var(--gold))}
  .show-ctrl{
    position:absolute;right:8px;bottom:6px;
    z-index:2;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;
    background:transparent;border:none;padding:2px;
    opacity:.3;transition:opacity .25s;
  }
  .show-ctrl:hover,.show-ctrl:focus-within{opacity:.9}
  .speed{display:flex;align-items:center;gap:0;flex-wrap:wrap;justify-content:flex-end}
  .speed span{font-size:9.5px;color:#4a515d;font-weight:700;padding:0 3px}
  .speed button{
    font-family:inherit;font-size:9.5px;font-weight:700;cursor:pointer;color:#5e6674;
    background:transparent;border:1px solid transparent;border-radius:5px;padding:3px 4px;transition:.15s;
  }
  .speed button:hover{color:#aab1bc}
  .speed button.on{color:#aab1bc;border-color:rgba(255,255,255,.08)}
  .nav{display:flex;gap:2px;padding-left:4px;border-left:1px solid rgba(255,255,255,.05)}
  .nav button{
    width:24px;height:24px;border-radius:6px;cursor:pointer;border:none;
    background:transparent;color:#5e6674;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .nav button:hover{background:rgba(255,255,255,.05);color:#c7ccd4}
  .nav button svg{width:12px;height:12px}
  .nav .play{color:#7d8593}
  @media (max-width:700px){
    .show-stage{padding:8vh 6vw 26vh}
    .show-ctrl{left:auto;right:6px;bottom:6px;max-width:92vw}
    .speed button{padding:4px 4px}
  }

  /* 프레젠테이션 오른편: 마우스를 올렸을 때만 보이는 저장 버튼 (윈도우 PC 전용) */
  .exp-zone{position:absolute;right:0;top:0;bottom:70px;width:160px;z-index:3;display:flex;align-items:center;justify-content:flex-end;padding-right:18px}
  .exp-zone[hidden]{display:none}
  .exp-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    font-family:inherit;font-size:12px;font-weight:700;color:#aab1bc;
    background:rgba(28,33,41,.85);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 12px;
    opacity:0;transform:translateX(8px);transition:opacity .2s, transform .2s, color .15s, border-color .15s;
  }
  .exp-btn svg{width:20px;height:20px}
  .exp-zone:hover .exp-btn,.exp-btn:focus-visible{opacity:1;transform:none}
  .exp-btn:hover{color:var(--gold);border-color:rgba(226,181,94,.5)}

  /* ===== 이미지 저장 창 ===== */
  .exp{position:fixed;inset:0;z-index:200;background:rgba(5,6,8,.7);display:flex;align-items:center;justify-content:center;padding:16px;
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  .exp[hidden]{display:none}
  .exp-box{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .exp-box h2{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:20px;margin-bottom:10px}
  .exp-desc{font-size:14px;color:var(--muted);line-height:1.7;word-break:keep-all}
  .exp-desc b{color:var(--gold)}
  .exp-opt{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;cursor:pointer;flex-wrap:wrap}
  .exp-opt input{width:17px;height:17px;accent-color:var(--gold)}
  .exp-opt small{color:var(--muted);font-size:12px}
  .exp-prog{margin-top:18px;height:8px;border-radius:99px;background:var(--bg-2);overflow:hidden}
  .exp-prog span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
  .exp-state{margin-top:10px;font-size:13px;color:var(--muted);min-height:20px;word-break:keep-all}
  .exp-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .btn.solid{background:var(--gold);color:#1a1406;border-color:var(--gold)}
  .btn.solid:hover{background:#f0c878}
  .btn.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn.ghost:hover{background:var(--line);color:var(--text)}
  .btn:disabled{opacity:.45;cursor:default;pointer-events:none}

  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .card{animation:none} }

  /* ===== 반응형 ===== */
  @media (max-width:700px){
    .bar-inner{padding:12px 14px;gap:10px}
    h1{flex:1;font-size:19px;white-space:normal;word-break:keep-all}
    .btn{padding:8px 12px;font-size:13px}
    .tools{flex-basis:100%;margin-left:0;gap:8px}
    .search{flex:1 1 auto;width:auto}
    .search input{font-size:16px} /* iOS 확대 방지 */
    main{padding:18px 14px 56px}
    .grid{gap:14px}
    .card{padding:22px 20px 16px;border-radius:16px}
    .quote{font-size:17px}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-inner">
    <h1 id="title">인플루언서 어록</h1>
    <div class="tools">
    <button class="btn" id="btnRandom" type="button" title="랜덤 생성" aria-label="랜덤 생성">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
      <span class="lbl">랜덤 생성</span>
    </button>
    <button class="btn" id="btnPresent" type="button" title="프레젠테이션" aria-label="프레젠테이션">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m10 7 5 3-5 3z" fill="currentColor"/></svg>
      <span class="lbl">프레젠테이션</span>
    </button>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="단어·인물 검색" aria-label="어록 검색" enterkeyhint="search">
      <button class="clear" type="button" id="btnClear" aria-label="검색어 지우기">×</button>
      <button class="go" type="submit">검색</button>
    </form>
    </div>
  </div>
</header>

<main>
  <div class="status" id="status"></div>
  <section class="grid" id="list"></section>
  <div id="sentinel" aria-hidden="true" style="height:1px"></div>
  <div class="end-note" id="endNote" hidden><p class="end-main">모든 어록을 다 보았습니다</p><p class="maker">만든 사람 오승열</p></div>
</main>

<div class="pres" id="show" role="dialog" aria-modal="true" aria-label="어록 프레젠테이션" hidden>
  <div class="show-bg" id="sBg" aria-hidden="true"></div>
  <div class="show-shade" aria-hidden="true"></div>
  <div class="show-stage">
    <div class="show-slide" id="slide">
      <p class="show-quote" id="sQuote"></p>
      <p class="show-author" id="sAuthor"></p>
    </div>
  </div>
  <div class="exp-zone" id="expZone" hidden>
    <button type="button" class="exp-btn" id="btnExport" title="어록 이미지(JPG) 전체 저장">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span>이미지 저장</span>
    </button>
  </div>
  <div class="show-progress"><span id="sBar"></span></div>
  <div class="show-ctrl">
    <div class="speed" role="group" aria-label="재생 속도">
      <span>속도</span>
      <button type="button" data-speed="1000">1초</button>
      <button type="button" data-speed="1500" class="on">1.5초</button>
      <button type="button" data-speed="2500">2.5초</button>
      <button type="button" data-speed="4000">4초</button>
      <button type="button" data-speed="6000">6초</button>
      <button type="button" data-speed="10000">10초</button>
      <button type="button" data-speed="15000">15초</button>
      <button type="button" data-speed="20000">20초</button>
    </div>
    <div class="nav">
      <button type="button" id="sPrev" aria-label="이전 어록" title="이전 (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" id="sPlay" class="play" aria-label="멈춤" title="재생/멈춤 (Space)"></button>
      <button type="button" id="sNext" aria-label="다음 어록" title="다음 (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      <button type="button" id="sClose" class="close" aria-label="프레젠테이션 끝내기" title="끝내기 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
  </div>
</div>

<div class="exp" id="exp" role="dialog" aria-modal="true" aria-labelledby="expTitle" hidden>
  <div class="exp-box">
    <h2 id="expTitle">프레젠테이션 화면을 JPG로 저장</h2>
    <p class="exp-desc">전체 어록 <b id="expTotal"></b>개를 프레젠테이션 화면 그대로(1920×1080) JPG 이미지로 만들어 ZIP 파일 하나로 내려받습니다. 속도·재생 버튼은 들어가지 않습니다.</p>
    <label class="exp-opt"><input type="checkbox" id="expPhoto" checked> 인물 사진 배경 포함 <small>(인터넷 필요, 시간이 더 걸림)</small></label>
    <div class="exp-prog" id="expProg" hidden><span id="expBar"></span></div>
    <p class="exp-state" id="expState"></p>
    <div class="exp-btns">
      <button type="button" class="btn ghost" id="expCancel">닫기</button>

<script>
const QUOTES = [["운은 준비된 사람에게 찾아오는 선물입니다. 준비되지 않은 사람에겐 스쳐 지나가는 바람일 뿐이죠.","Kelly Choi (켈리 최), 글로벌 기업가 및 동기부여 크리에이터"],["가장 어두운 밤이 지나야 가장 밝은 아침이 온다.","RM(김남준), 방탄소년단(BTS) 리더"],["당신의 이름은 무엇입니까? 당신의 심장을 뛰게 하는 것은 무엇입니까?","RM(김남준), 방탄소년단(BTS) 리더"],["당신이 누구이든, 어느 나라 출신이든, 피부색이 어떻든 스스로에게 목소리를 내세요.","RM(김남준), 방탄소년단(BTS) 리더"],["우리는 모두 우주 속의 별입니다. 남의 빛을 부러워하느라 자신만의 빛을 잃지 마세요.","RM(김남준), 방탄소년단(BTS) 리더"],["타인을 사랑하는 것보다 나 자신을 있는 그대로 사랑하는 것이 인생에서 가장 어려운 숙제입니다.","RM(김남준), 방탄소년단(BTS) 리더"],["실수를 두려워해서 안전한 동작만 고집한다면, 결코 어제보다 나은 춤을 출 수 없어요. 과감하게 틀리세요.","가비, 댄서 및 안무가"],["주인공을 빛나게 해주는 감초 역할은 극의 윤활유입니다. 제가 그 톱니바퀴 역할을 완벽히 해낼 때 쾌감을 느낍니다.","강기영, 배우"],["꾸미지 않은 날 것의 솔직함이 언어의 장벽을 넘어 사람의 마음을 엽니다.","강남, 방송인"],["잘생겼다는 말보다, 그 인물 그 자체로 보인다는 말이 저에겐 최고의 짜릿한 찬사입니다.","강동원, 배우"],["10년이 넘게 화음이 찰떡같이 맞는 비결은 철저한 비즈니스 파트너십과 깊은 우정의 밸런스입니다.","강민경, 다비치 멤버"],["공부는 결코 배신하지 않습니다. 내가 공부를 배신할 뿐이죠.","강성태, 교육 유튜버 '공부의 신'"],["내일의 나를 만드는 것은 오늘 묵묵히 흘린 땀방울뿐이다.","강수진, 국립발레단 단장 및 전 발레리나"],["철학은 죽은 학문이 아닙니다. 어떻게 살 것인가를 매 순간 질문하게 만드는 삶의 무기입니다.","강신주, 철학자"],["제가 연기하는 인물이 시청자들의 마음속에 작은 씨앗 하나라도 남길 수 있다면 그것으로 족합니다.","강태오, 배우"],["평범한 사람들의 소박하고 따뜻한 일상이 영웅들의 서사보다 훨씬 더 강한 울림을 줍니다.","강풀, 웹툰 작가 (무빙)"],["때로는 바보처럼 보일지라도, 매사에 진심을 다해 부딪히는 사람의 눈빛은 절대 거짓말을 하지 않습니다.","강하늘, 배우"],["어떤 배역이든 처음 만날 때는 두렵지만, 그 두려움이 저를 더 치열하게 만듭니다.","강하늘, 배우"],["강아지가 짖는 것은 떼를 쓰는 게 아니라 대화를 시도하는 겁니다. 인간의 오만한 잣대로 통제하려 하지 말고 그들의 언어를 이해하세요.","강형욱, 반려견 훈련사"],["말이 통하지 않는 반려견과 교감하는 방법은, 인간의 기준을 내려놓고 철저히 개의 시선에서 세상을 바라보는 것입니다.","강형욱, 반려견 훈련사"],["반려견의 문제 행동은 대부분 보호자의 잘못된 시그널에서 비롯됩니다. 변해야 할 것은 사람입니다.","강형욱, 반려견 훈련사"],["성공의 반대말은 실패가 아니라 포기입니다. 포기하지만 않는다면 우리는 여전히 성공으로 가는 길 위에 있는 것입니다.","강형욱, 반려견 훈련사"],["억지로 끌고 가려 하지 마세요. 관계에서 가장 중요한 것은 상대를 믿고 기다려주는 일입니다.","강형욱, 반려견 훈련사"],["진정으로 사랑한다면 먼저 상대방의 언어를 이해하고 존중하려고 노력해야 합니다.","강형욱, 반려견 훈련사"],["내 사전에 대충이란 없다. 쓰러질 때까지 최선을 다한다.","강호동, 방송인 및 전 씨름선수"],["씨름판이나 방송이나, 끝까지 버티는 놈이 이긴다.","강호동, 방송인 및 전 씨름선수"],["천재는 노력하는 자를 이길 수 없고, 노력하는 자는 그 과정을 즐기는 자를 결코 이길 수 없다.","강호동, 방송인 및 전 씨름선수"],["삶을 대하는 힙한 태도란, 남의 눈치 보지 않고 내 방식대로 정직하게 살아가는 것이다.","개코, 다이나믹 듀오 멤버"],["아무리 작은 배역이라도 저만의 서사를 꽉 채워 넣어 살아 숨 쉬게 만들려 노력합니다.","고민시, 영화배우"],["완벽하지 않아도 괜찮아요. 엉뚱하고 발랄한 제 모습 그대로를 사랑해 주셔서 감사합니다.","고세구, 이세돌(이세계아이돌) 멤버"],["신비로운 분위기보다 중요한 건, 시청자가 인물에게 공감하게 만드는 묵직한 설득력입니다.","고윤정, 배우"],["실패를 두려워하는 순간, 배우의 가장 강력한 무기인 '용기'가 흔적도 없이 사라집니다.","공유, 배우"],["포기하고 싶은 순간이 올 때, 왜 이 일을 시작했는지 그 첫 마음을 기억해 보세요.","공유, 배우"],["세월의 흐름을 거스르려 하지 않고, 제 얼굴에 새겨지는 주름과 연륜을 자연스럽게 연기에 녹여내고 싶습니다.","공효진, 배우"],["자연스러운 연기는 억지로 꾸며내는 것이 아니라, 그 상황에 툭 던져졌을 때 비로소 나오는 본능입니다.","공효진, 배우"],["타인의 시선에 갇혀 예쁜 모습만 보여주려다 보면, 결국 내 진짜 얼굴을 잃어버리게 됩니다.","공효진, 배우"],["꼴찌로 달리고 있어도 마지막 코너에서 판을 뒤집을 수 있는 게 쇼트트랙이고, 제 인생입니다.","곽윤기, 쇼트트랙 국가대표"],["혼자서도 온전하게 설 수 있어야, 다른 사람과 함께 있어도 진짜 행복할 수 있습니다.","곽정은, 작가 및 심리·관계 크리에이터"],["바닥을 쳐봤기 때문에 이제 위로 올라갈 일만 남았다.","곽튜브(곽준빈), 여행 크리에이터"],["세상 사람들이 저를 보고 찌질하다고 손가락질해도 상관없습니다. 그 찌질함이 모여 지금의 유쾌한 곽튜브를 만들었으니까요.","곽튜브(곽준빈), 여행 크리에이터"],["아픔을 웃음으로 승화시키는 법을 배우니, 비로소 세상이 달라 보였습니다.","곽튜브(곽준빈), 여행 크리에이터"],["잃을 게 없다는 건, 반대로 말하면 무엇이든 과감하게 시도해 볼 수 있다는 뜻입니다.","곽튜브(곽준빈), 여행 크리에이터"],["제가 경험한 최악의 개고생이 시청자들에게는 최고의 콘텐츠가 되더라고요. 그래서 기꺼이 구릅니다.","곽튜브(곽준빈), 여행 크리에이터"],["찌질하고 평범했던 제 과거를 부정하지 않습니다. 그 시간이 있었기에 지금의 단단한 제가 있으니까요.","곽튜브(곽준빈), 여행 크리에이터"],["정해진 대본을 저만의 엉뚱한 리듬으로 변주하여 관객을 묘하게 설득시키는 것이 제 방식입니다.","구교환, 배우"],["정형화된 틀을 깨고 저만의 색깔로 인물을 변주할 때, 배우로서 가장 짜릿한 희열을 느낍니다.","구교환, 배우"],["모방의 의심이 두려워 남의 작품을 보지 않는 것은 어리석은 행위다.","구로사와 아키라, 영화감독"],["예술가가 된다는 것은 다른 이의 시선을 외면해선 안 된다는 것이다.","구로사와 아키라, 영화감독"],["마지막 1초까지도 승부는 모릅니다. 끝까지 물고 늘어지는 집념이 피스트 위에서의 저의 칼날입니다.","구본길, 펜싱 국가대표"],["부담감을 즐긴다는 건 거짓말입니다. 그저 부담감을 안고서라도 내가 해야 할 일에 집중할 뿐입니다.","구본길, 펜싱 국가대표"],["사업의 성공은 혼자만의 천재성이 아니라, 좋은 사람들을 곁에 두는 리더십에서 나옵니다.","구자경, LG그룹 명예회장"],["주장이라는 자리는 권력을 부리는 자리가 아니라, 가장 많이 희생하고 가장 마지막에 우는 자리입니다.","구자철, 전 축구 국가대표"],["오디션 프로그램에서 겪었던 수없는 좌절들이 지금의 단단한 저를 만들었습니다.","권은비, 가수"],["과학은 세상의 모든 정답을 알려주진 않지만, 세상을 향해 가장 합리적이고 경이로운 질문을 던지는 법을 명쾌하게 가르쳐줍니다.","궤도, 과학 지식 크리에이터"],["과학은 차갑고 냉정한 정답을 암기하는 것이 아니라, 세상에 끝없이 '왜?'라는 따뜻하고 합리적인 의심을 던지는 과정입니다.","궤도, 과학 지식 크리에이터"],["모르는 것은 부끄러운 게 아닙니다. 알려고 하지 않는 것이 부끄러운 거죠.","궤도, 과학 지식 크리에이터"],["우리는 모두 우주의 먼지이지만, 아주 특별하고 경이로운 먼지입니다.","궤도, 과학 지식 크리에이터"],["우리는 성공할 확률을 높이기 위해 끊임없이 실패를 겪어내는 것입니다.","궤도, 과학 지식 크리에이터"],["무대 위에서의 플렉스는 부를 과시하는 게 아니라, 제가 여기까지 올라오며 흘린 땀방울을 증명하는 의식입니다.","그레이(GRAY), 프로듀서"],["유명세에 취하지 않고 항상 처음 음악을 시작했던 그 골방의 간절함을 기억하겠습니다.","그레이(GRAY), 프로듀서"],["말보다 실력으로 묵묵히 증명해 내면, 비난은 어느새 환호로 바뀝니다.","기성용, 축구선수"],["비판을 두려워하면 어떤 플레이도 할 수 없습니다. 비판을 환호로 바꾸는 건 오직 실력뿐입니다.","기성용, 축구선수"],["남들처럼 살려고 억지로 노력하지 마세요. 어차피 남들처럼 똑같이 되지도 않습니다.","기안84, 웹툰 작가 및 방송인"],["완벽을 기하다가 시작조차 못하는 것보다, 엉망이라도 일단 시작하는 게 낫다.","기안84, 웹툰 작가 및 방송인"],["수많은 패배와 아픔이 나를 단련시켰습니다. 이제는 어떤 상황에서도 흔들리지 않는 국밥 같은 존재가 되겠습니다.","기인(김기인), Gen.G LoL 프로게이머"],["언제나 팀이 기댈 수 있는 든든한 국밥 같은 존재, 흔들리지 않는 탑의 정석을 묵묵하고 단단하게 보여주겠습니다.","기인(김기인), Gen.G LoL 프로게이머"],["기초 체력이 없으면 멘탈도 쉽게 바스라집니다. 땀방울을 흘리며 근육을 찢는 고통은 결국 내 정신을 단단하게 단련하는 숭고한 과정입니다.","김계란(피지컬갤러리), 운동 크리에이터"],["내가 사랑하는 일에 내 모든 근육과 땀을 쏟아붓는 과정 자체가 이미 승리입니다.","김계란(피지컬갤러리), 운동 크리에이터"],["다이어트는 살을 빼기 위한 고통스러운 숙제가 아니라, 내 몸을 사랑하고 건강한 멘탈을 되찾는 여정입니다.","김계란(피지컬갤러리), 운동 크리에이터"],["땀방울은 몸의 형태를 바꾸는 것을 넘어, 내 삶을 대하는 멘탈까지 통째로 바꿔놓습니다.","김계란(피지컬갤러리), 운동 크리에이터"],["몸은 거짓말을 하지 않습니다. 노력한 만큼 반드시 돌아옵니다.","김계란(피지컬갤러리), 운동 크리에이터"],["어제보다 한 걸음이라도 더 나아갔다면 그것으로 이미 충분한 성공이다.","김계란(피지컬갤러리), 운동 크리에이터"],["유튜브 생태계는 정글입니다. 어제 터졌던 대박 콘텐츠도 오늘이면 잊혀지죠. 끊임없이 진화하고 허물을 벗어야 살아남습니다.","김계란(피지컬갤러리), 운동 크리에이터"],["연기란 정답이 없는 미로에서, 나만의 출구를 찾아가는 외롭고도 황홀한 여정입니다.","김고은, 배우"],["인생은 정해진 하나의 정답을 찾는 과정이 아니라, 나만의 해답을 찾아 남을 설득시키는 과정이다.","김고은, 배우"],["제 연기를 보고 단 한 명이라도 위로를 받는다면, 저는 평생 배우라는 직업을 사랑할 것입니다.","김고은, 배우"],["제가 던지는 공 하나가 팀의 승패를 가른다는 압박감, 그 무거운 책임감을 오히려 즐기려 노력합니다.","김광현, 프로야구 선수"],["포수의 미트만 보고 전력으로 공을 뿌릴 때, 관중들의 함성이 사라지고 세상은 완벽한 진공 상태가 됩니다.","김광현, 프로야구 선수"],["모든 사람이 저를 좋아할 순 없어요. 저를 싫어하는 사람의 마음까지 바꾸려 애쓰지 마세요.","김구라, 방송인"],["방송에서 거짓말을 하지 않으려 노력합니다. 시청자들은 귀신같이 진짜와 가짜를 구별해 내거든요.","김구라, 방송인"],["세상에 당연한 것은 없다. 내가 누리는 모든 것에 감사할 줄 알아야 한다.","김구라, 방송인"],["매번 다른 얼굴을 꺼내 보여드리기 위해, 슛 들어가기 전 스스로를 벼랑 끝으로 몰아세웁니다.","김남길, 배우"],["수많은 오디션에서 떨어졌던 뼈아픈 경험들이 연기의 폭을 넓혀주는 가장 훌륭한 재산이 되었습니다.","김남길, 배우"],["타인의 평가에 나를 맞추려 하지 않고, 내 안의 목소리에 더 귀 기울이려 합니다.","김다미, 배우 신은 책상머리에서 나오는 것이 아니라, 현장에서 치열하게 고객의 불만과 목소리를 듣는 흙먼지 나는 과정에서 탄생합니다.","김봉진, 우아한형제들 창업자"],["수많은 오답을 겪어본 사람만이, 비로소 자기 인생의 진짜 정답을 찾아낼 수 있습니다.","김상욱, 물리학자 및 교수"],["한 걸음 느리게 가더라도, 주변 풍경과 사람들을 눈에 담으며 제대로 걷고 싶습니다.","김선호, 영화배우"],["일구이무(一球二無), 공 하나에 두 번째는 없다는 마음으로 전력을 다해 던져라.","김성근, 프로야구 감독"],["한계는 내 머릿속에만 존재할 뿐, 몸은 아직 더 뛸 수 있습니다.","김성근, 프로야구 감독"],["말하기 전에 한 번 더 생각하는 신중함이, 말실수를 줄이고 롱런하는 MC의 비결입니다.","김성주, 아나운서 출신 MC"],["단 한 줄의 대사라도 그 안에 담긴 인물의 역사를 상상하며 수백 번 입안에서 굴려봅니다.","김성철, 배우"],["무대에서 노래를 부르든, 카메라 앞에서 연기를 하든, 결국 제 진심을 세상에 던진다는 본질은 똑같습니다.","김세정, 가수 겸 배우"],["최고의 무대는 배우 혼자 만드는 것이 아닙니다. 앙상블과 스태프들의 땀방울이 모여 기적을 이룹니다.","김소현, 뮤지컬 배우"],["누군가의 아역에서 벗어나 저만의 온전한 이름으로 서기까지 숱한 성장통을 기꺼이 겪었습니다.","김소현, 영화배우"],["음식에는 요리사의 진심이 들어가야 합니데이. 대충 속이려 들면 손님이 가장 먼저 알아챕니다.","김소희, 셰프"],["눈물이 왈칵 쏟아지는 감정 연기도, 수십 번의 치밀한 대본 분석 끝에 나오는 철저한 계산입니다.","김수현, 배우"],["어제보다 단 1밀리미터라도 더 깊어진 눈빛을 보여주기 위해 카메라 앞에서 매번 절박해집니다.","김수현, 배우"],["잘생긴 배우로 남기보다, 어떤 옷을 입혀도 찰떡같이 소화해 내는 도화지 같은 배우로 기억되고 싶습니다.","김수현, 배우"],["화려한 스포트라이트 뒤에 숨겨진 차가운 현실을 버텨내는 것이 스타의 숙명입니다.","김수현, 배우"],["내 앞길은 누군가에게 의존하는 것이 아니라, 내 두 발로 직접 당당하게 개척하는 것이다.","김숙, 방송인"],["웃음은 인간관계의 윤활유입니다. 팍팍한 삶 속에 쉼표를 찍어드리는 것이 제 직업의 본질이죠.","김숙, 방송인"],["고객의 불편함에서 시작하지 않는 비즈니스는 결코 오래 살아남을 수 없습니다.","김슬아, 컬리 대표"],["당연하게 받아들여지는 관행에 '왜?'라고 질문을 던지는 순간, 비로소 세상을 바꿀 수 있는 혁신의 씨앗이 싹틉니다.","김슬아, 컬리 대표"],["스타트업은 매일매일이 낭떠러지에서의 서바이벌입니다. 실패를 두려워할 시간이 있다면 차라리 한 번이라도 더 과감하게 시도해 봐야 합니다.","김슬아, 컬리 대표"],["완벽한 서비스란 세상에 없습니다. 끊임없이 고객의 쓴소리를 수용하고 매일매일 조금씩 진화하는 지독한 끈기만 있을 뿐입니다.","김슬아, 컬리 대표"],["남을 깎아내려 얻는 억지웃음보다, 스스로 망가지며 주는 따뜻한 웃음이 훨씬 가치 있습니다.","김신영, 방송인"],["내 몫은 스스로 챙기고 증명해야 한다. 세상은 결코 알아서 챙겨주지 않는다.","김연경, 전 배구 국가대표"],["내가 흔들리면 모두가 무너집니다. 스스로를 가장 먼저 지켜내야 합니다.","김연경, 전 배구 국가대표"],["부상을 핑계 대고 싶지 않습니다. 코트 위에 서 있는 이상, 저는 팀을 승리로 이끌어야 할 책임이 있는 에이스니까요.","김연경, 전 배구 국가대표"],["위기 상황일수록 피하지 않고 정면으로 부딪히는 용기가 필요하다.","김연경, 전 배구 국가대표"],["99도까지 열심히 온도를 올려두어도 마지막 1도를 넘기지 못하면 물은 끓지 않는다.","김연아, 전 피겨스케이팅 국가대표"],["무언가를 이뤄내야 한다는 거창한 압박감보다, 오늘 하루 내가 할 수 있는 것에만 집중했습니다.","김연아, 전 피겨스케이팅 국가대표"],["물이 끓기 전 99도에서 멈추면 아무 소용이 없습니다. 마지막 1도를 버티세요.","김연아, 전 피겨스케이팅 국가대표"],["슬럼프는 내면의 꾀병입니다. 핑계 대지 말고 묵묵히 하던 대로 계속하는 수밖에 없습니다.","김연아, 전 피겨스케이팅 국가대표"],["처음부터 겁먹지 마라. 막상 부딪혀보면 생각보다 아무것도 아닐 때가 많다.","김연아, 전 피겨스케이팅 국가대표"],["새로운 언어나 기술을 배우는 최고의 비결은, 틀리는 것을 부끄러워하지 않는 뻔뻔함이다.","김영철, 방송인"],["우리가 읽는 모든 책은 우리 내면에 꽁꽁 얼어붙은 바다를 산산조각 깨부수는 날카로운 도끼가 되어야 합니다.","김영하, 소설가"],["책을 읽지 않는 사회는 다른 사람의 고통에 공감하는 능력을 상실하게 됩니다. 우리는 타인의 마음을 읽기 위해 책을 읽습니다.","김영하, 소설가"],["사격은 멘탈 싸움입니다. 세상의 소음을 차단하고 오직 과녁과 나침반처럼 정확한 제 감각만을 믿습니다.","김예지, 사격 국가대표"],["총구를 당길 때는 세상에 오직 저와 표적만 존재합니다.","김예지, 사격 국가대표"],["총구를 표적에 겨눌 때의 그 차가운 몰입감, 저는 그 서늘한 정적의 순간을 가장 사랑합니다.","김예지, 사격 국가대표"],["성공의 반대말은 실패가 아니라 도전을 포기하는 것입니다. 계속 두드리세요.","김용건, 배우"],["중고 거래를 넘어 동네 이웃들의 따뜻한 연결고리를 만드는 것이 당근이 꿈꾸는 궁극적인 가치입니다.","김용현, 당근마켓 공동대표"],["상상력의 한계는 없습니다. 우리가 머릿속으로 미친 듯이 그릴 수 있다면, 그것은 반드시 스크린 위에 경이롭게 구현할 수 있습니다.","김용화, 영화감독"],["잘하려고 발버둥 치기보다, 매 순간 진심을 다해 버티는 것이 제 연기의 비결입니다.","김우빈, 배우"],["카메라 앞에서는 핑계가 통하지 않습니다. 오직 결과물로만 제 존재 가치를 증명해야 하니까요.","김우빈, 배우"],["과녁을 향해 활시위를 당길 때, 심장 박동 소리마저 통제하는 극한의 고요함 속으로 들어갑니다.","김우진, 양궁 국가대표"],["과녁의 정중앙을 뚫어버리는 쾌감은, 그 이전에 활시위를 당기며 견뎌낸 수천 시간의 고요함 덕분입니다.","김우진, 양궁 국가대표"],["심장이 터질 것 같은 긴장감 속에서도, 활시위를 당기는 순간 세상은 고요해지고 과녁만 보입니다.","김우진, 양궁 국가대표"],["심장이 터질 것 같을 때는 과녁의 정중앙만 봅니다. 내 안의 두려움을 활시위와 함께 날려 보냅니다.","김우진, 양궁 국가대표"],["시청자들이 '이거 내 이야기인데?' 하며 무릎을 칠 때, 스케치 코미디는 비로소 완성됩니다.","김원훈, 코미디언 (숏박스)"],["시청자들이 '이거 완전 내 얘기인데?'라며 공감할 때, 콘텐츠 제작자로서 최고의 희열을 느낍니다.","김원훈, 코미디언 (숏박스)"],["어릴 적부터 카메라 앞이 제 놀이터였고, 지금은 가장 치열하고 사랑하는 삶의 현장입니다.","김유정, 영화배우"],["노래는 공기를 울리는 것이 아니라, 사람의 마음을 울리는 물리적인 파동이자 마법입니다.","김윤아, 자우림 보컬"],["우울함의 밑바닥까지 긁어모아 만든 노래가 역설적으로 누군가에겐 살아갈 힘이 되더군요.","김윤아, 자우림 보컬"],["위로하려 애쓰지 않습니다. 그저 저의 가장 깊은 우울을 노래함으로써 역설적인 공감을 이끌어낼 뿐입니다.","김윤아, 자우림 보컬"],["포기하고 싶은 그 순간에 한 번 더 펜을 쥐는 끈기가 기적을 만듭니다.","김은숙, 드라마 작가"],["가장 한국적인 정서와 디테일이 묻어나는 장르물이, 결국 세계 시장에서도 가장 독창적인 작품으로 인정받습니다.","김은희, 드라마 작가"],["최고의 대본은 천재적인 머리에서 나오는 것이 아니라, 사람들을 끈질기게 관찰하고 발로 뛰며 인터뷰하는 과정에서 나옵니다.","김은희, 드라마 작가"],["치밀한 준비 없이 우연히 얻어지는 좋은 결과는 세상에 없습니다.","김은희, 드라마 작가"],["나를 사랑한다는 건, 나의 부족하고 찌질한 모습까지도 온전히 인정해 주는 것입니다.","김이나, 작사가 및 방송인"],["단어 하나하나에 진심을 꾹꾹 눌러 담으면, 그 메시지는 반드시 누군가의 가슴에 닿습니다.","김이나, 작사가 및 방송인"],["모든 평범한 일상 속에는 반짝이는 의미와 가사가 숨어 있다.","김이나, 작사가 및 방송인"],["슬픔도 수많은 감정 중 하나일 뿐입니다. 그 감정이 나를 완전히 삼키게 두지 마세요.","김이나, 작사가 및 방송인"],["e스포츠는 단순한 오락이 아닙니다. 철저한 분석과 피지컬, 그리고 팀워크가 만들어내는 21세기 최고의 두뇌 스포츠입니다.","김정균(kkOma), e스포츠 감독"],["10점을 맞혔다는 기쁨도, 8점을 쐈다는 아쉬움도 모두 화살과 함께 날려 보냅니다. 중요한 건 다음 발이니까요.","김제덕, 양궁 국가대표"],["10점을 맞혔다는 환희조차 다음 발을 위해 빠르게 머릿속에서 리셋하는 것이 금메달의 비결입니다.","김제덕, 양궁 국가대표"],["금메달은 제 목에 걸려 있지만, 이 메달의 진짜 주인은 보이지 않는 곳에서 저를 도운 수많은 스태프들입니다.","김제덕, 양궁 국가대표"],["쓸모없어도 괜찮습니다. 당신은 존재하는 것 자체로 이미 충분히 가치 있는 사람입니다.","김제동, 방송인 및 강연자"],["고통과 시련이 찾아왔을 때 피하지 않고 마주하면, 결국 몸도 마음도 단단하게 성장합니다.","김종국, 가수 겸 방송인"],["운동은 헬스장을 나설 때가 아니라, 샤워를 마치고 나올 때 끝나는 것이다.","김종국, 가수 겸 방송인"],["포기하고 싶은 순간에 한 번 더 밀어붙이는 것, 성장은 바로 그 찰나에 일어납니다.","김종국, 가수 겸 방송인"],["겉보기에 화려하고 강해 보이는 사람보다, 거북이처럼 끝까지 포기하지 않고 살아남는 사람이 진짜 강자다.","김종민, 방송인"],["때로는 바보처럼 보일지언정, 계산 없이 매사에 진심으로 부딪히는 사람을 세상은 이기지 못합니다.","김종민, 방송인"],["버티고 버티다 보면 어느새 내 자리가 생깁니다. 예능은 결국 단거리가 아니라 지독한 마라톤이자 엉덩이 싸움입니다.","김종민, 방송인"],["위로를 건네기보다, 당신과 똑같이 아파하고 고뇌하는 사람이 여기 있다는 사실로 공감을 주고 싶습니다.","김종완, 넬(NELL) 보컬"],["인생의 맛은 달콤함만 있는 게 아니에요. 맵고 짠 맛을 다 겪어봐야 진짜 인생의 진미를 알게 되죠.","김준현, 코미디언"],["카메라가 꺼진 뒤에도 동료들을 챙기는 인성이 결국 그 사람의 방송 수명을 결정합니다.","김준호, 코미디언"],["다이어트는 살을 빼기 위해서가 아니라, 내 삶의 통제권을 되찾기 위한 과정입니다.","김지민, 코미디언"],["남의 속도에 맞출 필요 없습니다. 당신만의 시계는 정확히 당신의 시간에 맞춰 흘러갑니다.","김지원, 배우"],["차가운 외면 속에 숨겨진 뜨거운 인간미, 그 이중성을 섬세하게 표현할 때 가장 짜릿합니다.","김지원, 배우"],["무례한 사람에게 억지로 웃으며 져줄 필요 없습니다. 단호하게 나의 선을 긋고 내 존엄성을 지키는 것은 이기적인 게 아니라 당신을 지키는 용기입니다.","김지윤, 관계 전문가"],["기억하세요. 아무리 깊은 절망의 늪이라도, 반드시 빠져나올 수 있는 동아줄은 존재합니다.","김창옥, 소통 전문가"],["나 자신과 친해지지 못한 사람은 타인과의 관계에서도 끊임없이 겉돌게 됩니다. 먼저 내 안의 상처받고 웅크린 나를 꼭 안아주세요.","김창옥, 소통 전문가"],["말에는 그 사람의 내면이 고스란히 담깁니다. 예쁜 말을 쓰는 습관이 결국 팍팍한 내 마음의 온도를 따뜻하게 덥혀줍니다.","김창옥, 소통 전문가"],["말에는 온도가 있습니다. 날 선 팩트폭력보다, 진심이 담긴 따뜻한 말 한마디가 사람을 근본적으로 변화시키는 진짜 힘을 가집니다.","김창옥, 소통 전문가"],["말에는 온도가 있습니다. 따뜻한 말 한마디가 누군가의 얼어붙은 마음을 녹이고 세상을 살리는 기적이 될 수 있습니다.","김창옥, 소통 전문가"],["자존감은 남이 나를 칭찬할 때 생기는 게 아니라, 내가 나를 온전히 존중할 때 비로소 단단해집니다.","김창옥, 소통 전문가"],["진정한 소통은 귀로 듣는 것이 아니라 마음으로 듣는 것이다.","김창옥, 소통 전문가"],["힘들면 힘들다고 말해도 괜찮습니다. 무조건 버티는 것만이 능사는 아닙니다.","김창옥, 소통 전문가"],["과거의 흉터조차도 지금의 나를 단단하게 만든 훈장이라 생각하고 두려움 없이 앞으로 나아가겠습니다.","김채원, 르세라핌 리더"],["두려움 없이 앞으로 나아가는 독기, 그것이 르세라핌이 험난한 세상에서 살아남는 방식입니다.","김채원, 르세라핌 리더"],["다름을 이해하려는 노력이 더 넓은 우주를 여는 열쇠가 됩니다.","김초엽, 소설가"],["꾸준하게 출루하며 팀에 기여하는 것, 그것이 제가 야구를 대하는 가장 성실한 태도였습니다.","김태균, 전 프로야구 선수"],["매 작품마다 제 영혼을 갈아 넣습니다. 연기 앞에서는 언제나 절박하고 처절해야 하니까요.","김태리, 배우"],["자신을 온전히 믿지 못하면, 그 어떤 기회도 잡을 수 없습니다.","김태리, 배우"],["남과 똑같이 해서는 결코 남을 뛰어넘을 수 없습니다. 다르게 생각하는 것을 두려워 마세요.","김태호, 예능 PD"],["남들이 다 가는 뻔한 길에는 더 이상 먹을 것이 없습니다. 외롭더라도 아무도 밟지 않은 눈밭을 가장 먼저 걸어가야 합니다.","김태호, 예능 PD"],["안 가본 길을 갈 때의 두려움보다, 그 길 끝에 있을 설렘에 집중하세요.","김태호, 예능 PD"],["이미 정해진 안전한 길을 가는 것보다, 없던 길을 새로 만들며 걷는 것이 훨씬 재미있다.","김태호, 예능 PD"],["트렌드를 뒤쫓아가려 하지 마세요. 남들이 안 하는 걸 꾸준히 파다 보면 그게 트렌드가 됩니다.","김태호, 예능 PD"],["남들이 다 가는 길에는 먹을 것이 없습니다. 외롭고 힘들더라도 남들이 가지 않은 길을 개척해야 합니다.","김택진, 엔씨소프트 창업자"],["나의 찌질함과 부족함을 인정하는 순간, 마음이 진짜 편해지고 성장할 준비가 됩니다.","김풍, 웹툰 작가"],["내야를 뒹구는 흙투성이 유니폼이 제 가장 큰 훈장입니다. 전력 질주와 허슬 플레이는 팬들에 대한 기본 예의입니다.","김하성, 메이저리그 야구선수"],["넘어지고 무릎이 까져도 1루를 향해 전력 질주하는 것, 그것이 야구를 보러 와주신 팬들에 대한 기본 예의입니다.","김하성, 메이저리그 야구선수"],["미국 무대에서의 성공은 하루아침에 이루어지지 않았습니다. 매일매일 스스로를 채찍질한 결과입니다.","김하성, 메이저리그 야구선수"],["바다 건너 낯선 땅에서도, 흔들리지 않는 멘탈 하나로 매일매일 나를 증명합니다.","김하성, 메이저리그 야구선수"],["수백 번을 넘어져도 훌훌 털고 일어나는 오뚝이 정신이 저를 메이저리그라는 꿈의 무대로 이끌었습니다.","김하성, 메이저리그 야구선수"],["새로운 대안을 제시하고 싶습니다. 정해진 밴드 사운드의 공식을 깨고, 실리카겔만의 사이키델릭한 세상을 짓고 있습니다.","김한주, 실리카겔 보컬"],["캐릭터 뒤에 숨는 순간, 저는 세상에서 가장 뻔뻔하고 자신감 넘치는 사람이 됩니다.","김해준, 코미디언 (최준)"],["나의 결정이 실패로 끝날지라도, 그 책임을 기꺼이 지겠다는 태도가 진정한 어른의 모습입니다.","김형석, 철학자 및 연세대 명예교수"],["나이를 핑계로 새로운 도전을 멈추는 순간, 우리의 진짜 청춘도 시들어버립니다.","김형석, 철학자 및 연세대 명예교수"],["시간이 흐른다는 건, 내가 한 선택들에 책임질 일과 무게가 점점 많아진다는 뜻이다.","김혜수, 배우"],["아무리 화려한 시상식 드레스보다, 현장에서 땀 흘리며 뒹구는 작업복을 입었을 때가 가장 나답고 행복합니다.","김혜수, 배우"],["타인의 잣대로 내 삶의 가치를 매기지 마라.","김혜수, 배우"],["화려한 조명 뒤에 가려진 스태프들의 땀방울을 기억할 때, 비로소 진짜 좋은 연기가 나옵니다.","김혜수, 배우"],["교복을 입든 정장을 입든, 제가 맡은 인물이 화면 속에서 펄떡펄떡 살아 숨 쉬게 만드는 것이 제 유일한 목표입니다.","김혜윤, 배우"],["작은 체구 안에 누구보다 큰 에너지를 품고 있습니다. 진심을 다한 연기는 크기를 가리지 않으니까요.","김혜윤, 배우"],["작은 체구라는 건 저에게 한계가 아닙니다. 폭발적인 에너지를 압축해 놓은 저만의 무기죠.","김혜윤, 배우"],["세상의 모든 위대한 문장도 결국 매일 책상 앞에 앉아 버티는 지루한 시간 속에서 탄생합니다.","김훈, 소설가"],["팀원들이 흔들릴 때 가장 먼저 파이팅을 외치며 분위기를 멱살 잡고 끌어올리는 것이 고참의 역할입니다.","김희진, 여자배구 선수"],["인생을 다시 산다면 다음번에는 더 많은 실수를 저지르리라.","나딘 스테어, 작가"],["서바이벌에서 수없이 넘어지며 배운 끈기가 지금의 단단한 키스오브라이프를 만들었습니다.","나띠, 키스오브라이프(KISS OF LIFE) 멤버"],["어린 시절의 실패가 저를 더 독하게 만들었습니다. 지금의 키스오브라이프 나띠는 그 누구도 막을 수 없죠.","나띠, 키스오브라이프(KISS OF LIFE) 멤버"],["어린 시절의 좌절이 저를 더 맵고 단단하게 만들었습니다. 핫한 퍼포먼스로 세상에 제 존재감을 각인시킬 겁니다.","나띠, 키스오브라이프(KISS OF LIFE) 멤버"],["리얼리티 예능의 핵심은 '통제'가 아니라 '방목'입니다. 출연자들이 편안하게 놀 수 있는 판을 깔아주는 게 PD의 역할이죠.","나영석, 예능 PD"],["모든 일의 본질은 결국 사람이 사람과 부대끼며 이해하고 공감하는 것이다.","나영석, 예능 PD"],["시청자의 시간을 뺏는 직업인 만큼, 단 1초도 지루하지 않게 화면을 꽉 채워야 한다는 막중한 책임감이 있습니다.","나영석, 예능 PD"],["욕먹을 각오를 하고 선을 아슬아슬하게 타야 진짜 도파민이 터지는 예능을 만들 수 있습니다.","나영석, 예능 PD"],["최고의 기획은 대단한 아이디어가 아니라 꾸준한 관찰에서 나옵니다.","나영석, 예능 PD"],["출연자의 가장 자연스럽고 솔직한 모습을 끄집어내는 것, 그것이 연출의 핵심입니다.","나영석, 예능 PD"],["치열하게 고민하되, 실행할 때는 무식할 정도로 밀어붙여야 합니다.","나영석, 예능 PD"],["콘텐츠의 홍수 속에서 살아남는 유일한 방법은, 가장 '나다운 것'을 뾰족하게 다듬는 것입니다.","나영석, 예능 PD"],["자세히 보아야 예쁘다. 오래 보아야 사랑스럽다. 너도 그렇다.","나태주, 시인"],["단 하나의 명대사를 남기기 위해 수천 번 대본을 소리 내어 읽고 또 읽습니다.","남궁민, 배우"],["선한 역할이든 악역이든, 캐릭터의 밑바닥에 깔린 인간적인 결핍을 찾아내려 집요하게 파고듭니다.","남궁민, 배우"],["최선을 다했다면 결과에 연연하지 마세요. 과정 속에서 성장한 당신은 이미 승자입니다.","남궁민, 배우"],["당장의 실패나 넘어짐이 두려워 새로운 도전을 피한다면, 평생 우물 안에서 제자리에 머물 뿐이다.","남주혁, 배우"],["언젠가 나에게도 기회가 올 것이라는 맹목적인 믿음 하나로 무명 시절을 버텼습니다.","남창희, 방송인"],["언젠가 나침반이 나를 향할 차례는 반드시 온다. 그때를 위해 조용히 실력을 갈고닦고 있을 뿐이다.","남창희, 방송인"],["단 1분의 숏폼 영상 안에도 기승전결과 철저하게 계산된 연출이 필요합니다.","너덜트(전상협), 크리에이터"],["수만 번의 헛스윙이 있었기에 결정적인 순간에 홈런을 칠 수 있었습니다.","노시환, 프로야구 선수"],["실패를 두려워하지 마세요. 실패는 성공을 위한 가장 좋은 재료입니다.","노홍철, 방송인 및 사업가"],["하고 싶은 거 하세요! 인생은 한 번뿐입니다.","노홍철, 방송인 및 사업가"],["대사 한 줄에 인생의 희로애락을 모두 꾹꾹 담아내어, 팍팍한 삶을 견디는 시청자의 심장을 후벼 파는 위로를 전하고 싶습니다.","노희경, 드라마 작가"],["평범해 보이는 사람들의 일상적인 대화 속에 인생의 가장 깊은 철학과 통찰을 툭 던져놓고 싶습니다.","노희경, 드라마 작가"],["어떤 고음이든 두려움 없이 질러버리는 자신감이 메인 보컬의 자존심이자 무기입니다.","닝닝, 에스파(aespa) 멤버"],["내 인생이라는 게임 안에서는 내가 들러리가 아닌 진짜 주인공이 되어야 합니다.","대도서관, 1세대 게임 크리에이터"],["내가 좋아하는 것을 남들도 기꺼이 좋아하게 만드는 뻔뻔한 설득력, 그것이 1인 미디어 크리에이터의 진정한 능력입니다.","대도서관, 1세대 게임 크리에이터"],["성실함이 최고의 재능을 이깁니다.","대도서관, 1세대 게임 크리에이터"],["아무도 내게 기회를 주지 않는다면, 내가 직접 유튜브에 내 무대를 만들고 나만의 방송국을 세우면 됩니다.","대도서관, 1세대 게임 크리에이터"],["아무도 보지 않을 때 묵묵히 꾸준히 하는 사람이 결국 결정적인 기회를 잡는다.","대도서관, 1세대 게임 크리에이터"],["재능이 모자라다면 끈기와 시간으로 채우면 됩니다. 꾸준함을 이길 수 있는 재능은 세상에 없습니다.","대도서관, 1세대 게임 크리에이터"],["트렌드를 좇는 음악은 한 철 입고 버리는 패스트패션과 같습니다. 저는 10년 뒤에 들어도 좋은 클래식을 만듭니다.","더콰이엇(The Quiett), 래퍼 겸 프로듀서"],["작은 기회로부터 종종 위대한 업적이 시작된다.","데모스테네스, 고대 그리스 정치가"],["삶은 매우 복잡하다. 따라서 난해한 영화 역시 허락되어야 한다.","데이비드 린치, 영화감독"],["나는 즐길 수 있는 영화보다 상처를 주는 영화에 더 끌린다.","데이비드 핀처, 영화감독"],["소심하게 굴기엔 인생은 너무나 짧다.","데일 카네기, 자기계발 작가"],["좋은 기회를 만나지 못하는 사람은 하나도 없다. 그것을 잡지 못했을 뿐이다.","데일 카네기, 자기계발 작가"],["서브컬처라 불리는 마이너 한 취향도 뚝심 있게 밀고 나가면 결국 힙(Hip)이 됩니다.","데프콘, 방송인 겸 래퍼"],["수만 번의 패배가 지금의 롤드컵 트로피를 만들었습니다. 패배를 두려워하지 마세요.","데프트(김혁규), 프로게이머"],["흔들리지 않는 뚝심과 꺾이지 않는 마음 하나면 충분합니다.","데프트(김혁규), 프로게이머"],["밑바닥을 쳤을 때야말로, 내 진짜 내면의 단단함을 시험해 볼 수 있는 절호의 기회입니다.","덱스, UDT 출신 방송인 겸 크리에이터"],["스스로 한계를 긋지 마라. 내 인생의 한계는 남이 아니라 내가 정하는 것이다.","덱스, UDT 출신 방송인 겸 크리에이터"],["어차피 욕먹을 거라면, 이리저리 눈치 보지 말고 제가 하고 싶은 대로 시원하게 지르고 당당하게 욕먹겠습니다.","덱스, UDT 출신 방송인 겸 크리에이터"],["포기하는 것도 습관이다.","덱스, UDT 출신 방송인 겸 크리에이터"],["포기하면 당장은 편해지지만, 평생 후회하게 된다.","덱스, UDT 출신 방송인 겸 크리에이터"],["묵묵히 제 갈 길을 가다 보면, 언젠가 저를 알아봐 주는 분들과 반드시 만나게 됩니다.","도경수(D.O.), 가수 겸 배우"],["어제보다 아주 조금 더 나은 연기를 보여드리기 위해 오늘 하루도 맹렬하게 대본과 싸웁니다.","도경수(D.O.), 가수 겸 배우"],["기복이 있다는 주위의 평가를, 예측할 수 없는 폭발적인 캐리력으로 증명하며 통쾌하게 반박하겠습니다.","도란(최현준), HLE LoL 프로게이머"],["드럼 비트는 밴드의 심장 박동과 같습니다. 심장을 멈추지 않고 끝까지 뛰게 하겠습니다.","도운, DAY6 멤버"],["나의 작은 날갯짓이 누군가에게 긍정적인 영향을 줄 수 있다는 것만큼 큰 축복은 없습니다.","도티, 교육 및 게임 크리에이터"],["내가 좋아하는 일로 남에게 인정받는 것만큼 행복한 일은 없다.","도티, 교육 및 게임 크리에이터"],["콘텐츠의 본질은 결국 '재미'와 '공감'입니다. 화려한 편집보다 중요한 건 그 안에 담긴 진심 어린 이야기죠.","도티, 교육 및 게임 크리에이터"],["나는 영화를 만드는 사람이지 판매하는 사람이 아니다. 인간의 삶은 나에게 늘 영감을 준다.","드니 빌뇌브, 영화감독"],["나만의 고유한 색깔을 찾는 것이 결국 나를 가장 가치 있게 만드는 브랜딩입니다.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["나만의 속도대로 천천히 가도 괜찮습니다. 남들보다 늦게 도착한다고 해서 그 풍경이 덜 아름다운 것은 아니니까요.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["누구나 삶의 주인공이 될 수 있습니다. 화려한 연예인이 아니더라도, 당신의 소소한 일상 자체가 위대한 콘텐츠입니다.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["당장 눈앞의 조회수에 일희일비하지 마세요. 당신만의 확고한 철학이 담긴 브랜드를 묵묵히 쌓아 올리는 게 먼저입니다.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["당장의 성과가 보이지 않는다고 조급해하지 마세요. 대나무는 땅 위로 솟아오르기 전 수년간 뿌리를 내립니다.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["모든 사람의 인생에는 자신만의 진도와 속도가 있다.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["브랜딩의 시작은 화려한 포장이 아니라, 진짜 나를 알아가는 것에서 출발한다.","드로우앤드류, 자기계발 및 퍼스널 브랜딩 크리에이터"],["유행을 좇기보다, 10년 뒤에 들어도 촌스럽지 않은 저만의 음악을 만들고 싶습니다.","딘(DEAN), 싱어송라이터"],["음악을 만들 때의 고통은 앨범이 발매되는 순간 완벽한 카타르시스로 바뀝니다.","딘(DEAN), 싱어송라이터"],["사랑하는 사람과 함께 땀 흘리고 운동하는 시간만큼 가치 있고 행복한 투자는 없습니다.","땅끄부부, 홈트레이닝 크리에이터"],["세상의 편견을 깨는 가장 좋은 방법은, 묵묵히 내 할 일을 완벽하게 해내어 결과로 보여주는 것입니다.","라미란, 배우"],["아무리 작은 역할이라도 제 안의 120% 에너지를 쏟아붓지 않으면 직성이 풀리지 않습니다.","라미란, 배우"],["주인공이 아니어도 괜찮습니다. 제가 맡은 역할이 극 속에서 숨 쉬고 있다면 그것으로 충분합니다.","라미란, 배우"],["기싸움에서 밀리지 않는 당당함이 제 생존 방식입니다. 인생은 마이웨이니까요!","랄랄, 크리에이터"],["기죽지 마세요. 내 인생의 기는 다른 누구도 아닌 내가 살리는 겁니다.","랄랄, 크리에이터"],["어차피 다들 각자의 팍팍한 인생 살기 바빠서 남한테 큰 관심 없습니다. 쫄지 말고 당신이 하고 싶은 대로 막 저지르세요.","랄랄, 크리에이터"],["모든 인생은 실험이다. 더 많이 실험할수록 더 나아진다.","랄프 왈도 에머슨, 사상가 및 작가"],["행운이란 100% 노력한 뒤에 남는 것이다.","랭스턴 콜만, 작가"],["서툰 한국어 발음조차도 제 진심을 담아 노래하면 팬들의 마음에 가닿을 거라 믿습니다.","레이, 아이브 멤버"],["화려한 플레이팅보다 중요한 건, 기본기가 탄탄한 스톡과 소스의 깊은 맛입니다.","레이먼 킴, 셰프"],["나는 사람들이 내 영화를 이해하기 전에 내 영화를 느끼길 바란다.","로버트 브레송, 영화감독"],["아이돌 출신이라는 편견을 깨는 가장 완벽한 방법은, 현장에서 남들보다 두 배로 대본을 파고드는 것뿐입니다.","로운, 가수 겸 배우"],["완벽을 향한 강박이 때론 나를 성장시키지만, 가끔은 스스로를 다독이며 내려놓을 줄도 알아야 숨을 쉴 수 있다.","로제, 블랙핑크 멤버"],["도전자의 패기로 겁 없이 부딪히겠습니다. 신인의 무서움을 제대로 보여주며 정글 생태계를 교란하겠습니다.","루시드(최용혁), DK LoL 프로게이머"],["나를 억누르는 중압감조차도 제가 살아있음을 느끼게 해주는 짜릿한 도파민이자 성장 촉진제입니다.","룰러(박재혁), LoL 프로게이머"],["배우가 되기 전 겪었던 수많은 알바와 좌절의 시간들이 지금 제 연기의 가장 소중한 자산입니다.","류경수, 배우"],["누구나 쉽게 따라 할 수 있는 맛있는 레시피가 세상을 조금 더 다정하고 행복하게 만든다고 믿습니다.","류수영(어남선생), 배우 겸 요리 연구가"],["아무리 작은 역할이라도 카메라 앞에서는 제가 세상의 중심이라는 생각으로 연기합니다.","류승룡, 배우"],["연기는 매번 백지상태에서 시작하는 두려운 작업이지만, 그 두려움이 저를 살아 움직이게 합니다.","류승룡, 배우"],["자유로움이란 제멋대로 하는 것이 아니라, 철저한 계산과 연습 끝에 비로소 무의식 속에서 튀어나오는 본능입니다.","류승범, 배우"],["액션은 단순히 주먹을 뻗는 게 아닙니다. 그 주먹 안에 인물의 분노와 슬픔이 담겨야 진짜 액션이죠.","류승완, 영화감독 (베테랑)"],["신이 우리에게 절망을 주는 이유는, 우리를 죽이기 위해서가 아니라 새롭게 깨어나게 하기 위해서다.","류시화, 시인"],["내 안에 숨겨진 광기를 끌어내는 작업은 고통스럽지만, 묘한 해방감을 줍니다.","류준열, 배우"],["잘생기고 예쁜 척하는 연기보다, 삶의 찌든 때가 묻어나는 퍽퍽한 연기에 더 마음이 갑니다.","류준열, 배우"],["걸크러시라는 수식어에 갇히지 않고, 저만의 여유롭고 당당한 애티튜드로 무대를 장악하고 싶습니다.","류진, ITZY(있지) 멤버"],["마운드 위에서는 내가 세계 최고라는 배짱으로 공을 뿌려야 메이저리그 타자들을 압도할 수 있습니다.","류현진, 야구선수"],["마운드에 오르면 수만 명의 관중 소리는 들리지 않습니다. 오직 포수의 미트와 내 손끝의 감각에만 온 신경을 집중합니다.","류현진, 야구선수"],["수만 관중의 야유조차도 나를 향한 환호성으로 마인드 컨트롤하며 마운드 위에서 배짱 있게 공을 뿌립니다.","류현진, 야구선수"],["실전에서는 내가 최고라고 스스로에게 최면을 걸어야 100%의 기량이 나옵니다.","류현진, 야구선수"],["야구공 하나에 제 모든 인생이 담겨 있습니다. 마운드에 오를 때마다 제 삶을 던지는 기분입니다.","류현진, 야구선수"],["가장 나다운 모습으로 무대를 즐기는 것, 그것이 가장 강력한 무기입니다.","리사, 블랙핑크 멤버"],["내 능력에 스스로 한계를 긋지 않는다. 그저 다음 단계로 뛰어넘을 준비를 묵묵히 할 뿐이다.","리사, 블랙핑크 멤버"],["무대 위에서의 한계를 정해두지 않아요. 매번 어제의 저를 과감하게 뛰어넘는 것이 제 목표입니다.","리사, 블랙핑크 멤버"],["내가 만든 안무가 세계를 뒤흔들 때, 창작자로서 온몸에 소름이 돋는 카타르시스를 느낍니다.","리아킴, 댄서 및 안무가"],["화려한 테크닉보다 중요한 건, 음악과 하나 되어 내 감정을 자유롭게 표현하는 뻔뻔함입니다.","리아킴, 댄서 및 안무가"],["무대에서 뿜어져 나오는 파워풀한 보컬은 제 안의 모든 열정과 긍정을 끌어모아 터뜨리는 겁니다.","릴리, NMIXX(엔믹스) 멤버"],["포기하고 싶었던 순간, 저를 다시 무대로 끌어올려 준 건 저를 믿어준 분들의 목소리였습니다.","릴파, 이세돌(이세계아이돌) 멤버"],["결과보다 과정 속에서 얻는 단단함이 더 중요하다.","마동석, 액션 배우 및 제작자"],["단단함은 겉모습이나 물리적인 힘이 아니라, 흔들리지 않는 감정과 멘탈에서 나온다.","마동석, 액션 배우 및 제작자"],["행복한 삶을 살기 위해 필요한 것은 거의 없다.","마르쿠스 아우렐리우스, 로마 황제 및 철학자"],["당신이 마음에 들지 않는 것이 있다면 그것을 바꾸어라. 바꿀 수 없다면 당신의 마음을 바꾸어라.","마야 앤젤루, 작가 및 시인"],["우리의 좌충우돌 성장 스토리가 곧 음악입니다. 매일 조금씩 진화하는 모습을 지켜봐 주세요.","마젠타, 밴드 QWER 멤버"],["사람이 사람을 헤아릴 수 있는 것은 눈도 아니고, 지성도 아니거니와 오직 마음뿐이다.","마크 트웨인, 소설가"],["그룹을 지탱하는 가장 큰 힘은 서로를 향한 존중과 흔들리지 않는 배려에서 나옵니다.","마크, NCT 멤버"],["혼자 빛나는 별보다, 멤버들과 함께 어우러져 더 큰 은하수를 만드는 것이 우리 팀의 힘입니다.","마크, NCT 멤버"],["가장 개인적인 것이 가장 창의적인 것이다.","마틴 스콜세지, 영화감독"],["세상에서 보고 싶은 변화가 돼라.","마하트마 간디, 평화운동가"],["옆집 소년들처럼 친근하고 유쾌하게, 하지만 무대 위에서는 누구보다 힙하게 대중의 마음을 두드리겠습니다.","명재현, BOYNEXTDOOR 리더"],["나이를 핑계로 열정을 끄지 마세요. 가슴이 뛰는 한 우리는 언제나 무대 위에서 가장 빛나는 현역입니다.","모니카, 댄서 및 안무가"],["춤은 거짓말을 하지 않습니다. 연습실 바닥에 흘린 땀방울의 양이 무대 위의 퀄리티를 정확히 증명하니까요.","모니카, 댄서 및 안무가"],["춤을 출 때만큼은 세상의 모든 걱정이 사라지고 오직 음악과 저 자신만 남습니다.","모모, TWICE 멤버"],["금메달의 무게는 제가 보이지 않는 곳에서 흘린 땀방울의 무게와 정확히 비례합니다.","모태범, 전 스피드스케이팅 국가대표"],["내가 어떤 사람인지 정의할 수 있는 건 오직 나 자신뿐입니다.","문별, 마마무 멤버"],["누구나 겪는 일상 속 소심하고 찌질한 모습들이 알고 보면 가장 훌륭한 희극입니다.","문상훈, BDNS 크리에이터 겸 배우"],["인생은 언제나 예측 불가능한 코미디입니다. 울고 싶을 때 한 번 픽 웃어버리면 그만이죠.","문세윤, 코미디언"],["타인과 나를 분리하는 건강한 바운더리를 설정해야, 관계에서 오는 피로감을 줄일 수 있습니다.","문요한, 정신건강의학과 전문의"],["가만히 멈춰 있으면 아무 일도 일어나지 않는다. 일단 문을 두드려라.","미미미누(김민우), 입시 및 대학 생활 전문 크리에이터"],["대학 간판이 평생 밥을 먹여주던 시대는 끝났습니다. 이제는 험난한 세상에서 나만의 무기, 나만의 고유한 스토리를 가진 자만이 살아남습니다.","미미미누(김민우), 입시 및 대학 생활 전문 크리에이터"],["입시가 인생의 전부는 아닙니다. 하지만 지금 목표를 향해 쏟는 그 열정은 평생 여러분의 무기가 될 것입니다.","미미미누(김민우), 입시 및 대학 생활 전문 크리에이터"],["입시의 결과가 인생의 모든 것을 결정짓지는 않지만, 이 과정에서 배운 치열함은 평생의 자산이 됩니다.","미미미누(김민우), 입시 및 대학 생활 전문 크리에이터"],["영화란 진리를 위한, 혹은 진리를 찾기 위한 초당 24개의 거짓들이다.","미카엘 하네케, 영화감독"],["포기를 모르는 불꽃 카리스마는 방송용 콘셉트가 아니라 제 삶을 지탱하는 진짜 원동력입니다.","민호, SHINee 멤버 겸 배우"],["본질에 집중하면 화려한 겉치레는 자연스럽게 덜어집니다.","민희진, 프로듀서"],["크리에이티브는 무에서 유를 뚝딱 창조하는 것이 아니라, 기존의 흩어진 점들을 새롭게 직조해 내는 치밀한 편집의 미학입니다.","민희진, 프로듀서"],["나이를 먹는 것은 늙어가는 것이 아니라, 나라는 책의 페이지가 더 깊고 풍성해지는 과정입니다.","밀라논나(장명숙), 시니어 패션 유튜버"],["모든 사람을 만족시키는 둥근 사람이 될 필요는 없어요. 때로는 모난 내 모습이 누군가에겐 뾰족한 매력이 됩니다.","밀라논나(장명숙), 시니어 패션 유튜버"],["세상 사람들의 칭찬과 비난에 너무 흔들리지 마세요. 결국 내 인생의 핸들은 내가 단단히 쥐고 뻔뻔하게 운전해야 합니다.","밀라논나(장명숙), 시니어 패션 유튜버"],["자신을 먼저 아끼고 사랑하세요. 그것이 그 어떤 옷보다 멋진 최고의 패션입니다.","밀라논나(장명숙), 시니어 패션 유튜버"],["젊음은 젊은이들에게만 낭비하라고 주기엔 너무 찬란하고 아까운 것이다.","밀라논나(장명숙), 시니어 패션 유튜버"],["남의 시선에 갇혀 예쁜 척하기보다, 있는 그대로의 날것을 보여주는 뻔뻔함이 예능의 무기입니다.","박나래, 코미디언"],["시청자가 원한다면 저는 천 번이고 만 번이고 얼굴에 우스꽝스러운 분장을 하고 바닥을 뒹굴 준비가 되어 있습니다.","박나래, 코미디언"],["남 눈치 보며 살기엔 우리 인생이 너무 짧아요. 가슴이 뛰는 일이 있다면 나이를 핑계 대지 말고 당장 내일 시작하세요.","박막례, 시니어 크리에이터"],["남 눈치 볼 시간 없어. 해보고 싶은 건 무조건 당장 다 해봐야 후회가 없지.","박막례, 시니어 크리에이터"],["남의 눈치 볼 시간에 내 건강 챙기고, 하고 싶은 거 당장 시작해라.","박막례, 시니어 크리에이터"],["세상의 편견에 주눅 들지 마세요. 내 인생의 리모컨은 내가 쥐고 있어야 진짜 행복한 채널을 볼 수 있습니다.","박막례, 시니어 크리에이터"],["어차피 한 번 사는 인생, 남 눈치 보지 말고 내 멋대로 살자.","박막례, 시니어 크리에이터"],["인생은 70부터입니다. 여러분 앞에는 무한한 가능성의 도화지가 펼쳐져 있어요.","박막례, 시니어 크리에이터"],["가는 말이 고우면 얕본다.","박명수, 방송인 및 코미디언"],["늦었다고 생각할 때가 진짜 너무 늦은 때다. 당장 시작해라.","박명수, 방송인 및 코미디언"],["세상에 당연한 요행이나 공짜는 없다. 내가 뿌린 만큼, 땀 흘린 만큼 정확히 거둔다.","박명수, 방송인 및 코미디언"],["시작은 반이 아니다. 시작은 시작일 뿐이다.","박명수, 방송인 및 코미디언"],["참을 인이 세 번이면 호구 된다.","박명수, 방송인 및 코미디언"],["티끌 모아 봐야 티끌이다. 펑펑 쓰지 말고 잘 모아라.","박명수, 방송인 및 코미디언"],["나이에 갇히지 않고, 언제나 소년 같은 순수함과 중년의 깊이를 동시에 표현하는 배우가 되고 싶습니다.","박보검, 배우"],["아주 작은 일상에도 매사에 감사하는 습관이 나를 더 긍정적이고 나은 사람으로 이끌어준다.","박보검, 배우"],["언제나 소년의 맑음을 간직하되, 세월이 흐를수록 그 안에 깊은 그림자를 더해가는 배우가 되겠습니다.","박보검, 배우"],["넘어지는 것을 두려워하지 마세요. 툭툭 털고 일어나는 과정 자체가 이미 훌륭한 한 편의 드라마입니다.","박보영, 배우"],["스스로에게 한계를 두는 순간, 정말 거기까지밖에 갈 수 없습니다. 저는 제 한계를 모른 척합니다.","박보영, 배우"],["작은 체구라는 건 제게 결코 한계가 아닙니다. 오히려 남들보다 더 큰 에너지를 폭발시킬 수 있는 저만의 무기죠.","박보영, 배우"],["도전은 언제나 두렵습니다. 하지만 그 두려움을 안고 한 걸음 내딛는 자만이 정상에 섭니다.","박서원, 크리에이티브 디렉터"],["내가 가는 길이 정답이라고 믿고 묵묵히 걸어가면, 언젠가 그 길이 진짜 정답이 됩니다.","박서준, 배우"],["도전하기 전에는 내가 무엇을 할 수 있는지 아무도 모릅니다. 일단 부딪혀 보세요.","박세리, 골프 감독"],["두려움을 극복하는 유일한 방법은 피하지 않고 정면으로 마주하는 것뿐입니다.","박세리, 골프 감독"],["누군가를 위로할 때 섣부른 조언보다, 그저 옆에 가만히 앉아 있어 주는 것이 더 큰 힘이 될 때가 있습니다.","박은빈, 배우"],["아무것도 하지 않으면 불안감만 커지지만, 작은 움직임 하나가 그 불안을 기대감으로 바꿉니다.","박은빈, 배우"],["어제보다 오늘 더 나은 소리를 내기 위해 매일 아침 저 자신과 치열하게 싸웁니다.","박은태, 뮤지컬 배우"],["나는 멈추지 않는다. 나의 한계를 계속해서 넘을 뿐이다.","박재범, 힙합 아티스트 및 기업인"],["남들이 안 된다고 할 때 기어코 증명해 내는 것이 제 방식입니다.","박재범, 힙합 아티스트 및 기업인"],["무대 아래선 평범한 동네 형이지만, 마이크를 쥐는 순간 세상을 뒤집어놓는 악동이 됩니다.","박재범, 힙합 아티스트 및 기업인"],["저만의 그루브로 세상을 타겠습니다. 남의 리듬에 억지로 맞출 필요는 없으니까요.","박재범, 힙합 아티스트 및 기업인"],["지치지 않고 달릴 수 있는 이유는, 나를 믿어주는 사람들에 대한 책임감의 무게를 알기 때문이다.","박재범, 힙합 아티스트 및 기업인"],["아무리 작은 역할이라도 제 안의 모든 에너지를 쏟아부어야 카메라 렌즈를 뚫고 진심이 전달됩니다.","박정민, 배우"],["네트 너머의 상대를 분석하기 전에, 먼저 내 안의 불안감부터 강력한 스파이크로 날려버려야 합니다.","박정아, 여자배구 선수"],["벤치에 앉아있을 때라도 팀을 향한 응원을 멈추지 않는 것, 그것이 진짜 프로의 품격입니다.","박주호, 전 축구 국가대표"],["우리가 흘린 눈물은 결국 우리를 더 단단하고 투명하게 만들어줍니다.","박준, 시인"],["뛰고 또 뛰어도 지치지 않는 이유는, 제 등 뒤에서 응원해 주는 국민들의 함성 소리 때문입니다.","박지성, 전 축구 국가대표"],["몇 번을 쓰러지더라도 다시 일어서겠다. 내 사전에 포기란 없다.","박지성, 전 축구 국가대표"],["불가능하다고 생각하고 선을 긋는 순간, 진짜로 불가능해집니다.","박지성, 전 축구 국가대표"],["모든 평범한 사람의 인생에도 각자의 빛나는 서사가 있습니다.","박지은, 드라마 작가"],["포기하지 않으셨으면 좋겠어요. 그 성공이 조그마한 성공일 수도 있어요. 그런 소소한 도전들이 성공이라고 생각합니다.","박지훈, 배우"],["과정에서 최선을 다했다면 결과에 승복할 줄 알아야 한다.","박진영, 가수 겸 JYP 엔터테인먼트 대표"],["남들보다 잘하려고 하지 말고, 남들과 다르게 하라.","박진영, 가수 겸 JYP 엔터테인먼트 대표"],["인생은 길다. 당장 눈앞의 결과에 너무 일희일비하지 마라.","박진영, 가수 겸 JYP 엔터테인먼트 대표"],["재능은 타고나는 것이지만, 그 재능을 지키는 것은 결국 성실함이다.","박진영, 가수 겸 JYP 엔터테인먼트 대표"],["진실, 성실, 겸손. 기본적이고 당연한 이 세 가지가 오래 살아남는 사람들의 무기입니다.","박진영, 가수 겸 JYP 엔터테인먼트 대표"],["어떤 배역이든 찰떡같이 소화해 내는 감초 연기는, 끊임없이 일상을 모방하는 연습에서 나옵니다.","박진주, 배우 겸 유튜버"],["가장 아름다운 복수는 용서다.","박찬욱, 영화감독"],["복수나 원망에 에너지를 쏟는 것은 영화 속에서나 흥미롭지, 현실에서는 공허할 뿐이다.","박찬욱, 영화감독"],["영화 속의 폭력은 단순한 자극이 아니라, 인간 내면에 숨겨진 잔혹함과 죄의식을 서늘하게 직면하게 만드는 장치입니다.","박찬욱, 영화감독"],["제가 만든 영화가 정답을 제시하기보다, 관객들의 마음속에 끝없는 질문을 던지는 영화가 되길 바랍니다.","박찬욱, 영화감독"],["물속에서는 세상의 모든 소음이 사라지고, 오직 저의 심장 박동 소리와 숨소리만 들립니다.","박태환, 전 수영 국가대표"],["삶은 멀리서 보면 희극이지만 가까이서 보면 비극이라고 하죠. 저는 그 비극 속에서 피어나는 짠내 나는 희망을 씁니다.","박해영, 드라마 작가 (나의 해방일지)"],["연기란 결국 사람에 대한 끝없는 호기심과 애정에서 출발하는 위대한 예술입니다.","박해일, 배우"],["가끔은 부족한 제 모습을 있는 그대로 보여주는 것도 시청자분들과 소통하는 방식이라 생각합니다.","박형식, 배우 겸 가수"],["선배님들의 눈빛을 보며 리액션하는 것만으로도, 현장은 저에게 매 순간 가장 위대한 연기 학교입니다.","박형식, 배우 겸 가수"],["아이돌 출신이라는 꼬리표에 얽매이지 않고, 백지상태에서 선배님들의 연기를 무섭게 흡수했습니다.","박형식, 배우 겸 가수"],["바벨의 무게보다 무거웠던 건 저 자신과의 싸움이었습니다. 한계를 번쩍 들어 올릴 때의 쾌감은 짜릿하죠.","박혜정, 역도 국가대표"],["수천 번을 부른 노래지만, 매번 무대에 오를 때마다 제 안의 모든 감정을 쥐어짜 내어 부릅니다.","박효신, 가수"],["눈빛 하나로 천 마디 대사를 대신할 수 있는, 그런 깊이 있는 내공을 가진 배우로 늙어가고 싶습니다.","박희순, 배우"],["가만히 멈춰 있으면 도태되는 무서운 시대입니다. 어제의 성공 방정식은 과감히 휴지통에 버리고 오늘 다시 백지에서 시작해야 합니다.","방시혁, 하이브 의장"],["아무리 뛰어난 재능이라도 그것을 갈고닦는 지루한 인내심이 없다면 빛을 보지 못합니다.","방시혁, 하이브 의장"],["위대한 결과물은 결코 타협하지 않는 치열한 고민 속에서 탄생합니다.","방시혁, 하이브 의장"],["가장 높은 곳을 향해 방황하는 우리들의 거친 여정조차도 결국 멋진 음악이 됩니다.","방찬, 스트레이 키즈(Stray Kids) 리더"],["제가 하는 음악과 무대가 제 자신보다 누군가에게 더 큰 자부심이 되었으면 좋겠습니다.","방찬, 스트레이 키즈(Stray Kids) 리더"],["작품을 고를 때 가장 중요하게 생각하는 건, '이 이야기가 지금 세상에 꼭 필요한가'입니다.","배두나, 배우"],["디자인은 눈을 즐겁게 하는 것을 넘어, 사람들의 행동을 긍정적으로 변화시켜야 합니다.","배상민, 산업디자이너 및 교수"],["기회는 언제나 묵묵히 준비하며 끝까지 버티는 사람의 문을 두드립니다.","백종원, 외식 사업가 및 방송인"],["내가 좋아하는 일이라도 남을 위해 할 때는 철저하게 계산하고 준비해야 합니다.","백종원, 외식 사업가 및 방송인"],["불만을 두려워하지 마라. 진짜 두려운 건 아무 말 없이 그냥 떠나는 것이다.","백종원, 외식 사업가 및 방송인"],["사람들은 결과만 보지만, 우리는 결과를 만들기 위해 뼈를 깎는 과정을 즐겨야 합니다.","백종원, 외식 사업가 및 방송인"],["실패를 제대로 겪어봐야 어디서 잘못됐는지 알고 다시 일어설 수 있는 내공이 생깁니다.","백종원, 외식 사업가 및 방송인"],["목이 터져라 노래 부르는 이 순간이 제 인생에서 가장 살아있음을 느끼는 찰나입니다.","백현, EXO 멤버"],["무대 위에서의 3분은 영원과 같습니다. 그 순간만큼은 제가 세상의 주인이 된 것 같아요.","백현, EXO 멤버"],["무대 위에서의 3분을 위해, 보이지 않는 곳에서 3만 번의 땀을 흘립니다.","백현, EXO 멤버"],["서로 다르게 자란 다섯 명이 모여 하나의 완벽한 하모니를 낼 때, 그게 바로 아이돌이 보여줄 수 있는 최고의 기적이죠.","범규, 투모로우바이투게더(TXT) 멤버"],["과거의 후회와 미래의 불안감에 내 소중한 '오늘'을 헛되이 저당 잡히지 마세요. 우리는 오직 숨 쉬고 있는 지금 이 순간만 살 수 있습니다.","법륜스님, 즉문즉설 멘토 및 대중 강연자"],["세상에 쓸모없이 버려지는 시간은 없습니다. 지금 겪는 방황도 언젠가 내 인생의 튼튼한 거름이 될 것입니다.","법륜스님, 즉문즉설 멘토 및 대중 강연자"],["청춘은 원래 아프고 흔들리는 시기입니다. 그 흔들림 속에서 단단한 뿌리가 내려집니다.","법륜스님, 즉문즉설 멘토 및 대중 강연자"],["타인에게 위로를 구하기 전에, 먼저 내 마음의 소리에 귀를 기울여야 합니다.","법륜스님, 즉문즉설 멘토 및 대중 강연자"],["필요하다면 지옥에 내려가 악마로부터 영화를 뺏어올 것이다.","베르너 헤어조크, 영화감독"],["상대방의 플레이를 꿰뚫어 보는 통찰력은 수천 시간의 지독한 리플레이 분석에서 나옵니다.","베릴(조건희), KT LoL 프로게이머"],["정해진 메타를 따라가기보다, 끊임없이 연구하여 나만의 롤도사 같은 변수를 창출하는 것이 진짜 실력입니다.","베릴(조건희), KT LoL 프로게이머"],["오랜 기다림 끝에 찾아온 기회 앞에서, 저는 준비된 자의 여유가 아니라 절실함으로 부딪혔습니다.","변우석, 배우"],["포기하지 않고 묵묵히 내 자리를 지키다 보면, 나를 알아봐 주는 나의 '선재'가 반드시 나타납니다.","변우석, 배우"],["시청자가 있기에 내가 존재한다는 사실을 잊어선 안 된다.","보겸, 크리에이터"],["노력은 결코 배신하지 않는다.","보아(BoA), 솔로 가수"],["가장 개인적이고 내밀한 상처를 스크린에 꺼내놓을 때, 역설적으로 전 세계 관객과 가장 깊고 강렬하게 공감하게 됩니다.","봉준호, 영화감독"],["개인적인 두려움과 불안이 가장 창의적인 영감이 될 수 있습니다.","봉준호, 영화감독"],["불안함은 나의 영혼을 갉아먹기도 하지만, 동시에 나를 앞으로 나아가게 하는 가장 큰 원동력이다.","봉준호, 영화감독"],["언어의 장벽이라는 1인치의 장벽을 뛰어넘으면 훨씬 더 많은 영화를 즐길 수 있습니다.","봉준호, 영화감독"],["영화 속 프레임은 한정되어 있지만, 그 안에 담긴 인간의 감정과 서사는 무한하게 확장되어야 합니다.","봉준호, 영화감독"],["지칠 줄 모르는 텐션은 억지로 짜내는 게 아니라, 즐거움을 주고 싶다는 본능입니다.","붐(이민호), 방송인"],["네가 나를 사랑하는 만큼, 나도 나 자신을 더 사랑하는 법을 배워가고 있어.","뷔(김태형), 방탄소년단 멤버"],["수많은 오해와 편견 속에서도, 묵묵히 내 노래를 부르다 보면 진심은 통하게 되어 있습니다.","비챤, 이세돌(이세계아이돌) 멤버"],["예술과 일상은 분리되지 않습니다. 제가 입고 먹고 생각하는 모든 라이프스타일이 곧 저의 음악이 됩니다.","빈지노(Beenzino), 래퍼"],["계획대로 되지 않고 빗나가는 것이 여행의, 그리고 인생의 진짜 묘미입니다.","빠니보틀, 여행 크리에이터"],["고민할 시간에 일단 출발부터 하세요.","빠니보틀, 여행 크리에이터"],["방송을 시작할 때 거창한 계획은 없었습니다. 그저 제가 좋아하는 여행을 영상으로 기록하고 싶었을 뿐이죠.","빠니보틀, 여행 크리에이터"],["새로운 시작에서 가장 중요한 건 완벽한 계획이 아니라 당장 짐을 싸는 용기다.","빠니보틀, 여행 크리에이터"],["세계 곳곳의 날것 그대로를 마주하며 겪는 개고생조차도 결국 저를 성장시키는 최고의 에피소드가 됩니다.","빠니보틀, 여행 크리에이터"],["여행지에서의 돌발 상황처럼, 인생의 변수들도 결국엔 우리를 성장시키는 재미있는 에피소드가 됩니다.","빠니보틀, 여행 크리에이터"],["완벽하게 준비된 상태란 없습니다. 그냥 들이박고 깨지면서 배우는 게 최고입니다.","빠니보틀, 여행 크리에이터"],["부산에서 올라와 바닥부터 뒹굴며 증명했습니다. 출신을 탓하지 마세요, 실력이 곧 명함입니다.","사이먼 도미닉, 래퍼"],["한계는 우리가 넘으라고 존재하는 것입니다. 안티프래자일, 시련이 올수록 우리는 더 강해집니다.","사쿠라, 르세라핌 멤버"],["뼈가 부서져라 춤을 춘다는 건 은유가 아닙니다. 무대 위에서 제 모든 것을 태워버리겠다는 저와의 약속입니다.","산, 에이티즈(ATEEZ) 멤버"],["자연주의 요리는 식재료 본연의 맛을 가리지 않고 그 생명력을 식탁 위로 온전히 끌어올리는 일입니다.","샘 킴, 셰프"],["아이돌도 다 똑같은 사람입니다. 망가짐을 두려워하지 않는 웃음이 저희의 진짜 무기죠.","서은광, BTOB 리더"],["자존감은 남이 칭찬해 줄 때 생기는 게 아니라, 내가 내뱉은 아주 작은 약속들을 스스로 묵묵히 지켜낼 때 비로소 단단해집니다.","서은국, 심리학과 교수"],["행복은 크기가 아니라 빈도입니다. 작고 소소한 행복을 일상에 자주 뿌려두세요.","서은국, 심리학과 교수"],["오디션에서 수백 번 떨어졌던 그 서늘한 기억들이, 카메라 앞에서 저를 절대 방심하지 않게 만듭니다.","서인국, 가수 겸 배우"],["모든 사람에게 친절할 필요는 없지만, 무례할 권리도 누구에게도 주어지지 않았습니다.","서장훈, 전 농구선수 겸 방송인"],["성공하고 싶다면 변명하지 마라. 변명할 시간에 한 번 더 뛰어라.","서장훈, 전 농구선수 겸 방송인"],["세상에 즐기면서 할 수 있는 일은 없다. 치열하게 해야 최고가 된다.","서장훈, 전 농구선수 겸 방송인"],["고객이 무엇을 원하는지 직관적으로 보여주는 데이터야말로 스타트업이 쥐어야 할 유일한 나침반입니다.","서정훈, 카카오스타일 대표"],["데이터는 절대 거짓말을 하지 않습니다. 어설픈 직감에 의존하지 말고, 차가운 숫자가 가리키는 방향을 철저하게 분석하세요.","서정훈, 카카오스타일 대표"],["딕션의 여왕이라는 수식어는 수만 번 대본을 소리 내어 읽고 씹어 삼킨 지독한 연습의 결과물입니다.","서현진, 배우"],["로맨틱 코미디는 그냥 웃기는 게 아닙니다. 가장 정교한 감정의 핑퐁과 철저한 계산이 필요하죠.","서현진, 배우"],["변화를 두려워하면 트렌드에 잡아먹힙니다. 끊임없이 허물을 벗고 저만의 고유한 팝을 창조해야 살아남습니다.","선미, 솔로 가수"],["제가 흘린 눈물만큼 제 마음도, 제 노래도 한층 더 깊어질 거라 믿습니다.","설윤, NMIXX(엔믹스) 멤버"],["솔직하고 털털한 제 성격 그대로를 캐릭터에 녹여냈을 때, 대중분들도 가장 편안하게 공감해 주시더라고요.","설인아, 배우"],["사랑하는 사람들을 지키고 책임지기 위해 묵묵히 버티는 하루하루가 가장 위대한 업적이다.","성동일, 배우"],["말의 무게를 알면 함부로 내뱉을 수 없다. 신중하게 말하라.","성시경, 발라드 가수"],["음악은 사람의 마음을 치유하는 가장 강력한 처방전이다.","성시경, 발라드 가수"],["록은 죽지 않습니다. 저희 밴드의 심장이 뛰는 한, 무대 위에서 영원히 뜨거운 청춘을 노래하겠습니다.","성진, DAY6(데이식스) 리더"],["밴드는 가족보다 더 많은 시간을 부대끼는 공동체입니다. 서로의 숨소리만 들어도 어떤 리듬을 탈지 압니다.","성진, DAY6(데이식스) 리더"],["밴드의 생명은 라이브입니다. 기타 줄이 끊어져도 멈추지 않는 열정을 연주하겠습니다.","성진, DAY6(데이식스) 리더"],["밴드의 심장은 멈추지 않는 드럼 비트처럼, 어떤 시련에도 계속 뛰어야 합니다.","성진, DAY6(데이식스) 리더"],["저희가 써 내려가는 청춘의 감성이 누군가의 첫사랑처럼 풋풋하고 아련하게 기억되었으면 좋겠습니다.","성찬, RIIZE(라이즈) 멤버"],["때로는 살아있는 것조차도 용기가 될 때가 있다.","세네카, 철학자"],["제 연기가 누군가의 지친 하루에 작은 위로가 된다면 배우로서 그것으로 족합니다.","소지섭, 영화배우"],["실패는 끝났다는 뜻이 아니라, 새로운 방향으로 다시 시작하라는 신호입니다.","손석구, 배우"],["인생의 바닥을 치는 인물을 연기할 때, 역설적으로 가장 큰 인간적 매력을 발견하게 됩니다.","손석구, 배우"],["제 안의 다양한 얼굴들을 끄집어내어 대중에게 매번 새로운 충격을 안겨주고 싶습니다.","손석구, 배우"],["추앙받으려 애쓰지 않습니다. 그저 저의 가장 솔직한 밑바닥을 보여줌으로써 공감받고 싶을 뿐입니다.","손석구, 배우"],["악바리 근성 하나로 이 자리에 왔습니다. 흙먼지를 뒤집어쓰더라도 1루를 향해 거침없이 슬라이딩을 합니다.","손아섭, 프로야구 선수"],["체조는 육체의 한계를 극복하는 예술입니다. 고통 속에서 피어나는 완벽한 동작에 모든 희열이 담겨있죠.","손연재, 전 리듬체조 국가대표"],["단순히 예쁜 멜로 주인공이 아니라, 삶의 희로애락을 깊이 있게 담아내는 사람 냄새나는 연기를 좇습니다.","손예진, 배우"],["기본기를 잃으면 모든 것을 잃습니다. 화려함에 눈멀지 마세요.","손웅정, 축구 지도자 (손흥민 선수의 아버지)"],["모든 것은 기본기에서 시작된다. 화려함에 속지 말고 기본을 다져라.","손웅정, 축구 지도자 (손흥민 선수의 아버지)"],["결과가 어떻든 후회 없이 하라.","손흥민, 대한민국 축구 국가대표팀 주장"],["기회가 왔을 때 주저하면 이미 늦은 것이다. 주저 없이 도전하라.","손흥민, 대한민국 축구 국가대표팀 주장"],["어제 넘어진 건 어제의 일일 뿐입니다. 오늘 다시 흙먼지를 털고 그라운드로 뛰어나가면 됩니다.","손흥민, 대한민국 축구 국가대표팀 주장"],["어제보다 나은 오늘, 오늘보다 나은 내일을 위해 묵묵히 땀 흘릴 뿐입니다.","손흥민, 대한민국 축구 국가대표팀 주장"],["어제의 한계는 오늘 깨라고 있는 것이다.","손흥민, 대한민국 축구 국가대표팀 주장"],["저는 아직 최고가 아닙니다. 그저 매 순간 최선을 다해 발전하려는 사람일 뿐입니다.","손흥민, 대한민국 축구 국가대표팀 주장"],["주장 완장의 무게를 기꺼이 즐깁니다. 제가 묵묵히 앞장서서 뛰어야 우리 팀 선수들의 발걸음도 가벼워지니까요.","손흥민, 대한민국 축구 국가대표팀 주장"],["최고의 자리에 오르기 위해 포기했던 수많은 평범한 일상들이 결코 헛되지 않았음을 증명해 보이겠습니다.","손흥민, 대한민국 축구 국가대표팀 주장"],["축구화 끈을 동여맬 때마다, 제 등 뒤에 있는 수천만 국민들의 응원 소리를 떠올리며 책임감을 가집니다.","손흥민, 대한민국 축구 국가대표팀 주장"],["어두운 터널을 지나고 있다면 멈추지 마세요. 계속 걷다 보면 반드시 빛이 보입니다.","솔라, 마마무 리더"],["흙수저라도 목소리 하나에 진심을 담으면 금수저 부럽지 않은 인생을 살 수 있당께요.","송가인, 트로트 가수"],["카메라 앞에서의 두려움을 설렘으로 바꾸는 마인드 컨트롤 훈련을 끊임없이 합니다.","송강, 영화배우"],["결국 영화는 사람이 사람을 이해하는 과정이다.","송강호, 대한민국 대표 영화배우"],["나의 역할은 결국 내가 살아가는 이 시대의 고민과 얼굴을 대신 표현해 주는 것이다.","송강호, 대한민국 대표 영화배우"],["진짜 악역은 소리치지 않습니다. 눈빛 하나로 화면을 압도하는 법을 배웁니다.","송강호, 대한민국 대표 영화배우"],["방송의 트렌드는 돌고 돕니다. 변화를 두려워하지 말고 유연하게 파도에 올라타야 합니다.","송은이, 방송인 및 기획자"],["하루하루의 작은 꾸준함이 켜켜이 쌓여, 결국엔 누구도 흉내 낼 수 없는 나만의 브랜드를 만든다.","송은이, 방송인 및 기획자"],["배우는 선택받는 직업이지만, 스스로를 끊임없이 갈고닦으면 결국 제가 작품을 선택하는 순간이 옵니다.","송중기, 배우"],["배우는 컷 소리가 나기 전까지 카메라 앞에서 어떤 변명도 할 수 없는 외로운 직업입니다.","송중기, 배우"],["외모는 거들 뿐, 결국 배우의 존재감을 증명하는 것은 딕션과 눈빛에 담긴 처절한 노력입니다.","송중기, 배우"],["외모에 대한 칭찬보다 '연기 미쳤다'라는 한 마디가 배우의 심장을 가장 뜨겁게 뛰게 합니다.","송중기, 배우"],["책임질 수 없는 가벼운 말은 입 밖으로 내지 않고, 한 번 내뱉은 말은 무게를 알고 반드시 책임진다.","송중기, 배우"],["멍청해 보일지라도 매사에 진심을 다해 부딪히면, 언젠가 사람들은 그 진심을 알아줍니다.","송지효, 배우 겸 방송인"],["관객의 마음을 움직이려면 제 심장이 먼저 터질 듯이 뜨겁게 뛰어야 합니다.","송혜교, 배우"],["연기는 하면 할수록 더 어렵고, 그래서 매 순간 더 치열하게 매달리게 됩니다.","송혜교, 배우"],["넘어지면 툭툭 털고 다시 일어나면 됩니다. 우리는 언제나 '투모로우(내일)'를 향해 가니까요.","수빈, 투모로우바이투게더(TXT) 리더"],["팬분들이 저희를 보며 작은 위로를 얻는다면, 저희는 목이 터져라 이 청춘을 노래하겠습니다.","수빈, 투모로우바이투게더(TXT) 리더"],["거침없이 할 말을 하고 당당하게 걷는 것, 그게 제가 생각하는 멋진 여성의 표본입니다.","수영, 소녀시대 멤버 겸 배우"],["화려한 수식어보다, 묵묵히 제 몫을 해내는 책임감 있는 배우로 기억되고 싶어요.","수지(배수지), 배우 겸 가수"],["멤버들은 단순한 비즈니스 파트너가 아니라, 제 인생의 가장 찬란한 순간을 함께하는 가족입니다.","수호, EXO 리더"],["팀을 지키기 위해서는 나 하나가 돋보이는 것보다 서로를 위해 한 발짝 물러서는 양보가 필요합니다.","수호, EXO 리더"],["오늘의 나를 만든 것은 어제의 나다. 나를 부정하지 마라.","슈가(민윤기), 방탄소년단(BTS) 멤버"],["지민이와 제이홉이 방탄소년단의 날개라면, 저는 묵묵히 팀을 지탱하는 바닥이 되겠습니다.","슈가(민윤기), 방탄소년단(BTS) 멤버"],["추락은 두렵지만, 착륙은 두렵지 않습니다. 비행이 끝나도 우리는 계속 걸어갈 테니까요.","슈가(민윤기), 방탄소년단(BTS) 멤버"],["남들이 던지는 질문에 답하려 하지 말고, 내가 나에게 던지는 질문에 답하세요.","슈카, 경제 지식 크리에이터"],["단기적인 결과에 연연하지 마세요. 길게 보고 꾸준히 나아가는 사람이 결국 승리합니다.","슈카, 경제 지식 크리에이터"],["세상 돌아가는 복잡한 경제 이야기를 동네 형처럼 쉽고 재밌게 풀어주는 게 제 방송의 본질입니다.","슈카, 경제 지식 크리에이터"],["세상의 흐름을 읽지 못하면 남들이 정해놓은 규칙 속에서 수동적으로 살게 됩니다.","슈카, 경제 지식 크리에이터"],["세상이 당신을 버렸다고 생각하지 마라. 세상은 원래 당신에게 관심이 없다.","슈카, 경제 지식 크리에이터"],["위기를 기회로 바꾸는 힘은 긍정적인 마인드에서 나옵니다. 어떤 상황에서도 유머를 잃지 마세요.","슈카, 경제 지식 크리에이터"],["자본주의 사회에서 경제를 모르는 것은 눈을 감고 운전하는 것과 같습니다. 세상의 흐름을 읽으세요.","슈카, 경제 지식 크리에이터"],["투자는 세상이 어떻게 변해가는지 관찰하는 안목입니다. 경제를 모른다는 건 눈을 감고 험난한 자본주의를 걷는 것과 같습니다.","슈카, 경제 지식 크리에이터"],["남들에게 인정받고 싶다면 백 마디 말로 포장하지 말고, 묵묵히 결과로 증명해 보여라.","스윙스, 래퍼"],["의미란 계속 물을수록 무의미해진다.","스탠리 큐브릭, 영화감독"],["당신의 시간은 제한되어 있다. 다른 사람의 삶에서 낭비하지 마라.","스티브 잡스, 애플 창업자"],["가장 위대한 업적은 '왜'라는 아이 같은 호기심에서 탄생한다. 마음속 어린아이를 포기하지 말라.","스티븐 스필버그, 영화감독"],["언제나 착하고 완벽할 순 없어요. 가끔은 실수도 하고 넘어지는 제 모습까지 사랑하려 노력합니다.","슬기, 레드벨벳 멤버"],["요리도 인생도 타이밍입니다. 하지만 가끔은 나의 감을 믿고 뻔뻔하게 과감히 던져야 할 때도 있죠.","승우아빠, 요리 크리에이터"],["요리든 인생이든, 망쳤으면 너무 좌절하지 말고 다시 처음부터 하면 됩니다.","승우아빠, 요리 크리에이터"],["흔들리지 않는 편안한 라이브 실력은, 보이지 않는 곳에서 끊임없이 런닝머신을 뛰며 노래한 지독한 훈련의 결과입니다.","시은, STAYC(스테이씨) 멤버"],["남을 깎아내려 웃기는 건 삼류입니다. 저 스스로 망가지며 주는 따뜻하고 유쾌한 웃음이 진짜 일류 코미디죠.","신동엽, 코미디언 및 방송인"],["누군가를 비하하지 않고도 웃길 수 있는 것이 진짜 코미디다.","신동엽, 코미디언 및 방송인"],["웃음은 세상을 살아가는 데 있어 가장 강력한 소통의 무기다.","신동엽, 코미디언 및 방송인"],["코미디는 상처받은 사람들의 마음을 가장 따뜻하게 안아주는 위대한 예술입니다.","신동엽, 코미디언 및 방송인"],["화려한 스포트라이트보다, 일상 속 작은 행복을 지킬 줄 아는 단단한 사람이 되고 싶습니다.","신민아, 배우"],["망가짐을 두려워하면 희극인이 아니죠. 얼굴이 구겨질수록 시청자의 주름은 펴지니까요.","신봉선, 코미디언"],["화려한 포장지보다 중요한 건 그 안에 담긴 진짜 내용물입니다. 연기도 마찬가지죠.","신세경, 배우"],["바이올린 선율 하나로 밴드 사운드의 색깔을 완전히 뒤바꿔 놓는 것, 그게 루시(LUCY)만의 독창성입니다.","신예찬, LUCY 리더"],["결국 사람들의 마음을 움직이는 건 화려한 기술이 아니라 진심입니다.","신원호, 드라마 PD"],["사람들이 열광하는 건 무결점의 영웅이 아니라, 결핍을 이겨내고 찌질하게 성장하는 우리 주변의 평범한 주인공입니다.","신원호, 드라마 PD"],["일이 안 풀려도 웃으며 털어내는 긍정의 마인드가 나를 다시 뛰게 합니다.","신유빈, 탁구 국가대표"],["탁구는 리듬입니다. 팽팽한 긴장감 속에서도 긍정적인 미소를 잃지 않으면 결국 내 페이스로 끌고 올 수 있습니다.","신유빈, 탁구 국가대표"],["탁구대 앞에서는 상대가 1위든 누구든 두렵지 않습니다. 그저 내 스윙을 끝까지 뻗어낼 뿐입니다.","신유빈, 탁구 국가대표"],["탁구대 앞에서는 제 작은 키도, 나이도 아무런 문제가 되지 않습니다. 오직 실력만 남습니다.","신유빈, 탁구 국가대표"],["연기에 정답은 없지만, 어제보다 오늘 더 진실에 다가가려 끝없이 질문할 뿐입니다.","신하균, 배우"],["딕션과 발성은 연기의 기본기입니다. 기본이 탄탄해야 감정이 시청자의 귀에 정확히 꽂힙니다.","신혜선, 배우"],["외형적인 변신도 중요하지만, 진짜 변신은 인물의 내면 깊숙한 곳까지 완벽하게 동화될 때 이루어집니다.","신혜선, 배우"],["우주라는 거대한 스케일 앞에서 우리의 걱정은 얼마나 먼지같이 작고 무의미한가요.","심채경, 천문학자"],["우주라는 광활한 공간 속에서, 우리가 서로를 알아보고 사랑한다는 것은 그야말로 기적적인 확률입니다.","심채경, 천  타협할 수 없는 자존심입니다. 한 치의 오차도 없는 칼군무를 위해 수만 번을 맞춥니다.","예지, 있지(ITZY) 리더"],["내가 최고라는 오만함이 아니라, 팀을 위해 언제든 희생할 수 있다는 겸손함이 우승의 비결입니다.","오너(문현준), T1 LoL 프로게이머"],["결과가 어떻든 내 자신에게 당당하게, 후회 없이 칼을 뻗고 내려오겠습니다.","오상욱, 펜싱 국가대표"],["펜싱 피스트 위에서는 0.1초의 망설임이 승패를 가릅니다. 나를 믿고 거침없이 검을 뻗어야만 이깁니다.","오상욱, 펜싱 국가대표"],["펜싱은 찰나의 수싸움입니다. 상대의 검 끝을 두려워하면 이미 진 것입니다. 먼저 찔러야 합니다.","오상욱, 펜싱 국가대표"],["몸싸움을 피하지 않고 묵묵히 리바운드를 잡아내는 헌신이 결국 팀을 우승으로 이끕니다.","오세근, 프로농구 선수"],["예술의 적은 한계의 부재다.","오슨 웰스, 영화감독"],["자신이 해야 할 일을 결정하는 사람은 세상에서 단 한 사람, 오직 나 자신뿐이다.","오슨 웰스, 영화감독"],["돌부처라는 별명처럼, 9회 말 투아웃 만루의 위기에서도 절대 흔들리지 않는 심장을 가져야 합니다.","오승환, 프로야구 선수"],["누구나 다 처음 살아보는 인생이다. 서툰 것이 당연하다.","오은영, 소아청소년 정신건강의학과 전문의"],["누구나 실수를 통해 배웁니다. 스스로에게 다시 일어설 기회를 주세요.","오은영, 소아청소년 정신건강의학과 전문의"],["누구나 실수할 수 있어요. 중요한 건 그 실수를 통해 배우고 다음번엔 조금 더 나은 선택을 하는 것입니다.","오은영, 소아청소년 정신건강의학과 전문의"],["마음의 상처를 방치하지 마세요. 몸이 아플 때 병원에 가듯, 마음이 아플 때도 전문가의 도움이 필요합니다.","오은영, 소아청소년 정신건강의학과 전문의"],["부모가 완벽하지 않다는 것을 솔직하게 인정할 때, 비로소 아이와의 관계도 숨통이 트입니다. 완벽한 부모보다 편안한 부모가 되세요.","오은영, 소아청소년 정신건강의학과 전문의"],["상처받은 마음을 억지로 숨기지 마세요. 울고 싶을 때는 펑펑 울어야 마음에 새살이 돋아날 자리가 생깁니다.","오은영, 소아청소년 정신건강의학과 전문의"],["아이에게 해줄 수 있는 가장 큰 선물은, 부모가 스스로 자기 삶에서 행복해지는 것이다.","오은영, 소아청소년 정신건강의학과 전문의"],["아이의 문제 행동 이면에는 반드시 부모를 향한 간절한 SOS 신호가 숨어 있습니다. 그 숨겨진 신호를 따뜻하게 읽어내는 것이 사랑입니다.","오은영, 소아청소년 정신건강의학과 전문의"],["오늘 하루도 참 잘 버텨냈습니다. 당신은 이미 충분히 훌륭하고 괜찮은 사람입니다.","오은영, 소아청소년 정신건강의학과 전문의"],["화내는 부모 밑에서 자란 아이는 세상의 눈치를 보게 됩니다. 따뜻하고 단호한 훈육만이 아이의 단단한 자존감을 키웁니다.","오은영, 소아청소년 정신건강의학과 전문의"],["내가 먼저 나의 부족함을 인정하고 솔직해져야, 상대방의 마음도 열 수 있습니다.","오킹, 토크 및 종합 예능 크리에이터"],["타인의 시선에 갇혀 당신의 오늘을 망치지 마세요.","오킹, 토크 및 종합 예능 크리에이터"],["무대 위에서 완벽한 3분을 보여주기 위해, 무대 아래선 처절하게 깨지고 구릅니다.","옥주현, 뮤지컬 배우"],["짐승돌이라는 타이틀을 넘어, 무대 위에서 가장 젠틀하고 여유로운 남자로 늙어가고 싶습니다.","옥택연, 2PM 멤버 겸 배우"],["무대 위에서 따뜻한 목소리로 노래하는 순간만큼은 세상 어떤 일보다 행복하고 소중합니다.","온유, SHINee 리더"],["인생은 고뇌와 고독, 고통으로 가득하다. 한번도 실패하지 않는다는 것은 언제나 안이하게 산다는 증거다.","우디 앨런, 영화감독"],["긍정적인 마인드가 때로는 근력보다 훨씬 더 우리를 높이 날게 해줍니다.","우상혁, 높이뛰기 국가대표"],["높이뛰기는 중력을 거스르는 예술입니다. 바를 넘는 그 짧은 체공 시간에 저는 온전히 살아있음을 느낍니다.","우상혁, 높이뛰기 국가대표"],["스스로 한계를 설정하는 순간 기록은 멈춥니다. 저는 제 키보다 훨씬 높은 바벨을 뛰어넘을 때마다 살아있음을 느낍니다.","우상혁, 높이뛰기 국가대표"],["방구석에서 시작한 작은 방송이 수십만 명의 마음을 연결하는 광장이 되었습니다. 세상이 참 재밌죠?","우왁굳, 1세대 인터넷 방송인 및 크리에이터"],["어두운 방 안에서 혼자 끄적이던 우울한 가사가, 수만 명의 마음을 위로하는 마법 같은 순간을 사랑합니다.","우원재, 래퍼"],["수백 곡을 쓰며 수천 번 좌절하지만, 결국 세상 밖으로 나온 노래가 누군가를 위로할 때 모든 걸 보상받습니다.","우지, 세븐틴(SEVENTEEN) 멤버"],["우리의 음악이 세상을 바꿀 순 없겠지만, 누군가의 우울한 오늘 하루는 바꿀 수 있다고 믿습니다.","우지, 세븐틴(SEVENTEEN) 멤버"],["음악을 만드는 과정은 고통스럽지만, 팬들이 떼창해 주는 순간 모든 것이 완벽해집니다.","우지, 세븐틴(SEVENTEEN) 멤버"],["무대 위에서는 가장 화려하게, 무대 아래에서는 가장 겸손하게 성장하겠습니다.","원빈, RIIZE(라이즈) 멤버"],["훌쩍 떠나고 싶을 때 미련 없이 비행기에 몸을 싣는 자유로움, 그게 바로 홀로 여행의 특권이죠.","원지(원지의 하루), 여행 유튜버"],["남과 비교하며 스스로를 괴롭히는 것만큼 미련한 짓은 없습니다. 저는 제 자신과만 경쟁합니다.","웬디, 레드벨벳 멤버"],["성공은 최종적인 것이 아니며, 실패는 치명적인 것이 아니다. 계속하는 용기가 중요하다.","윈스턴 처칠, 전 영국 총리"],["제가 많이 먹는 건 스트레스 때문이 아니라, 세상에 맛있는 게 너무 많기 때문입니다. 행복을 먹는 거죠.","유민상, 코미디언"],["블랙코미디는 상처를 파헤치는 게 아니라, 그 상처에 기발한 반창고를 붙이는 작업입니다.","유병재, 코미디언 겸 작가"],["가장 아름다운 문장은 화려하고 기름진 수식어가 아니라, 진실을 향해 가장 짧고 정확하게 내리꽂히는 문장입니다.","유시민, 작가"],["내 삶의 의미는 다른 누구도 아닌 나 자신이 부여하는 것입니다.","유시민, 작가"],["역사는 승자의 기록이 아니라, 이름 없는 수많은 민초들이 버텨낸 눈물과 땀, 그리고 끈질긴 생명력의 궤적입니다.","유시민, 작가"],["청춘은 원래 불안한 것이다. 불안하지 않다면 청춘이 아니다.","유시민, 작가"],["의사부터 악역까지, 제 안의 다채로운 얼굴을 꺼내어 대중에게 보여드리는 것이 즐겁습니다.","유연석, 영화배우"],["내가 하고 싶은 말보다, 상대방이 듣고 싶은 말을 해라.","유재석, 국민 MC 및 방송인"],["누군가를 비하하는 개그를 하지 않고도 세상 사람들을 박장대소하게 만들고 싶습니다.","유재석, 국민 MC 및 방송인"],["앞에서 할 수 없는 말은 뒤에서도 하지 마라.","유재석, 국민 MC 및 방송인"],["열 번 잘하다가 한 번 실수하는 게 사람입니다. 툭툭 털고 미련 없이 다시 일어나면 됩니다.","유재석, 국민 MC 및 방송인"],["열 번 찍어 안 넘어가는 나무 없다지만, 내 도끼가 썩었는지는 한 번쯤 점검해 봐야 한다.","유재석, 국민 MC 및 방송인"],["우리가 흔히 하는 착각이 내일 해야지 입니다. 내일은 내일 해야 할 일이 있습니다.","유재석, 국민 MC 및 방송인"],["위기를 웃음으로 넘기는 여유, 그것이 팍팍한 세상을 살아가는 우리에게 가장 필요한 훌륭한 생존 기술입니다.","유재석, 국민 MC 및 방송인"],["적게 말하고 많이 들어라. 들을수록 내 편이 많아진다.","유재석, 국민 MC 및 방송인"],["선한 역이든 악역이든, 그 인물만의 타당한 이유를 찾아내어 변호해 주는 것이 배우의 몫입니다.","유태오, 배우"],["극장에서 관객분들이 제가 던진 대사에 박장대소할 때, 배우로서 세상을 다 가진 듯한 희열을 느낍니다.","유해진, 배우"],["무언가에 도전하는 이유는 타인에게 인정받기 위해서가 아니라, 어제의 나를 이기기 위해서다.","유해진, 배우"],["화려한 수식어보다, 묵묵히 밥값 하는 신뢰받는 배우로 오래도록 기억되고 싶습니다.","유해진, 배우"],["건축은 단순히 예쁜 건물을 짓는 것이 아니라, 사람과 사람을 잇는 보이지 않는 길과 광장을 디자인하는 작업입니다.","유현준, 건축가 및 교수"],["다양한 환경과 사람을 만날수록 우리의 생각은 더 넓은 건축물처럼 확장됩니다.","유현준, 건축가 및 교수"],["좋은 건축은 높은 빌딩을 뽐내는 것이 아니라, 사람과 사람이 눈을 맞추고 걷고 싶어지는 다정한 거리를 만드는 것입니다.","유현준, 건축가 및 교수"],["거창한 가르침이나 훈계보다, 나와 결이 같은 소박한 공감이 가장 큰 위로가 됩니다.","유희열, 뮤지션 및 기획자"],["음악과 말은 귀로만 듣는 것이 아니라, 온전한 진심을 담아 마음으로 소통하는 것이다.","유희열, 뮤지션 및 기획자"],["록은 늙지 않습니다. 제 심장이 뛰는 한, 무대 위에서 언제나 청춘의 에너지로 샤우팅 할 것입니다.","윤도현, YB 보컬"],["수많은 풍파 속에서도 팀을 지켜낼 수 있었던 건, 서로를 향한 굳건한 믿음 덕분입니다.","윤두준, 하이라이트 리더"],["세상의 편견에 부딪혔을 때, 화내기보다 실력으로 증명하는 것이 가장 우아한 반격입니다.","윤석금, 웅진그룹 회장"],["위기는 항상 기회의 가면을 쓰고 찾아옵니다. 남들이 위축될 때 과감하게 베팅하는 두둑한 배짱만이 시장의 룰을 바꿉니다.","윤석금, 웅진그룹 회장"],["남들이 쉴 때 한 번 더 운동화 끈을 묶는 것이 유일하고 확실한 비결입니다.","윤성빈, 스켈레톤 선수"],["얼음 트랙을 썰매 하나에 의지해 질주할 때, 두려움보다 스피드가 주는 짜릿함이 저를 살아있게 만듭니다.","윤성빈, 스켈레톤 선수"],["윤아라는 이름 뒤에 숨겨진 제 진짜 모습을 천천히 다듬어가는 과정이 저에게는 연기입니다.","윤아, 소녀시대 멤버 겸 배우"],["늙은이는 낡은이가 아니다. 살아온 경험을 지혜롭게 나누는 사람일 뿐이다.","윤여정, 아카데미상 수상 대배우"],["아쉬운 대로, 못난 대로 그냥 살아가는 겁니다. 우리 모두 이번 인생은 처음이라 완벽할 수 없어요.","윤여정, 아카데미상 수상 대배우"],["우리는 낡아가는 게 아니라 익어가는 것이다.","윤여정, 아카데미상 수상 대배우"],["정상에 오르는 것보다 그곳에 머무는 것이 더 힘들다.","윤여정, 아카데미상 수상 대배우"],["이방인처럼 끊임없이 낯선 환경에 나를 던져야 익숙함에 속지 않고 성장할 수 있습니다.","윤종신, 뮤지션"],["만화는 펜으로 그리는 것이 아니라, 엉덩이로 그리는 것입니다. 끝없는 끈기가 생명이죠.","윤태호, 웹툰 작가 (미생)"],["기다림의 시간은 버려지는 것이 아니라, 단단하게 내실을 다지는 시간입니다.","윤하, 싱어송라이터"],["누구에게나 삶은 만만치 않습니다. 그러니 서로에게 조금 더 친절해야 합니다.","은희경, 소설가"],["불행에 깊이 빠져 있지 마세요. 불행은 당신을 설명하는 서사가 될 수 없습니다.","은희경, 소설가"],["그라운드 안에서는 나이도 경력도 무의미합니다. 지금 당장 가장 많이 뛰고 희생하는 자가 진짜 에이스입니다.","이강인, 축구 국가대표"],["수비수가 나를 향해 태클을 걸어올 때, 두려움보다는 어떻게 뚫고 나갈지에 대한 본능적인 짜릿함이 앞섭니다.","이강인, 축구 국가대표"],["저보다 덩치가 두 배나 큰 선수들 앞에서도 절대 기죽지 않습니다. 제 안에는 그들보다 더 큰 투지가 있으니까요.","이강인, 축구 국가대표"],["중압감과 부담감을 피하지 않고 즐길 줄 알아야 진짜 한 단계 성장합니다.","이강인, 축구 국가대표"],["축구는 팀 스포츠입니다. 내가 빛나는 것보다 팀이 이기는 게 항상 우선입니다.","이강인, 축구 국가대표"],["미래를 예측하는 가장 훌륭한 방법은 내가 직접 그 미래를 창조해 내는 것입니다.","이건희, 삼성그룹 전 회장"],["기회는 낚시와 같다. 조급해하지 말고 철저한 인내심을 가지고 입질이 올 때까지 기다려야 한다.","이경규, 방송인"],["인생은 속도가 아니라 방향입니다. 그리고 그 방향을 향해 끝까지 굴러가는 지독한 끈기입니다.","이경규, 방송인"],["배신의 아이콘이 되어도 예능 속 룰이라면 기꺼이 온몸을 던져 재미를 뽑아냅니다.","이광수, 배우 겸 방송인"],["제가 덜떨어져 보이고 망가짐으로써 시청자분들이 웃을 수 있다면 백 번이라도 망가지겠습니다.","이광수, 배우 겸 방송인"],["제가 좀 부족하고 모자라 보여도 괜찮습니다. 그 허술한 빈틈이 오히려 사람들을 무장해제 시키고 웃게 만들거든요.","이광수, 배우 겸 방송인"],["진정으로 가치 있는 일은 늘 어느 정도의 고통을 수반하기 마련이다.","이국종, 중증외상외과 전문의 및 교수"],["말은 마음의 그릇입니다. 예쁜 말을 담으면 내 마음도 예뻐집니다.","이금희, 아나운서 및 방송인"],["말의 온도가 사람의 마음을 살리기도 하고 얼어붙게 하기도 합니다.","이기주, 에세이 작가"],["타석에 들어서면 홈런을 치겠다는 생각보다, 내가 이 팀의 기둥이라는 책임감으로 배트를 꽉 쥡니다.","이대호, 전 프로야구 선수"],["결과를 미리 걱정하며 두려워하기보다, 카메라가 돌아가는 지금 이 순간의 감정에만 충실합니다.","이도현, 배우"],["아픔을 간직한 캐릭터를 연기할 때는, 제 안의 상처를 조심스럽게 꺼내어 대입해 봅니다.","이도현, 배우"],["캐릭터의 깊은 슬픔을 연기할 때면, 제 영혼의 일부를 떼어주는 것 같은 통증을 느낍니다.","이도현, 배우"],["하루하루는 성실하게 살고, 인생 전체는 되는대로 살아라.","이동진, 영화평론가 및 지식 크리에이터"],["길거리 버스킹에서 배운 생생한 호흡이 저를 흔들리지 않는 더 단단한 가수로 만들었습니다.","이무진, 싱어송라이터"],["기업은 사람이다. 사람을 기르고 존중하지 않으면 기업의 미래는 없습니다.","이병철, 삼성그룹 창업주"],["단 한 줄의 대사라도 그 안에 숨겨진 서사를 찾아내어 집요하게 파고드는 것이 진짜 내공입니다.","이병헌, 배우"],["단 한 컷도 허투루 찍지 않겠다는 절실함이 지금의 나를 만들었다.","이병헌, 배우"],["배우는 카메라 앞에서 핑계를 댈 수 없는 외롭고도 치열한 직업이다.","이병헌, 배우"],["대단한 영웅 이야기보다 우리 주변에 있을 법한 찌질하고 귀여운 사람들의 이야기가 전 더 좋습니다.","이병헌, 영화감독 (극한직업)"],["평범한 소시민의 팍팍한 삶 속에 숨겨진 짠내 나는 유머를 따뜻하게 포착하는 것, 그것이 제가 영화를 만드는 이유입니다.","이병헌, 영화감독 (극한직업)"],["단점을 억지로 가리려 하지 말고, 나의 매력을 찾아 부각하는 것이 메이크업의, 그리고 인생의 진정한 아름다움입니다.","이사배, 뷰티 크리에이터"],["단점을 억지로 지우려 애쓰지 말고, 내가 가진 장점을 어떻게 더 돋보이게 할지 고민하라.","이사배, 뷰티 크리에이터"],["세상의 기준에 내 외모를 끼워 맞추려 하지 마세요. 있는 그대로의 나를 사랑할 때 가장 예쁩니다.","이사배, 뷰티 크리에이터"],["자신을 사랑하는 것이 가장 아름다운 메이크업입니다.","이사배, 뷰티 크리에이터"],["과거의 실패를 부끄러워 숨기기보다, 솔직하게 털어놓고 웃어넘기는 법을 배웠습니다.","이상민, 방송인"],["빙판 위를 내달리는 수십 초를 위해, 저는 수만 시간 동안 허벅지가 터지는 고통을 견뎌냈습니다.","이상화, 전 스피드스케이팅 국가대표"],["수백 번 넘어지고 빙판에 뒹굴면서, 바닥에서부터 다시 치고 올라오는 법을 배웠습니다.","이상화, 전 스피드스케이팅 국가대표"],["자연스러운 연기는 제 안의 수많은 감정들을 솔직하게 인정할 때 비로소 완성됩니다.","이성경, 배우"],["나를 비우고 타인을 채워 넣는 이 고통스러운 작업이 저는 미치도록 즐겁습니다.","이성민, 배우"],["연기는 혼자 잘나서 하는 게 아닙니다. 상대방의 호흡을 받고 리액션하는 과정에서 진짜 감정이 터집니다.","이성민, 배우"],["조급해하지 않으려 노력합니다. 제게 맞는 속도로, 흔들림 없이 묵묵히 걸어가는 것이 중요하니까요.","이세영, 배우"],["거짓말을 가사에 적지 않습니다. 가장 날 것의 제 밑바닥 감정을 끄집어낼 때 진짜 힙합이 나옵니다.","이센스(E SENS), 래퍼"],["마음만을 가지고 있어서는 안 된다. 반드시 실천하여야 한다.","이소룡, 무술가 및 배우"],["나를 낮춰서 남을 즐겁게 할 수 있다면, 세상에 그것만큼 가치 있고 빛나는 희생도 없습니다.","이수근, 방송인"],["말 한마디로 천 냥 빚을 갚는다지만, 적재적소에 꽂히는 드립 한마디는 예능의 판도를 완전히 뒤집어 놓습니다.","이수근, 방송인"],["유머도, 인간관계도, 기회도 결국엔 타이밍이다. 그 타이밍을 볼 줄 아는 안목을 기르자.","이수근, 방송인"],["모텔 청소부에서 기업의 대표가 되기까지, 실패를 두려워하지 않고 맞서는 맷집이 저를 키웠습니다.","이수진, 야놀자 대표"],["차가운 인상 뒤에 숨겨진 엉뚱하고 따뜻한 면모를 연기로 풀어낼 때 관객들이 느끼는 카타르시스가 있습니다.","이수혁, 배우"],["우리가 부르는 노래가 세상을 바꿀 순 없어도, 오늘 하루 당신의 기분은 바꿀 수 있다고 믿어요.","이수현, AKMU(악뮤) 멤버"],["음악에는 국경도 나이도 없습니다. 진심을 다해 부르면 누구의 마음이든 포근하게 울릴 수 있죠.","이수현, AKMU(악뮤) 멤버"],["투명하고 맑은 목소리로 누군가의 마음에 위로의 노래를 살포시 얹어주고 싶습니다.","이수현, AKMU(악뮤) 멤버"],["글쓰기는 결국 나 자신과의 가장 솔직하고 치열한 대화입니다.","이슬아, 작가"],["데이터는 거짓말을 하지 않습니다. 철저한 데이터 분석과 실행력만이 불확실성을 이기는 유일한 무기입니다.","이승건, 비바리퍼블리카(토스) 대표"],["돈을 좇기보다 먼저 사람들이 겪고 있는 불편함을 집요하게 관찰하세요. 혁신적인 비즈니스는 바로 거기서 출발합니다.","이승건, 비바리퍼블리카(토스) 대표"],["스타트업은 비행기에서 뛰어내린 뒤, 땅에 닿기 전에 낙하산을 조립하는 것과 같습니다.","이승건, 비바리퍼블리카(토스) 대표"],["실패를 두려워하는 조직은 결코 혁신할 수 없습니다. 맘껏 실패할 수 있는 놀이터를 만들어야 합니다.","이승건, 비바리퍼블리카(토스) 대표"],["아무것도 하지 않으면 아무 일도 일어나지 않습니다. 완벽하게 준비되지 않았더라도 일단 들이받고 부딪혀보는 실행력이 전부입니다.","이승건, 비바리퍼블리카(토스) 대표"],["안정적인 길을 박차고 나오는 용기가 없었다면, 지금의 토스와 혁신은 세상에 존재하지 않았을 것입니다.","이승건, 비바리퍼블리카(토스) 대표"],["혁신은 책상머리에서 나오는 것이 아닙니다. 고객이 겪는 그 짜증 나는 불편함을 집요하게 파고들 때 비로소 탄생합니다.","이승건, 비바리퍼블리카(토스) 대표"],["땀은 결코 배신하지 않는다. 진부한 말이지만 변하지 않는 진리입니다.","이승엽, 야구 감독"],["야구는 실패의 스포츠입니다. 3할을 치면 훌륭한 타자라는 건, 7번의 실패를 딛고 일어선다는 뜻이죠.","이승엽, 야구 감독"],["톡톡 튀는 제 성격을 건방지다고 욕할 때, 저는 그라운드 위에서 실력으로 통쾌하게 증명해 보였습니다.","이승우, 축구선수"],["이름 없는 무명 가수에서 벗어날 수 있었던 건, 나만의 장르를 끝까지 고집한 뚝심이었습니다.","이승윤, 싱어송라이터"],["누구나 자신이 머무는 공간을 아름답게 꾸밀 권리가 있고, 우리는 그 진입장벽을 낮추는 역할을 합니다.","이승재, 버킷플레이스(오늘의집) 대표"],["음악은 경쟁이 아닙니다. 내 영혼의 색깔을 세상 사람들과 나누는 아름다운 대화일 뿐이죠.","이승철, 가수"],["나는 인생의 실망스러운 단면들을 드라마에 담고자 노력한다.","이안, 영화감독"],["카메라가 돌아가는 순간, 저는 세상에서 가장 자유로운 영혼이 됩니다.","이엘, 배우"],["망친 그림이라도 일단 끝까지 완성해 봐야, 다음 그림을 더 잘 그릴 수 있습니다.","이연, 미술 및 동기부여 유튜버"],["실패가 두려워 아무것도 하지 않는 거머리 같은 완벽주의를 과감히 버리세요. 엉망진창이라도 일단 선을 긋는 무모한 실행력이 필요합니다.","이연, 미술 및 동기부여 유튜버"],["완벽하게 그려내려 부담 갖지 말고, 망치더라도 일단 선을 긋고 끝까지 완성하는 경험을 차곡차곡 쌓아라.","이연, 미술 및 동기부여 유튜버"],["완벽하게 하려고 시작을 미루기보다, 일단 작게라도 선을 그어보는 것이 중요합니다.","이연, 미술 및 동기부여 유튜버"],["우리의 가슴을 뛰게 하는 것은 거창한 목표가 아니라, 오늘 하루 한 가지 일을 완수했다는 작은 성취감입니다.","이연, 미술 및 동기부여 유튜버"],["자신만의 고유한 서사를 갖춘 사람은 어떤 트렌드의 변화에도 흔들리지 않습니다.","이연, 미술 및 동기부여 유튜버"],["칼집 한 번, 불 조절 한 번에 주방에서 버틴 40년의 세월과 땀이 고스란히 담겨 있습니다.","이연복, 중식 셰프"],["가식 없이 솔직한 날것의 리액션이야말로 억지로 짜낸 연출을 이기는 가장 강력한 폼 미친 예능의 무기입니다.","이영지, 래퍼 겸 방송인"],["예능에서의 유쾌한 이영지와 무대 위에서 랩을 뱉는 이영지는 다릅니다. 마이크를 잡을 땐 피 튀기게 진지합니다.","이영지, 래퍼 겸 방송인"],["진짜 힙합은 과격한 욕설이 아니라, 내 삶의 찌질함까지 솔직하게 뱉어내는 용기입니다.","이영지, 래퍼 겸 방송인"],["편견에 맞서 당당하게 랩을 뱉을 때, 진짜 제 자신이 살아 숨 쉬는 걸 느낍니다.","이영지, 래퍼 겸 방송인"],["누군가를 비하하는 개그보다, 팍팍한 현실을 유쾌하게 꼬집는 촌철살인의 웃음을 주고 싶습니다.","이용진, 코미디언"],["거창한 서사보다 소소한 일상의 공감이 때로는 가장 큰 위로가 됩니다.","이우정, 드라마 작가"],["남의 눈치 보며 예쁜 척하기엔 제 안의 개그 본능이 너무 강력하게 꿈틀거립니다.","이은지, 코미디언 (코미디빅리그)"],["가벼워 보일지언정 매사에 긍정적이고 미친 듯이 에너지를 쏟는 것이 제 생존 방식입니다.","이이경, 배우 겸 방송인"],["현장에서 선배님들의 연기를 보는 것만으로도 매 순간이 엄청난 수업입니다. 저는 그저 스펀지처럼 흡수할 뿐이죠.","이재욱, 배우"],["자연스러운 연기란 대사를 외우는 것이 아니라, 그 인물의 생각과 호흡을 훔쳐 오는 것입니다.","이재인, 배우"],["당연했던 일상이 멈춰 섰을 때, 비로소 우리는 매 순간이 기적이었음을 배웁니다.","이적, 싱어송라이터"],["매일 주어지는 당연한 하루가 얼마나 소중한지 깨닫는 순간, 삶은 훨씬 풍요로워집니다.","이적, 싱어송라이터"],["아무리 화려한 삶도 결국엔 일상이다. 일상을 사랑하라.","이적, 싱어송라이터"],["일상에서 누리던 당연한 것들이 결코 당연하지 않음을 깨달을 때 진정한 감사가 시작된다.","이적, 싱어송라이터"],["무명이라는 길고 어두운 터널을 지나올 때, 저를 지탱해 준 건 언젠가 빛을 볼 거라는 저에 대한 믿음이었습니다.","이정은, 배우"],["주연보다 빛나는 조연은 없습니다. 묵묵히 극의 뼈대를 받쳐주는 든든한 주춧돌이 되고 싶습니다.","이정은, 배우"],["카메라가 꺼진 뒤의 고독을 즐길 줄 알아야, 카메라 앞에서의 화려함을 완벽하게 통제할 수 있습니다.","이정재, 배우"],["행운이나 기회는 내가 묵묵히 실력을 갖추고 준비되었을 때만 비로소 문을 두드린다.","이정재, 배우"],["아버지의 이름표를 떼고, 저만의 야구 철학으로 메이저리그에 당당히 제 이름을 새기겠습니다.","이정후, 메이저리그 야구선수"],["어제의 성적에 취해있지 않고, 매일 새로운 타석에 서는 마음으로 임합니다.","이정후, 메이저리그 야구선수"],["타석에 들어서면 오직 공 하나만 보입니다. 과거의 실패도, 미래의 부담도 타석 밖으로 모두 던져버립니다.","이정후, 메이저리그 야구선수"],["타석에 들어서면 오직 투수의 손끝과 야구공만 보입니다. 세상 모든 소음이 완벽하게 음소거가 되죠.","이정후, 메이저리그 야구선수"],["타석에 들어설 때는 홈런을 노리지 않습니다. 어떻게든 공을 방망이에 맞혀 출루하겠다는 끈질김이 제 무기입니다.","이정후, 메이저리그 야구선수"],["타석에 들어설 땐 내 앞의 투수 외에 세상 모든 것이 음소거가 되는 완벽한 몰입의 상태가 됩니다.","이정후, 메이저리그 야구선수"],["연기라는 건 결국 사람을 관찰하고 이해하는 일에서부터 출발한다고 믿습니다.","이제훈, 배우"],["평범한 일상 속의 소소하고 찌질한 디테일을 수집하는 취미가 제 연기의 가장 큰 자산입니다.","이제훈, 배우"],["작품이 끝나면 지독한 후유증에 시달리지만, 그 고통조차도 제가 연기를 사랑한다는 뚜렷한 증거입니다.","이종석, 배우"],["흥행에 대한 부담감은 매번 있지만, 카메라가 돌아가는 순간만큼은 그저 역할에 온전히 미쳐버립니다.","이종석, 배우"],["액션도 결국 감정의 표현입니다. 몸짓 하나에 캐릭터의 희로애락을 모두 담아야 합니다.","이준기, 영화배우"],["작품 속에서 제가 맡은 인물이 톱니바퀴처럼 완벽하게 맞물려 돌아갈 때 최고의 카타르시스를 느낍니다.","이준혁, 배우"],["기적은 하늘에서 뚝 떨어지는 게 아니라, 하루하루의 치열함이 쌓여 만들어지는 것입니다.","이준호, 가수 겸 배우"],["나를 깎아내리고 무시하는 사람들에게 분노할 시간에, 나를 아낌없이 사랑하고 응원해주는 사람들에게 한 번 더 다정하게 미소 지으세요.","이지영, 사회탐구 일타강사"],["남을 짓밟고 일어서는 독기가 아니라, 나 자신이 무너지지 않도록 지탱하는 건강한 독기를 품으세요.","이지영, 사회탐구 일타강사"],["독기는 남을 깎아내리는 데 쓰는 게 아니라, 나 자신을 채찍질하는 데 써야 한다.","이지영, 사회탐구 일타강사"],["스스로를 귀하게 여겨야 남들도 나를 귀하게 여깁니다. 타인과 비교하며 자신의 가치를 함부로 깎아내리지 마세요.","이지영, 사회탐구 일타강사"],["여러분의 잠재력은 스스로 생각하는 것보다 훨씬 큽니다. 자신에게 한계를 짓지 마세요.","이지영, 사회탐구 일타강사"],["견디고 버티다 보니 밉상에서 호감으로 바뀌더라고요. 존버는 반드시 승리합니다.","이지혜, 방송인 및 유튜버"],["수없이 실패했던 씁쓸한 경험들도 결국엔 제 인생의 훌륭한 밑거름이자 방송의 소재가 되더라고요.","이찬원, 트로트 가수 겸 방송인"],["나는 남들과 다르게 생각하려 애쓰는 게 아니라, 그냥 나만의 생각을 할 뿐이다.","이찬혁, AKMU(악뮤) 멤버"],["남들과 다르게 생각하는 걸 두려워하지 마세요. 그 '다름'이 저만의 가장 힙하고 독보적인 무기입니다.","이찬혁, AKMU(악뮤) 멤버"],["세상의 시선에 굴복하지 않고, 제가 생각하는 힙함을 뚝심 있게 밀어붙이겠습니다.","이찬혁, AKMU(악뮤) 멤버"],["세상의 편견에 맞서 내 진짜 목소리를 내는 것, 그것이 진짜 힙합이고 진짜 로큰롤입니다.","이찬혁, AKMU(악뮤) 멤버"],["어제와 똑같은 노래를 부르고 싶지 않습니다. 매일 새로운 영감으로 세상을 놀라게 하고 싶어요.","이찬혁, AKMU(악뮤) 멤버"],["제 안의 끝없는 반항심과 엉뚱함이 결국 가장 독창적인 멜로디를 만들어냅니다.","이찬혁, AKMU(악뮤) 멤버"],["사람의 가장 밑바닥에 숨겨진 추악함과 연민을 동시에 끄집어내는 작업, 그것이 제가 영화를 만드는 이유입니다.","이창동, 영화감독"],["노래할 때만큼은 장난기를 싹 빼고 온전한 감성으로 대중의 마음을 울리고 싶습니다.","이창섭, BTOB 멤버"],["우리가 일상에서 겪는 수많은 진상과 꼰대들을 희화화할 때, 사람들은 엄청난 사이다와 묘한 카타르시스를 느낍니다.","이창호, 코미디언 (피식대학)"],["일상에서 흔히 마주치는 꼰대, 진상들의 특징을 현미경처럼 관찰하는 것이 제 연기의 비법이죠.","이창호, 코미디언 (피식대학)"],["노력을 이기는 재능은 없고, 노력을 외면하는 결과도 없다.","이창호, 프로 바둑기사 (국수)"],["번뜩이는 묘수 한 번보다, 묵묵하고 평범한 100수가 결국 이길 확률을 높인다.","이창호, 프로 바둑기사 (국수)"],["승부보다 중요한 것은 어떤 상황에서도 흔들리지 않는 평정심을 유지하는 것입니다.","이창호, 프로 바둑기사 (국수)"],["망가짐을 두려워하는 순간 코미디 연기는 죽어버립니다. 기꺼이, 아주 처절하게 망가지겠습니다.","이하늬, 배우"],["망가짐을 불사하고 온몸을 던질 때, 관객들은 그 처절함 속에서 카타르시스를 느낍니다.","이하늬, 배우"],["코믹한 연기일수록 역설적으로 가장 진지하고 치열하게 계산해야 진짜 웃음을 터뜨릴 수 있습니다.","이하늬, 배우"],["어떤 무대든 립싱크 없이 라이브로 관객의 귀를 시원하게 뚫어버리는 것이 가수의 자존심입니다.","이해리, 다비치 멤버"],["상처받은 마음은 억지로 덮어둔다고 낫지 않습니다. 바람이 잘 통하도록 따뜻한 볕에 꺼내어 말려야 비로소 단단한 새 살이 돋습니다.","이해인, 수녀 및 시인"],["과거의 성공 방정식에 얽매이는 순간, 기업의 미래는 죽은 것이나 다름없습니다.","이해진, 네이버 창업자"],["과거의 성공 방정식이 미래를 보장해주진 않습니다. 우리는 매일 새로운 방식으로 실패하고 배워야 합니다.","이해진, 네이버 창업자"],["기술 혁신보다 중요한 것은 그 기술이 사람들의 일상을 얼마나 가치 있게 바꾸느냐입니다.","이해진, 네이버 창업자"],["빠르게 변하는 세상에서 유일하게 변하지 않는 전략은, 끊임없이 배우고 진화하는 것입니다.","이해진, 네이버 창업자"],["실패를 부끄러워하거나 숨기지 마세요. 맘껏 실패하고 빠르게 훌훌 털고 일어날 수 있는 놀이터를 만드는 것이 진정한 리더의 역할입니다.","이해진, 네이버 창업자"],["탑모델의 자리를 내려놓고 방송에서 예능감으로 뒹굴 때, 비로소 대중과 진짜로 가까워짐을 느낍니다.","이현이, 모델 겸 방송인"],["내 자신이 충분히 괜찮다고 생각하면, 누가 뭐래도 괜찮은 겁니다.","이효리, 대중가수"],["내가 예뻐서 빛나는 게 아니라, 내 마음이 편안하니까 예뻐 보이는 거다.","이효리, 대중가수"],["모든 사람에게 사랑받을 필요는 없다. 나를 사랑하는 사람들에게 잘하면 된다.","이효리, 대중가수"],["뭘 훌륭한 사람이 돼? 그냥 아무나 돼. 네가 편안하고 행복하면 그걸로 충분해.","이효리, 대중가수"],["진짜 연기는 대사와 대사 사이의 침묵, 그 짧은 찰나의 눈빛 속에서 폭발합니다.","이희준, 배우"],["매 작품마다 나라는 사람을 완벽히 지우고, 백지상태에서 새로운 인물의 뼈와 살을 붙여나갑니다.","임시완, 배우 겸 가수"],["연기를 향한 갈증은 아무리 작품을 많이 해도 결코 채워지지 않습니다. 그래서 늘 목이 마릅니다.","임시완, 배우 겸 가수"],["평소의 착하고 바른 이미지를 완전히 지우고, 광기 어린 눈빛을 연기할 때 섬뜩한 쾌감을 느낍니다.","임시완, 배우 겸 가수"],["바람의 방향은 바꿀 수 없지만, 화살을 끝까지 밀고 나가는 제 멘탈은 제가 완벽하게 통제할 수 있습니다.","임시현, 양궁 국가대표"],["텐텐텐, 그 완벽한 숫자를 만들기 위해 손가락에 감각이 없어질 때까지 수만 번 활을 쐈습니다.","임시현, 양궁 국가대표"],["활시위를 당길 때 제 심장 박동까지 완벽하게 통제해야, 비로소 과녁의 한가운데를 뚫을 수 있습니다.","임시현, 양궁 국가대표"],["노래로 누군가의 마음에 위로를 전할 수 있다는 것은 제게 가장 큰 축복입니다.","임영웅, 가수"],["트렌드는 쏜살같이 변하지만, 진정성 있게 부르는 노래의 힘은 시대를 초월합니다.","임영웅, 가수"],["평범했던 제 일상이 여러분의 사랑으로 기적이 되었습니다. 언제나 건행하세요!","임영웅, 가수"],["길이 없다면 내가 만들면 됩니다. 그렇게 척박한 땅에서 e스포츠라는 새로운 길을 개척했습니다.","임요환, e스포츠의 황제"],["악역을 연기할 때 제가 가장 먼저 하는 일은, 그 인물 스스로는 자신을 절대 악이라고 생각하지 않게끔 정당성을 부여하는 것입니다.","임지연, 배우"],["맛있는 것을 먹을 때의 단순한 행복함처럼, 매일매일의 평범한 일상을 소소한 기쁨으로 꽉 채워보세요.","입짧은햇님, 먹방 유튜버"],["기술은 도구일 뿐, 그것을 어떻게 영리하게 활용해 내 삶과 생각을 풍요롭게 할지가
