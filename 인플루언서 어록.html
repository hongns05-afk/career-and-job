상을 구원할 수 있습니다.","정세랑, 소설가"],["아주 작은 다정함이 모여 결국 세상을 구한다고 믿습니다.","정세랑, 소설가"],["수학 문제 하나를 끈질기게 붙잡고 늘어지는 경험이, 훗날 험난한 인생의 난관을 돌파하는 강인한 근력을 키워줍니다.","정승제, 수능 수학 일타강사 및 방송인"],["수학은 머리로 하는 게 아니라 엉덩이로 하는 겁니다. 끝까지 버티면 반드시 오릅니다.","정승제, 수능 수학 일타강사 및 방송인"],["안 되면 될 때까지 하세요. 기적은 포기하지 않고 끝까지 버티는 사람에게만 찾아옵니다.","정승제, 수능 수학 일타강사 및 방송인"],["지금 당장 결과가 안 나온다고 너의 인생 전체가 망가지는 것은 절대 아니다.","정승제, 수능 수학 일타강사 및 방송인"],["지금 당장 성적이 안 나온다고 인생이 망하는 게 아닙니다. 이 치열한 시기를 묵묵히 버텨낸 맷집이 훗날 진짜 당신의 실력이 됩니다.","정승제, 수능 수학 일타강사 및 방송인"],["가장 한국적인 디테일이 곧 글로벌에서 통하는 가장 강력한 무기입니다. 우리의 오리지널리티를 굳게 믿고 밀어붙이세요.","정용진, 신세계그룹 회장"],["눈가의 주름은 제가 살아온 세월의 훈장이자, 앞으로 보여드릴 연기의 깊이입니다.","정우성, 배우"],["외형에 대한 칭찬보다, 타인에게 선한 영향력을 주는 사람이라는 말이 더 값지다.","정우성, 배우"],["모든 서바이벌의 잔혹함을 이겨낸 패기로, 엔진 여러분께 단 한 번도 실망시키지 않는 무대를 바칩니다.","정원, 엔하이픈(ENHYPEN) 리더"],["서바이벌에서 살아남은 독기를 잊지 않겠습니다. 우리는 끝없이 한계를 부수는 팀입니다.","정원, 엔하이픈(ENHYPEN) 리더"],["카메라 앞에서는 예뻐 보이려는 욕심을 싹 비워내야 비로소 캐릭터의 진짜 민낯이 드러납니다.","정유미, 배우"],["캐릭터를 분석하기보다 텍스트 안에 담긴 감정의 결을 제 방식대로 자연스럽게 꺼내려 노력합니다.","정유미, 배우"],["재능은 타고나는 것이지만, 그 재능을 갈고닦아 무기로 만드는 것은 온전히 나의 의지입니다.","정유정, 소설가"],["과학은 차갑고 냉정한 것이 아니라, 인간과 세상을 향한 가장 따뜻하고 호기심 어린 시선입니다.","정재승, 뇌과학자 및 교수"],["뇌는 우리가 생각하는 대로 끊임없이 물리적으로 변화합니다. 긍정적인 생각의 회로를 반복하면 내 삶의 태도와 운명도 바뀝니다.","정재승, 뇌과학자 및 교수"],["시청자들이 예측할 수 없는 반전을 치밀하게 설계하고, 그들이 완벽하게 속아 넘어갔을 때 가장 짜릿한 희열을 느낍니다.","정종연, 예능 PD (더 지니어스, 대탈출)"],["시청자의 뒤통수를 치는 반전은, 치밀하게 계산된 수백 장의 기획안에서 나옵니다.","정종연, 예능 PD (더 지니어스, 대탈출)"],["정주영 공법? 그건 해보기나 했어? 머리로 안 된다고 하기 전에 일단 부딪혀보는 겁니다.","정주영, 현대그룹 창업주"],["여성 셰프는 중식을 못한다는 편견을 깨기 위해, 남들보다 두 배 더 무거운 웍을 흔들며 치열하게 버텼습니다.","정지선, 중식 셰프"],["팀이 같은 방향을 보고 걸을 수 있는 이유는 대단한 목표 때문이 아니라, 서로에 대한 애정 때문입니다.","정한, 세븐틴 멤버"],["바른 이미지에 갇히고 싶지 않아요. 제 안의 서늘하고 어두운 얼굴을 끄집어낼 때 살아있음을 느낍니다.","정해인, 배우"],["시간이 지나도 변하지 않는 가치는 결국 진정성 하나뿐입니다.","정해인, 배우"],["칭찬에 너무 들뜨지 않고 비판에 너무 무너지지 않는, 단단한 코어를 가진 배우가 되고 싶습니다.","정해인, 배우"],["막연한 불안함을 있는 그대로 인정하는 순간, 마음의 여유가 생기고 해결책이 보인다.","정형돈, 방송인"],["마음을 치유하는 첫걸음은, 내 안의 상처받은 어린아이를 꼭 안아주고 다독여주는 것입니다.","정혜신, 정신건강의학과 전문의"],["우울함은 비정상적인 감정이 아니라, 쉴 틈 없이 달려온 내 마음이 잠시 쉬어가라고 보내는 아주 자연스럽고 건강한 방어기제일 뿐입니다.","정혜신, 정신건강의학과 전문의"],["성공의 기준은 남이 아니라 내가 정하는 것이다.","제니, 블랙핑크 멤버"],["세상의 편견에 주눅 들지 마세요. 내가 나를 당당하게 사랑할 때 가장 강력한 에너지가 나옵니다.","제니, 블랙핑크 멤버"],["억지로 남을 따라 하는 것이 아니라, 가장 나다운 것을 지켜나갈 때 세상에서 제일 빛난다.","제니, 블랙핑크 멤버"],["다른 사람의 시선에 갇혀 주눅 들며 살기엔, 단 한 번뿐인 내 인생이 너무 아깝습니다.","제시, 가수"],["때로는 세상이 나를 억눌러도, 그 압력을 뚫고 나오는 독기가 결국 사람들을 감동시킵니다.","제시, 가수"],["우리가 부르는 노래 한 곡이 누군가의 우울한 하루를 단 1초라도 위로할 수 있다면, 저는 목이 쉬도록 노래할 겁니다.","제이, 엔하이픈(ENHYPEN) 멤버"],["기대감이 크면 실망도 크다지만, 그 기대를 훌쩍 뛰어넘기 위해 우리는 뼛속까지 갈아 넣습니다.","제이홉(정호석), 방탄소년단 멤버"],["나는 미국 영화계가 여성 감독을 거부하고 있다고 생각한다. 이는 여성의 시각을 거부하는 것이다.","제인 캠피온, 영화감독"],["평생 살 것처럼 꿈을 꾸어라. 그리고 내일 죽을 것처럼 오늘을 살아라.","제임스 딘, 할리우드 배우"],["기회는 언제 올지 모릅니다. 언제 뛰어도 증명할 수 있게 매일 준비할 뿐입니다.","조규성, 축구 국가대표"],["벤치에 앉아있는 시간조차도 경기의 일부입니다. 언제 부름을 받든 단 1분을 뛰어도 100%를 쏟아낼 준비가 되어 있습니다.","조규성, 축구 국가대표"],["저는 대한민국의 평범한 K-고딩 출신입니다. 겉모습은 달라도 핏속에는 깍두기 국물이 흐르죠.","조나단, 유튜버 겸 방송인"],["길거리 패션에서 시작한 작은 열정이 대한민국의 패션 생태계를 송두리째 바꿀 수 있다고 믿었습니다.","조만호, 무신사 창업자"],["모두가 안 될 것이라며 비웃을 때, 그 불가능을 가능으로 바꾸는 무모한 똘끼야말로 스타트업의 가장 강력한 원동력입니다.","조만호, 무신사 창업자"],["항상 사랑스러운 역할만 할 순 없잖아요. 제 안의 어둡고 차가운 면을 끄집어내는 작업이 너무 즐겁습니다.","조보아, 배우"],["때로는 억울하고 답답한 상황도 유쾌하게 넘기다 보면 뜻밖의 기회가 되어 돌아오기도 한다.","조세호, 방송인"],["유재석이라는 사람 옆에서 버텨낸 시간들이 지금의 단단한 조세호를 만들었습니다.","조세호, 방송인"],["세계 최고가 되기 위해 포기해야 했던 수많은 유혹들이 지금의 나를 만들었다.","조수미, 세계적인 소프라노 성악가"],["연습은 얼음처럼 차갑게, 실전은 불꽃처럼 뜨겁게.","조수미, 세계적인 소프라노 성악가"],["세상에 쓸모없는 경험은 없습니다. 모든 경험은 점이 되어 결국 하나의 선으로 연결됩니다.","조승연, 인문학 크리에이터"],["인생은 언제나 불공평합니다. 그 불공평함을 탓하며 주저앉을지, 아니면 뚫고 나갈지는 온전히 나의 굳은 의지와 선택에 달려 있습니다.","조승연, 인문학 크리에이터"],["무대 위에서는 제가 가진 모든 에너지를 쏟아붓고, 무대 아래서는 철저히 저를 비워냅니다.","조승우, 배우"],["배우는 누군가의 인생을 훔치는 사람이 아니라, 그 인생에 기꺼이 내 몸과 영혼을 빌려주는 사람입니다.","조승우, 배우"],["현장에서 흘리는 땀과 치열한 고민들이 모여 결국 하나의 살아 숨 쉬는 작품을 완성합니다.","조우진, 배우"],["행복은 멀리 있지 않아요. 오늘 먹은 맛있는 밥 한 끼, 친구와 나눈 웃음 속에 다 들어있습니다.","조이, 레드벨벳 멤버"],["어느 순간부터 잘생겨 보인다는 칭찬보다, 그 캐릭터 자체로 보인다는 말이 가장 짜릿한 찬사가 되었습니다.","조인성, 배우"],["좋은 배우가 되기 이전에 좋은 사람이 되어 주변을 챙기는 것이 먼저입니다.","조인성, 배우"],["나의 부족함을 핑계 삼지 말고, 그것을 채워나가는 과정을 즐겨보세요.","조정석, 배우"],["캐릭터의 밑바닥 감정까지 싹싹 긁어모아 뻔뻔하게 보여주는 것, 그것이 배우의 몫입니다.","조정석, 배우"],["지금 흘린 땀방울은 훗날 실전에서 여러분을 지켜주는 가장 강력한 무기가 될 것입니다.","조정식, 수능 영어 일타강사"],["극도로 리얼한 생활 연기는 철저하게 사람들을 관찰하고 끈질기게 분석한 결과물입니다.","조진세, 코미디언 (숏박스)"],["스케치 코미디의 핵심은 하이퍼 리얼리즘입니다. 일상의 소름 돋는 디테일을 복사기처럼 뽑아내는 집요한 관찰력이죠.","조진세, 코미디언 (숏박스)"],["현실의 팍팍함을 1분짜리 숏폼으로 유쾌하게 비틀어 웃음을 주는 쾌감, 그 맛에 코미디 합니다.","조진세, 코미디언 (숏박스)"],["무명 시절의 길고 긴 터널을 견딜 수 있었던 건, 연기를 향한 미련하고도 지독한 짝사랑 덕분입니다.","조진웅, 배우"],["결핍과 가난이 저를 단련시켰습니다. 밑바닥을 겪어본 사람만이 정상의 공기를 깊이 마실 수 있습니다.","조혜련, 코미디언"],["진정한 고수는 상대를 무너뜨리려 하기보다, 내 스스로 무너지지 않으려 한다.","조훈현, 프로 바둑기사"],["저만의 통통 튀는 매력으로 세상의 모든 우울함을 시원하게 날려버릴게요.","주르르, 이세돌(이세계아이돌) 멤버"],["성공으로 가는 길은 복잡하거나 특별하지 않습니다. 단순한 꾸준함이 전부입니다.","주언규(구 신사임당), 재테크 크리에이터"],["실패를 두려워하며 완벽한 타이밍을 기다리다간 영원히 시작할 수 없습니다. 일단 작게라도 저지르세요.","주언규(구 신사임당), 재테크 크리에이터"],["실패하는 것을 두려워하지 마세요. 진짜 두려워해야 할 것은 실패가 두려워 아무것도 시작하지 않는 나의 게으름입니다.","주언규(구 신사임당), 재테크 크리에이터"],["실패하는 비용을 최대한 낮추고, 가볍게 여러 번 시도하세요.","주언규(구 신사임당), 재테크 크리에이터"],["어설픈 천재보다 끝까지 엉덩이를 붙이고 앉아있는 끈기 있고 성실한 둔재가 결국 마지막에 통쾌하게 웃습니다.","주언규(구 신사임당), 재테크 크리에이터"],["완벽함보다 꾸준함이 낫다.","주언규(구 신사임당), 재테크 크리에이터"],["대충 사는 것 같지만 머릿속은 철저한 계산으로 꽉 차 있습니다. 무심함이 저만의 예능 생존법이죠.","주우재, 모델 겸 방송인"],["나쁜 기운은 훌훌 털어버리고, 그저 묵묵히 내일 그릴 컷들을 구상합니다.","주호민, 웹툰 작가"],["나와 내가 사랑하는 사람들을 위해 묵묵히 흘리는 땀방울은 결코 우리를 배신하지 않고 근육으로 남습니다.","지기TV, 운동 크리에이터"],["당신이 생각하는 대로 당신의 삶이 흘러간다. 스스로를 믿어라.","지드래곤(권지용), 빅뱅 리더 겸 프로듀서"],["유행을 좇기보다 유행을 만들어라.","지드래곤(권지용), 빅뱅 리더 겸 프로듀서"],["보이지 않는 곳에서 흘린 피땀 눈물이 지금의 찬란한 방탄소년단을 만들었습니다.","지민(박지민), 방탄소년단(BTS) 멤버"],["부족한 저를 채워주는 건 언제나 곁에 있는 멤버들과, 우리를 믿어주는 아미뿐입니다.","지민(박지민), 방탄소년단(BTS) 멤버"],["하나의 역할을 완벽히 소화하기 위해 제 안의 인격 하나를 새롭게 창조하고 또 완전히 부숴버립니다.","지성, 배우"],["거친 파도 속에서도 흔들리지 않는 단단한 멘탈은, 나 자신을 온전히 믿어주는 것에서부터 출발한다.","지수, 블랙핑크 멤버"],["과거에 얽매이지 말고, 미래를 걱정하지 말고, 현재를 살아라.","지수, 블랙핑크 멤버"],["무대와 매체를 가리지 않고, 제가 숨 쉴 수 있는 곳이라면 어디든 저의 무대입니다.","지창욱, 영화배우"],["영감이나 아이디어는 가만히 기다린다고 오는 게 아니라, 치열하게 고민하는 과정에서 찾아온다.","지코, 프로듀서 겸 가수"],["음악에 정답은 없습니다. 제가 느끼는 감정을 온전히 비트에 얹어 세상 밖으로 뱉어낼 뿐입니다.","지코, 프로듀서 겸 가수"],["재능이 없다고 탓하기 전에, 재능을 뛰어넘을 만큼의 지독한 노력을 해봤는지 먼저 묻고 싶습니다.","지코, 프로듀서 겸 가수"],["트렌드를 쫓지 마세요. 내가 뚝심 있게 밀고 나가는 내 음악과 바이브가 곧 새로운 트렌드가 됩니다.","지코, 프로듀서 겸 가수"],["리더로서 팀을 이끄는 힘은 강압이 아니라 멤버들을 향한 끝없는 경청과 배려에서 나옵니다.","지효, TWICE 리더"],["수고했어. 너의 수고는 너 자신만 알면 돼.","진(김석진), 방탄소년단(BTS) 멤버"],["힘들면 잠시 쉬어가도 괜찮습니다. 언제나 저희 음악이 여러분의 따뜻한 쉼터가 되어드릴게요.","진(김석진), 방탄소년단(BTS) 멤버"],["아무도 알아주지 않던 무명 시절의 서러움이 지금의 꺾이지 않는 저를 만들었습니다.","진선규, 배우"],["작은 배역은 있어도 작은 배우는 없다는 진리를, 제 온몸으로 증명해 보이고 싶습니다.","진선규, 배우"],["가장 무서운 건 실패가 아니라, 두려워서 아무것도 시도하지 않고 아까운 시간만 흘려보내는 것입니다.","진용진, 기획 및 인터뷰 크리에이터"],["나만의 고유한 찌질함과 덕력을 부끄러워하지 마세요. 그것을 뚝심 있게 밀고 나가면 결국 세상이 환호하는 대체 불가한 '힙'이 됩니다.","진용진, 기획 및 인터뷰 크리에이터"],["남들이 지나치는 아주 사소하고 이상한 호기심을 끝까지 파고드는 집요함이 큰 차이를 만듭니다.","진용진, 기획 및 인터뷰 크리에이터"],["내가 하고 싶은 말보다, 시청자들이 지금 당장 듣고 싶어 하는 이야기가 무엇인지 끊임없이 고민해야 합니다.","진용진, 기획 및 인터뷰 크리에이터"],["사소한 호기심이 세상을 보는 시각을 넓혀줍니다.","진용진, 기획 및 인터뷰 크리에이터"],["호기심을 부끄러워하지 마라. 그것이 모든 새로운 기획과 성장의 출발점이다.","진용진, 기획 및 인터뷰 크리에이터"],["화려한 편집이나 비싼 카메라보다 중요한 건, 시청자의 시간을 뺏지 않는 쫀득하고 치밀한 기획력입니다.","진용진, 기획 및 인터뷰 크리에이터"],["수천 번을 쏘아 올린 화살이지만, 마지막 한 발을 쏠 때는 늘 처음 쏘는 것처럼 떨리고 절실합니다.","진종오, 사격 국가대표"],["나의 능력을 자랑하기보다, 곁에서 지켜봐 주는 구독자분들에 대한 겸손한 감사가 언제나 먼저입니다.","쯔양, 먹방 크리에이터"],["진정성은 절대 꾸며낼 수 없습니다. 시청자들은 귀신같이 진짜와 가짜를 구별하는 최고의 감별사들이니까요.","쯔양, 먹방 크리에이터"],["외모나 겉모습은 찰나의 첫인상을 결정하지만, 결국 사람을 오랫동안 곁에 남게 하는 건 단단한 내면이다.","차은우, 가수 및 배우"],["여성, 남성이라는 틀을 깨고 그저 그 '인물' 자체가 되어 무대를 장악하고 싶습니다.","차지연, 뮤지컬 배우 겸 영화배우"],["1등만 기억하는 냉혹한 세상일지라도, 내 인생의 주인공이자 1등은 언제나 나 자신이어야 한다.","차태현, 배우"],["사람들이 너를 내버려 두면 삶은 아름다울 거야.","찰리 채플린, 영화감독 및 희극인"],["실패는 중요하지 않다. 자신을 조롱하기 위해선 용기가 필요하다.","찰리 채플린, 영화감독 및 희극인"],["진정으로 웃으려면 고통을 참아야 하며, 나아가 고통을 즐길 줄 알아야 해.","찰리 채플린, 영화감독 및 희극인"],["하늘을 올려다보세요. 바닥만을 보고 있으면 무지개를 절대 보지 못할 것입니다.","찰리 채플린, 영화감독 및 희극인"],["클래식 피아노를 치던 소년이 힙합 씬의 정점에 서기까지, 한계를 두지 않은 저의 음악적 욕심이 전부였습니다.","창모(CHANGMO), 래퍼"],["어제보다 오늘 더 거칠고 자유롭게, 무대 위에서만큼은 그 어떤 규칙에도 얽매이지 않습니다.","창빈, 스트레이 키즈(Stray Kids) 멤버"],["타인의 평가에 흔들리지 않고, 우리가 만든 우리만의 마라맛 장르를 세상에 쾅 박아버리겠습니다.","창빈, 스트레이 키즈(Stray Kids) 멤버"],["거침없이 솔직한 제 성격이 때론 오해를 사기도 하지만, 꾸밈없는 진짜 제 모습을 보여주는 게 중요해요.","천러, NCT 멤버"],["누군가의 상처를 대변하는 역할을 맡을 때마다, 배우라는 직업의 무거운 책임감을 배웁니다.","천우희, 배우"],["단역 한 컷을 위해 밤을 새우며 덜덜 떨었던 그 간절함이 지금의 단단한 저를 만들었습니다.","천우희, 배우"],["배우라는 직업은 타인의 아픔을 이해하고 공감하는 것에서부터 시작한다고 믿습니다.","천우희, 배우"],["무대 아래선 평범하고 조용한 사람이지만, 조명이 켜지고 비트가 나오는 순간 저는 완전히 다른 자아가 됩니다.","청하, 솔로 가수"],["요리에 정해진 완벽한 정답은 없습니다. 끊임없이 맛을 찾고 타협하지 않는 자세가 가장 중요하죠.","최강록, 셰프"],["모든 위대한 영화는 촬영장에 버려진 수많은 실패와 실수들을 편집실에서 꿰매어 만든 결과물입니다.","최동훈, 영화감독 (도둑들)"],["나이가 든다는 건 배우로서 표현할 수 있는 감정의 색상이 늘어난다는 뜻입니다.","최민식, 대한민국 대표 영화배우"],["연기에 정답은 없다. 끊임없이 스스로에게 질문할 뿐이다.","최민식, 대한민국 대표 영화배우"],["얼음판 위에서는 피도 눈물도 없는 승부사지만, 태극기를 품을 땐 한없이 가슴이 뜨거워집니다.","최민정, 쇼트트랙 국가대표"],["카메라 앞에서는 수십 년 경력의 베테랑도 매번 발가벗겨진 채로 심판받는 기분입니다.","최불암, 국민 배우"],["긍정적인 에너지 하나만큼은 누구에게도 뒤지지 않습니다. 제 웃음이 여러분께 전염되길 바랍니다.","최예나, 가수"],["항상 밝은 에너지를 전해드리고 싶어요. 제 웃음이 누군가에게 작은 위로가 된다면 그것만으로도 행복합니다.","최예나, 가수"],["가장 평범한 일상의 모습을 진짜처럼 연기하는 것이 세상에서 제일 어렵고도 짜릿한 작업입니다.","최우식, 배우"],["연기라는 마라톤에서 지치지 않기 위해, 가끔은 힘을 빼고 주변 풍경도 둘러보며 달립니다.","최우식, 배우"],["평범하고 찌질한 청춘의 얼굴을 저격하는 것, 그것이 가장 흔하면서도 가장 어려운 연기입니다.","최우식, 배우"],["나의 연약함을 인정할 때 비로소 타인과 진짜로 연결될 수 있습니다.","최은영, 소설가"],["행복은 거창한 성취의 크기가 아니라, 일상 속에서 소소하게 느끼는 기쁨의 빈도에 달려 있습니다. 사소한 일에 자주 활짝 웃으세요.","최인철, 심리학과 교수"],["흔들리지 않는 단단한 발성이 무너지면 감정도 무너집니다. 결국 모든 예술은 기본기가 전부입니다.","최재림, 뮤지컬 배우"],["모든 생명은 유한하기에, 지금 이 순간 우리가 나누는 사랑과 연대가 더욱 아름답고 소중한 것입니다.","최재천, 생태학자 및 교수"],["인간은 자연의 주인이 아닙니다. 수많은 생명체와 함께 지구를 잠시 빌려 쓰는 겸손한 세입자일 뿐임을 뼈저리게 깨달아야 합니다.","최재천, 생태학자 및 교수"],["자연의 모든 생명은 연결되어 있습니다. 인간도 그 거대한 생태계의 겸손한 일부일 뿐입니다.","최재천, 생태학자 및 교수"],["수만 번의 헛스윙이 있었기에 지금의 홈런이 가능했습니다. 삼진을 두려워하는 타자에게 펜스 밖의 환희는 없습니다.","최정, 프로야구 선수"],["수천 번 휘두른 배트의 굳은살이 찢어지는 고통이, 결정적인 순간 담장을 넘기는 짜릿한 홈런을 만듭니다.","최정, 프로야구 선수"],["타석에 설 때는 수만 명의 관중 소리도 들리지 않습니다. 오직 투수의 손끝과 공만 보일 뿐입니다.","최정, 프로야구 선수"],["마음을 후벼파는 시적인 가사 한 줄이 천 마디 말보다 강하게 사람을 위로할 수 있습니다.","최정훈, 잔나비 보컬"],["역사 속 위인들도 숱한 실패와 좌절을 겪었습니다. 완벽한 영웅은 오직 신화 속에만 존재합니다.","최태성, 역사 강사"],["역사는 나보다 먼저 살아간 수많은 사람들의 오답 노트이자 정답 노트다.","최태성, 역사 강사"],["역사를 배우는 이유는 과거를 암기하기 위해서가 아니라, 오늘을 어떻게 살 것인가를 고민하기 위해서입니다.","최태성, 역사 강사"],["역사를 잊은 민족에게 미래는 없습니다. 과거의 뼈아픈 오답 노트 속에서 오늘을 살아갈 치열한 지혜를 찾아야 합니다.","최태성, 역사 강사"],["역사에 무임승차하지 마라. 지금 우리의 삶은 누군가의 피와 땀으로 만들어진 것이다.","최태성, 역사 강사"],["한 번뿐인 인생, 어떻게 살 것인가를 수천 년의 역사를 통해 끊임없이 스스로에게 질문하고 답을 찾아가세요.","최태성, 역사 강사"],["비즈니스의 본질은 결국 '사람'입니다. 내 옆의 동료를 귀하게 여기지 않는 기업은 결코 고객의 마음도 얻을 수 없습니다.","최태원, SK그룹 회장"],["위기는 항상 기회의 가면을 쓰고 찾아옵니다. 가면을 벗겨낼 혜안과 용기가 필요할 뿐입니다.","최태원, SK그룹 회장"],["요리는 입으로 느끼는 맛을 넘어, 시각적인 쇼와 감동을 선사하는 위대한 종합 예술입니다.","최현석, 셰프"],["가짜 밴드라는 편견을 깨기 위해, 손가락에 물집이 터지도록 악기를 잡고 또 잡았습니다.","쵸단, 밴드 QWER 리더"],["우리의 악기 소리가 누군가에게는 소음일지 몰라도, 저희에겐 편견을 부수는 가장 아름다운 록 스피릿입니다.","쵸단, 밴드 QWER 리더"],["우리의 음악은 인터넷 방송에서 시작된 작은 기적입니다. 진심을 다해 악기를 연주하면 편견도 찬사로 바뀝니다.","쵸단, 밴드 QWER 리더"],["불리한 상황에서도 한 타를 뒤집을 수 있다는 변수를 창출하는 것이 진짜 실력입니다.","쵸비(정지훈), Gen.G LoL 프로게이머"],["아무리 불리한 상황이라도 CS 하나하나 놓치지 않고 묵묵히 성장하다 보면 반드시 역전의 기회는 옵니다.","쵸비(정지훈), Gen.G LoL 프로게이머"],["운명은 처음부터 정해진 것이 아니라, 내가 하루하루 만들어가는 것입니다.","추신수, 야구선수"],["재능은 하늘이 주는 것이지만, 그 재능을 꽃피우는 루틴은 내가 만드는 것이다.","추신수, 야구선수"],["세상을 설득하고 싶다면, 결국 내가 나 자신에게 먼저 확신을 가져야 한다.","충주맨(김선태), 홍보 크리에이터"],["통쾌한 파격은 기존의 틀을 철저하고 완벽하게 이해했을 때 비로소 통하는 법입니다.","충주맨(김선태), 홍보 크리에이터"],["틀을 깨는 것을 두려워하지 마세요. 남들과 다르게 생각할 때 비로소 새로운 길이 열립니다.","충주맨(김선태), 홍보 크리에이터"],["내가 겪은 실패들은 결국 나만의 오리지널리티를 완성하는 가장 확실한 재료가 됩니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["너무 잘하려고 힘을 주지 마세요. 일단 힘을 빼고 그냥 하는 것 자체가 중요합니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["대충 하는 것 같아도, 그 안에 꺾이지 않는 자신만의 철학이 있어야 롱런합니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["뭐든 대충대충 하는 것 같아도, 꾸준히 끈기 있게 하면 결국 그게 실력이 됩니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["불안해하지 마세요. 대충 해도 될 일은 되고, 억지로 안달 내도 안 될 일은 안 됩니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["아무 생각 없이 헛소리하는 것 같지만, 그 안에 고도로 계산된 여유와 킹받음이 숨어있습니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["안 되면 되는 거 해라.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["잘하려고 스트레스 받지 마세요. 대충대충 하는 것 같아도, 꾸준히 오래 하는 사람이 결국 끝까지 살아남습니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["제 안의 찌질함을 부끄러워하지 않고 유쾌하게 까발릴 때, 대중은 비로소 저를 동네 형처럼 친근하고 편안하게 느낍니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["화려하게 치장된 가짜의 웃음보다, 날 것 그대로의 솔직한 B급 감성이 훨씬 강력합니다.","침착맨(이말년), 웹툰 작가 겸 크리에이터"],["무대 위, 혹은 실전에서는 내가 최고라는 근거 없는 자신감도 때론 필요하다.","카리나, 에스파(aespa) 리더"],["현실의 벽이 아무리 높아도, 광야를 개척하던 그 패기로 언제든 시원하게 부수고 나아가겠습니다.","카리나, 에스파(aespa) 리더"],["최고의 퍼포먼스는 완벽한 칼군무가 아니라, 무대를 진심으로 즐기는 여유에서 나옵니다.","카이, EXO 멤버"],["춤은 제 안의 말하지 못하는 감정들을 세상 밖으로 꺼내주는 가장 솔직한 언어입니다.","카이, EXO 멤버"],["실패를 두려워하지 않는 용기, 그것이 저를 한국으로 이끌었고 지금의 저를 만들었습니다.","카즈하, 르세라핌(LE SSERAFIM) 멤버"],["비트를 만들 때 가장 중요한 건 '여백'입니다. 꽉 채운 사운드보다 비워둔 공간이 래퍼의 목소리를 살립니다.","코드 쿤스트, 프로듀서 겸 방송인"],["음악에는 그 사람의 취향과 삶이 고스란히 담깁니다. 저는 억지로 꾸며낸 소리를 가장 경계합니다.","코드 쿤스트, 프로듀서 겸 방송인"],["관객과 감독은 사디스트와 마조히스트다.","쿠엔틴 타란티노, 영화감독"],["10년 뒤에 들어도 촌스럽지 않은 클래식을 만드는 것, 그것이 제가 음악을 깎고 다듬는 태도입니다.","크러쉬, R&B 가수"],["음악은 제 일기장과 같습니다. 저의 모든 기쁨과 슬픔, 찌질함까지 고스란히 담겨 있죠.","크러쉬, R&B 가수"],["제 노래가 누군가의 텅 빈 방 안을 따뜻하게 채우는 작은 위로가 되었으면 좋겠습니다.","크러쉬, R&B 가수"],["나 자신을 행운아라고 생각해 본 적 없다. 나는 최고로 괴상한 염세주의자다.","크리스토퍼 놀란, 영화감독"],["모든 사람의 인생은 관찰할 가치가 있다. 각자의 비밀과 드라마가 있기 때문이다.","크쥐시토프 키에슬로프스키, 영화감독"],["당신의 노력을 존중하라. 당신 자신을 존중하라. 자존감은 자제력을 낳는다. 이 둘을 겸비하면 진정한 힘을 얻는다.","클린트 이스터우드, 배우 겸 영화감독"],["남들이 정해놓은 기준에 나를 끼워 맞추기 위해 내 소중한 시간을 낭비하고 싶지 않아요.","키(Key), 샤이니 멤버"],["깊게 아파본 사람만이 다른 사람의 상처에 진심으로 연고를 발라줄 수 있습니다.","타블로, 에픽하이 멤버"],["깊이 상처받고 아파본 경험일수록, 남을 더 깊게 위로할 수 있는 힘이 된다.","타블로, 에픽하이 멤버"],["완벽하지 않아도 괜찮습니다. 불완전한 실천이 아예 안 하는 것보다 훨씬 낫습니다.","타일러 라쉬, 방송인 및 환경 운동가"],["대본 없이 자유롭게 튀어나오는 애드리브 속에서 진짜 예능의 카타르시스가 터집니다.","탁재훈, 방송인"],["결과가 좋지 않다고 해서 제가 들인 노력의 가치마저 사라지는 것은 아닙니다.","태민, 샤이니(SHINee) 멤버"],["무대 위에서의 3분은 영원과도 같습니다. 그 짧은 시간 안에 제 모든 것을 쏟아부어야 하니까요.","태민, 샤이니(SHINee) 멤버"],["끊임없이 남과 비교하며 스스로를 갉아먹고 괴롭히기엔 지금 나의 청춘이 너무 짧고 아깝다.","태연, 소녀시대 멤버"],["리더의 역할은 앞에서 끌어가는 것이 아니라, 뒤에서 멤버들이 넘어지지 않게 받쳐주는 것입니다.","태용, NCT 리더"],["팬들이 저를 믿어주는 만큼, 저 역시 제 자신의 가능성을 의심하지 않고 매일 더 높은 고음을 향해 도전합니다.","태현, 투모로우바이투게더(TXT) 멤버"],["먹고 싶은 대로 다 먹을 수 있다면 먹고 싶은 것을 먹는 데 무슨 재미가 있겠나.","톰 행크스, 할리우드 배우"],["아침에 당신을 벌떡 깨울 수 있는 꿈을 가져야 한다.","팀 버튼, 영화감독"],["언제나 현재에 집중할 수 있다면 행복할 것이다.","파울로 코엘료, 소설가"],["현실 남매 케미 속에는 겉으론 티격태격해도 결국 서로를 끔찍이 아끼는 끈끈한 가족애가 깔려 있습니다.","파트리샤, 유튜버 겸 방송인"],["게임은 단순한 오락이 아닙니다. 실패하고 다시 도전하는 법을 알려주는 작은 인생입니다.","페이커(이상혁), T1 LoL 프로게이머"],["남들과 비교하기보다 어제의 나보다 나아지는 것에 집중하세요.","페이커(이상혁), T1 LoL 프로게이머"],["내가 흔들리지 않고 중심을 잡으면, 나의 세계는 결코 무너지지 않는다.","페이커(이상혁), T1 LoL 프로게이머"],["모든 실패는 성공을 위한 데이터다.","페이커(이상혁), T1 LoL 프로게이머"],["수많은 패배와 비난 속에서도 꺾이지 않는 것은, 게임을 향한 순수한 열정이 여전히 제 안에 숨 쉬고 있기 때문입니다.","페이커(이상혁), T1 LoL 프로게이머"],["쓰라린 패배에서 아무것도 배우지 못하면 영원히 제자리걸음일 뿐입니다.","페이커(이상혁), T1 LoL 프로게이머"],["페이커라는 이름이 주는 중압감을 피하지 않습니다. 그 왕관의 무거운 무게를 견디는 것이 제 숙명입니다.","페이커(이상혁), T1 LoL 프로게이머"],["나 자신을 사랑하는 법부터 배워야 진짜 아름다워질 수 있다.","포니(PONY), 뷰티 크리에이터"],["유행을 무작정 쫓아가기보다, 나에게 가장 잘 어울리고 편안한 스타일을 먼저 연구하고 사랑하세요.","포니(PONY), 뷰티 크리에이터"],["시나리오를 쓰는 건 다림질하는 것과 같아요. 앞으로 조금 갔다 뒤로 다시 가고 매끄럽게 만드는 거죠.","폴 토머스 앤더슨, 영화감독"],["영화 하나가 만들어지는 건 기적이다. 한 신(scene)이 완성될 때마다 기적이다.","폴 토머스 앤더슨, 영화감독"],["남 눈치 안 보고 내뱉는 팩트 폭력이 사람들에게 시원한 사이다를 안겨주는 비결이죠.","풍자, 방송인 및 크리에이터"],["단점을 억지로 숨기려 들면 어색해집니다. 그 단점을 오히려 유쾌하게 까발려 나만의 독보적이고 친근한 캐릭터로 만드세요.","풍자, 방송인 및 크리에이터"],["모든 사람에게 사랑받으려 애쓰지 마세요. 나를 진심으로 아껴주는 사람들에게만 최선을 다해도 인생은 충분히 아름답습니다.","풍자, 방송인 및 크리에이터"],["예술의 모든 것은 운과 재능, 그 둘뿐이다.","프란시스 포드 코폴라, 영화감독"],["나는 영화가 영화를 만든다는 기쁨이 아니면, 영화를 만드는 데 따르는 고통을 표현해야 한다고 요구한다.","프랑수아 트뤼포, 영화감독"],["솔직한 찌질함이 때로는 포장된 완벽함보다 사람들의 마음에 더 깊게 다가갑니다.","피식대학(김민수), 유튜버 및 코미디언"],["아무것도 없는 빈 무대에서도 서로의 티키타카만으로 폭소를 끌어내는 것이 진짜 희극인입니다.","피식대학(이용주), 유튜버 및 코미디언"],["어차피 대중의 시선을 받는 직업이라면, 그 시선을 즐기며 유쾌하게 갚아드리겠습니다.","피식대학(정재형), 유튜버 및 코미디언"],["현실의 찌질함을 극대화해서 보여주는 스케치 코미디야말로 지금 시대의 가장 날카로운 풍자입니다.","피식대학(정재형), 유튜버 및 코미디언"],["아무리 힘들어도 웃으면서 이겨내세요. 긍정적인 생각은 긍정적인 몸을 만들고, 긍정적인 인생을 만듭니다.","핏블리, 헬스 크리에이터"],["운동은 단순히 몸짱이 되기 위한 것이 아니라, 건강한 멘탈과 삶의 밸런스를 되찾기 위한 가장 좋은 약입니다.","핏블리, 헬스 크리에이터"],["틀에 갇히지 않은 자유로운 바이브가 새로운 트렌드를 이끄는 가장 강력한 원동력입니다.","하니, 뉴진스(NewJeans) 멤버"],["걷기는 나를 잃지 않고 지켜내는 가장 단순하고 확실한 방법이다.","하정우, 배우"],["몸이 힘들어도 카메라 앞에 서면 저도 모르는 폭발적인 에너지가 솟구칩니다.","하지원, 영화배우"],["가벼워 보인다고요? 예능에서 깃털처럼 가볍게 날아다니기 위해, 보이지 않는 곳에서 무거운 고민을 수없이 반복합니다.","하하, 방송인"],["결코 나 혼자 잘나서 이 자리에 온 게 아닙니다. 내 주변 사람들이 지금의 나를 만들어준 겁니다.","하하, 방송인"],["고통을 외면하지 않고 정면으로 응시할 때, 비로소 우리는 문학이라는 이름으로 서로를 구원할 수 있습니다.","한강, 소설가 (노벨문학상 수상)"],["상처받은 사람들의 목소리를 외면하지 않는 것, 문학은 결국 타인의 고통에 기꺼이 응답하는 무거운 책임입니다.","한강, 소설가 (노벨문학상 수상)"],["인간의 깊은 고통과 연약함을 직시할 때, 비로소 우리는 타인과 진정으로 연대할 수 있습니다.","한강, 소설가 (노벨문학상 수상)"],["넘어지는 것을 두려워하지 마세요. 바닥을 짚고 일어나는 힘이 저를 더 단단하게 만들었습니다.","한소희, 배우"],["상처받는 것을 두려워하면 극 중에서 어떤 진짜 감정도 연기할 수 없습니다.","한소희, 배우"],["타인의 삶을 긍정하고 온전히 이해하려 노력하는 과정, 그것이 제가 연기를 사랑하는 이유입니다.","한지민, 배우"],["타인의 아픔에 깊이 공감하고 함께 울어줄 수 있는 마음, 그것이 배우가 가져야 할 첫 번째 덕목입니다.","한지민, 배우"],["타인의 아픔에 깊이 공감하지 못한다면 카메라 앞에서 결코 진짜 눈물을 흘릴 수 없습니다.","한지민, 배우"],["힘들 때 쉬어가는 것은 포기가 아닙니다. 더 멀리 뛰기 위한 숨 고르기일 뿐입니다.","한지민, 배우"],["배우라는 직업은 타인의 삶을 통해 결국 내 자신의 진짜 모습을 찾아가는 외로운 여정입니다.","한효주, 배우"],["예쁘고 단정한 모습에 갇히고 싶지 않아요. 흙먼지를 뒤집어쓰고 피투성이가 될 때 진짜 제 모습이 나오는 것 같습니다.","한효주, 배우"],["일단 부딪혀 보세요. 생각만 하다가는 아무것도 시작할 수 없습니다.","해원, 엔믹스(NMIXX) 리더"],["끝없는 연습 스케줄 속에서도 제가 웃을 수 있는 건 무대 위에서 팬들과 눈을 맞출 때의 짜릿함 때문입니다.","해찬, NCT 멤버"],["압도적인 신장 차이도 코트 위를 뒹구는 끈끈한 투지 앞에서는 무용지물이 됩니다.","허웅, 프로농구 선수"],["나다움을 잃지 않는 것, 그것이 르세라핌이 세상에 던지는 가장 강력하고 독기 있는 메시지입니다.","허윤진, 르세라핌(LE SSERAFIM) 멤버"],["언제나 당당하게 제 목소리를 내겠습니다. 두려움 없이 앞을 향해 나아가는 게 저희의 방식이니까요.","허윤진, 르세라핌(LE SSERAFIM) 멤버"],["넘어지는 건 부끄러운 게 아닙니다. 다시 일어나지 않는 게 부끄러운 거죠.","허재, 농구 감독"],["세상의 문제는 모두가 나보다 몇 잔 덜 마셨다는 것이다.","험프리 보가트, 고전 영화배우"],["세상은 고통으로 가득하지만 그것을 극복하는 사람들로도 가득하다.","헬렌 켈러, 작가 및 사회운동가"],["행복의 한쪽 문이 닫히면 다른 쪽 문이 열린다. 그러나 흔히 우리는 닫힌 문을 오랫동안 보기 때문에 우리를 위해 열려 있는 문을 보지 못한다.","헬렌 켈러, 작가 및 사회운동가"],["타인의 칭찬이나 인기는 거품처럼 금방 사라지지만, 나라는 사람의 본질과 내면의 깊이는 영원히 남는다.","현빈, 배우"],["게으름은 인간의 본능이지만, 그 달콤한 본능을 이겨내고 묵묵히 책상 앞에 앉는 지독한 독기가 당신의 미래 계급을 바꿉니다.","현우진, 수학 일타강사"],["남들 쉴 때 다 쉬고 남들 놀 때 다 놀면, 절대 남들을 앞서갈 수 없다.","현우진, 수학 일타강사"],["불안은 성장의 그림자입니다. 불안하지 않다면 지금 정체되어 있다는 뜻일지도 모릅니다. 오늘 해야 할 일을 묵묵히 하세요.","현우진, 수학 일타강사"],["불안함은 당연한 감정입니다. 그 불안함을 원동력 삼아 오늘 해야 할 분량을 묵묵히 채우세요.","현우진, 수학 일타강사"],["먹는 것만큼이나 코트 위에서 힘을 쏟았습니다. 묵직한 플레이가 코트 위 제 정체성이니까요.","현주엽, 전 농구 국가대표 및 방송인"],["저는 천재가 아닙니다. 춤 하나를 완벽하게 추기 위해 남들 모르게 수만 번을 반복하는 지독한 노력파입니다.","현진, 스트레이 키즈 멤버"],["수천 명의 함성 소리를 듣는 무대 위의 순간, 지난 연습실에서의 고통은 눈 녹듯 사라집니다.","호시, 세븐틴(SEVENTEEN) 멤버"],["객석을 가득 채워주신 관객들의 박수소리를 듣는 순간, 제 몸을 지배하던 모든 고통이 씻은 듯 사라집니다.","홍광호, 뮤지컬 배우"],["예술은 세상을 아름답게 꾸미는 장식이 아니라, 감춰진 진실을 찌르는 날카로운 칼입니다.","홍순철, 평론가"],["공부는 단순히 성적을 올리기 위해서가 아니라, 험난한 세상에서 나를 지키기 위해 하는 겁니다.","홍진경, 방송인 겸 사업가"],["성공을 향한 조급함을 버리세요. 늦게 피는 꽃이 더 오랫동안 진한 향기를 남깁니다.","홍진경, 방송인 겸 사업가"],["성공이라는 목적지보다, 그곳으로 향하는 험난한 여정 속에서 만난 사람들이 더 소중합니다.","홍진경, 방송인 겸 사업가"],["아무도 나를 믿어주지 않을 때, 나 스스로를 믿는 것이 가장 큰 힘이 됩니다.","홍진경, 방송인 겸 사업가"],["2인자라는 꼬리표를 실패로 여기지 않습니다. 누구보다 치열하게 1위를 위협했던 빛나는 훈장이니까요.","홍진호, 전 e스포츠 프로게이머"],["긍정적인 에너지는 전염된다. 내가 먼저 밝게 웃고 다가가면 주변도 반드시 밝아진다.","홍현희, 코미디언"],["유쾌한 긍정 에너지는 전염성이 강합니다. 제가 앞장서서 활짝 웃으면 안방의 시청자도 어느새 따라 웃게 됩니다.","홍현희, 코미디언"],["세상의 기준에 내가 맞지 않는다고 좌절하지 말고, 내가 세상의 새로운 기준이 되면 됩니다.","화사, 마마무 멤버"],["세상이 정한 미의 기준에 얽매이지 않고, 제가 생각하는 저만의 아름다움을 뚝심 있게 보여줄 겁니다.","화사, 마마무 멤버"],["예능에서 욕을 먹더라도 제가 뱉은 솔직한 말로 시청자가 웃는다면 기꺼이 감수하겠습니다.","황광희, 방송인"],["넘어져도 다시 일어나 달리는 법, 저는 그걸 얼음판 위에서 수만 번 뒹굴며 온몸으로 처절하게 배웠습니다.","황대헌, 쇼트트랙 국가대표"],["억울한 편파판정 앞에서도 흔들리지 않고 실력으로 뚫고 나가는 것이 진정한 스포츠 정신입니다.","황대헌, 쇼트트랙 국가대표"],["오징어 게임이 전 세계를 열광시킨 이유는, 그 잔혹한 서바이벌이 지금 우리가 살고 있는 현실과 소름 돋게 닮아있기 때문입니다.","황동혁, 영화감독 (오징어게임)"],["자본주의의 가장 씁쓸하고 잔혹한 민낯을 게임이라는 단순한 틀 속에 가감 없이 담아내고 싶었습니다.","황동혁, 영화감독 (오징어게임)"],["느리더라도 정직하게, 요행을 바라지 않고 한 계단씩 단단하게 밟아 올라가겠습니다.","황민현, 가수 겸 배우"],["묵묵히 제게 주어진 일을 해내다 보면, 언젠가 사람들은 그 성실함의 가치를 알아봐 줍니다.","황민현, 가수 겸 배우"],["삶은 겪어내는 것이지, 정답을 찾아 헤매는 것이 아닙니다.","황석영, 소설가"],["물살을 가를 때 숨이 턱 끝까지 차오르지만, 턴을 하고 터치패드를 찍는 순간의 환희로 모든 걸 보상받습니다.","황선우, 수영 국가대표"],["부상조차도 저를 막을 순 없었습니다. 물속으로 뛰어드는 순간 저는 세상에서 가장 자유로운 인어가 되니까요.","황선우, 수영 국가대표"],["관객이 극장에 들어올 때의 마음과 나갈 때의 마음이 조금이라도 달라졌다면 성공한 겁니다.","황정민, 배우"],["묵묵히 내 자리에서 최선을 다하다 보면, 언젠가 노력의 결실을 맺는 날이 온다.","황정민, 배우"],["어떤 배역이든 100% 만족은 없습니다. 그 채워지지 않는 갈증이 저를 계속 연기하게 만듭니다.","황정민, 배우"],["기회가 왔을 때 주저하는 공격수에게는 두 번의 찬스가 없습니다. 무조건 저돌적으로 파고들어야 합니다.","황희찬, 축구 국가대표"],["내가 가진 장점을 극대화하는 것이 단점을 고치는 것보다 빠르고 확실합니다.","황희찬, 축구 국가대표"],["유럽의 거구 공격수들과 몸싸움을 벌일 때, 한 발짝이라도 밀리면 끝이라는 절박함으로 버텨냅니다.","황희찬, 축구 국가대표"],["황소처럼 저돌적으로 파고드는 것, 한 치의 물러섬 없이 골문을 향해 돌진하는 것이 제 흔들림 없는 축구 철학입니다.","황희찬, 축구 국가대표"],["노래를 부를 때 가장 중요한 건 화려한 기교가 아니라, 가사에 담긴 마음을 전하는 것입니다.","휘인, 마마무 멤버"],["최고의 퍼포먼스는 연습실 거울 앞이 아니라, 팬들과 눈을 맞추며 호흡하는 바로 그 순간 완성됩니다.","희승, 엔하이픈(ENHYPEN) 멤버"],["잘 먹는 것도 훈련입니다. 맛있는 음식을 복스럽게 먹으며 세상에 긍정적인 에너지를 퍼뜨리고 싶어요.","히밥, 먹방 크리에이터"]];
const RANDOM_COUNT = 300;
const TITLES = [
  "인플루언서 어록",
  "기억에 머무는 문장들",
  "단어의 온도",
  "인생의 나침반이 되는 문장들",
  "내 삶을 바꾸는 한 줄",
  "단단한 나를 만드는 문장",
  "문장이 흐르는 시간",
  "어록 배달 왔습니다"
];

const listEl = document.getElementById('list');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const qEl = document.getElementById('q');
const formEl = document.getElementById('searchForm');

let current = new Set();
let currentTitle = '';

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
/* 문장 중간의 쉼표(,)·마침표(.) 뒤에서 줄바꿈 */
function breakLines(s){ return String(s).replace(/([,.])\s+(?=\S)/g, '$1\n'); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
const fmt = n => n.toLocaleString('ko-KR');

function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 제목 랜덤 (직전 제목과 다르게) */
function randomTitle(){
  const pool = TITLES.filter(t => t !== currentTitle);
  currentTitle = pool[Math.floor(Math.random() * pool.length)];
  titleEl.textContent = currentTitle;
}

/* 전체 어록을 랜덤 순서로 섞기 — 첫 300개는 직전 화면의 첫 300개와 겹치지 않게 */
function pickRandom(){
  const all = shuffle([...QUOTES.keys()]);
  const fresh = all.filter(i => !current.has(i));
  const rest = all.filter(i => current.has(i));
  const order = fresh.concat(rest);
  current = new Set(order.slice(0, RANDOM_COUNT));
  return order;
}

function highlight(text, terms){
  if(!terms.length) return esc(text);
  // 원문에서 먼저 찾은 뒤 조각마다 이스케이프 (HTML 기호가 깨지지 않도록)
  const re = new RegExp(terms.map(escRe).sort((x, y) => y.length - x.length).join('|'), 'gi');
  let out = '', last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m[0] === ''){ re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

/* "이름, 소개" 형식을 이름 / 소개로 나눠 표시 */
function authorHTML(a, terms){
  if(!a) return '';
  const k = a.indexOf(',');
  if(k < 0) return `<strong>${highlight(a, terms)}</strong>`;
  return `<strong>${highlight(a.slice(0, k).trim(), terms)}</strong>${highlight(a.slice(k + 1).trim(), terms)}`;
}

/* 300개씩 이어서 출력 (스크롤이 끝 부근에 오면 다음 300개 추가) */
let order = [], rendered = 0, curTerms = [];
function cardHTML(i, n, terms){
  const [q, a] = QUOTES[i];
  return `<article class="card" style="animation-delay:${Math.min(n % RANDOM_COUNT, 24) * 25}ms">
      <span class="mark-q" aria-hidden="true">&ldquo;</span>
      <p class="quote">${highlight(breakLines(q), terms)}</p>
      <div class="meta">
        <p class="author">${authorHTML(a, terms)}</p>
        <span class="no">${String(n + 1).padStart(3, '0')}</span>
      </div>
    </article>`;
}
function renderMore(){
  if(rendered >= order.length) return;
  const next = order.slice(rendered, rendered + RANDOM_COUNT);
  listEl.insertAdjacentHTML('beforeend', next.map((i, k) => cardHTML(i, rendered + k, curTerms)).join(''));
  rendered += next.length;
  document.getElementById('endNote').hidden = rendered < order.length || order.length === 0;
}
function draw(indices, terms = []){
  order = indices.slice();
  curTerms = terms;
  rendered = 0;
  listEl.innerHTML = '';
  if(!indices.length){
    listEl.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>'${esc(terms.join(' '))}'</b>이(가) 들어간 어록이 없습니다.<br>다른 단어로 검색해 보세요.</div>`;
    document.getElementById('endNote').hidden = true;
    return;
  }
  renderMore();
}
new IntersectionObserver(entries => {
  if(entries.some(en => en.isIntersecting)) renderMore();
}, { rootMargin: '0px 0px 1400px 0px' }).observe(document.getElementById('sentinel'));

function showRandom(){
  statusEl.classList.remove('show');
  lastQuery = '';
  lastRandom = pickRandom();
  draw(lastRandom);
}

let lastRandom = [];
let lastQuery = null;
function search(force){
  // 한글 입력 중 끝에 남은 낱자(ㄱ, ㅏ 등)는 빼고 검색
  const raw = qEl.value.replace(/[\u3131-\u318E]+$/, '').trim();
  formEl.classList.toggle('has-value', qEl.value !== '');
  if(!raw && qEl.value.trim() !== '') return;      // 낱자만 입력된 상태는 그대로 유지
  if(!force && raw === lastQuery) return;
  lastQuery = raw;
  if(!raw){
    // 검색어를 지우면 직전 랜덤 목록으로 복귀
    statusEl.classList.remove('show');
    if(lastRandom.length) draw(lastRandom); else showRandom();
    return;
  }
  const terms = raw.split(/\s+/).filter(Boolean);
  const lower = terms.map(t => t.toLowerCase());
  const hits = [];
  QUOTES.forEach(([q, a], i) => {
    const hay = (q + ' ' + a).toLowerCase();
    if(lower.every(t => hay.includes(t))) hits.push(i);
  });
  statusEl.innerHTML = `<b>'${esc(raw)}'</b> 검색 결과 <b>${fmt(hits.length)}</b>개`;
  statusEl.classList.add('show');
  draw(hits, terms);
}

let sT;
qEl.addEventListener('input', () => {
  formEl.classList.toggle('has-value', qEl.value !== '');
  clearTimeout(sT);
  sT = setTimeout(() => { const before = lastQuery; search(); if(lastQuery !== before) window.scrollTo({top: 0}); }, 250);
});
formEl.addEventListener('submit', e => {
  e.preventDefault();
  clearTimeout(sT);
  search(true);
  window.scrollTo({top: 0, behavior: 'smooth'});
  if(window.matchMedia('(pointer: coarse)').matches) qEl.blur();   // 휴대폰에서는 키보드 닫기
});

/* ---- 인물 이미지 (한국어 위키백과에서 검색) ---- */
const sBg = document.getElementById('sBg');
const imgCache = new Map();
const OCC = ['배우','가수','방송인','코미디언','개그맨','아나운서','야구 선수','축구 선수','작가','소설가','시인','영화감독','기업인','정치인','유튜버','래퍼','교수','요리사','프로게이머','프로듀서','기업가','영화 감독','싱어송라이터','철학자','피겨 스케이팅 선수','수영 선수','역도 선수','농구 선수','배구 선수'];
const STOP = new Set(['및','겸','전','현','前','現','출신','대표','리더','멤버','크리에이터','유튜버','방송']);

function parsePerson(a){
  const k = a.indexOf(',');
  return { name: (k < 0 ? a : a.slice(0, k)).trim(), desc: k < 0 ? '' : a.slice(k + 1).trim() };
}
function titleCandidates(name, desc){
  const out = [];
  const m = name.match(/^(.*?)\s*\((.*?)\)\s*$/);
  const bases = m ? [m[1].trim(), m[2].replace(/^구\s*/, '').trim()] : [name];
  bases.filter(Boolean).forEach(b => {
    out.push(b);
    OCC.forEach(o => { if(desc.includes(o.replace(' ', '')) || desc.includes(o)) out.push(`${b} (${o})`); });
  });
  return [...new Set(out)].slice(0, 20);
}
function descTokens(desc){
  return desc.split(/[\s,()·/]+/).map(s => s.trim()).filter(s => s.length >= 2 && !STOP.has(s));
}
const EN_WORDS = {
  '배우':['actor','actress'],'영화배우':['actor','actress'],'가수':['singer'],'방송인':['television','presenter','entertainer','personality'],
  '코미디언':['comedian'],'개그맨':['comedian'],'작가':['writer','author','novelist'],'소설가':['novelist'],'시인':['poet'],
  '영화감독':['film director'],'감독':['director','manager','coach'],'교수':['professor'],'프로게이머':['gamer','esports','player'],
  '래퍼':['rapper'],'셰프':['chef'],'요리사':['chef','cook'],'축구':['football','soccer'],'야구':['baseball'],'프로야구':['baseball'],
  '창업자':['founder','entrepreneur','businessperson'],'기업인':['businessperson','entrepreneur'],'사업가':['businessperson','entrepreneur'],
  '유튜버':['youtuber'],'크리에이터':['youtuber','creator','influencer'],'아나운서':['announcer'],'철학자':['philosopher'],'프로듀서':['producer'],'웹툰':['webtoon','cartoonist','manhwa'],
  '싱어송라이터':['singer-songwriter'],'전문의':['physician','psychiatrist','doctor'],'국가대표':['national','athlete','player'],
  '선수':['player','athlete'],'보컬':['singer','vocalist'],'트로트':['trot','singer'],'강사':['lecturer','instructor','teacher'],'회장':['chairman','businessperson']
};
const WD_API = 'https://www.wikidata.org/w/api.php';
const KO_API = 'https://ko.wikipedia.org/w/api.php';
const EN_API = 'https://en.wikipedia.org/w/api.php';
const qs = o => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
const getJSON = (api, o) => fetch(api + '?' + qs(Object.assign({format:'json', origin:'*'}, o))).then(r => { if(!r.ok) throw new Error('http'); return r.json(); });
const commonsURL = f => 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f.replace(/ /g, '_')) + '?width=1600';
const hasTok = (text, toks) => { const s = (text || '').toLowerCase(); return toks.length > 0 && toks.some(k => s.includes(k)); };

function personBases(name){
  const m = name.match(/^(.*?)\s*\((.*?)\)\s*$/);
  return (m ? [m[1].trim(), m[2].replace(/^구\s*/, '').trim()] : [name]).filter(Boolean);
}
function allTokens(desc){
  const ko = [...new Set(descTokens(desc).concat(Object.keys(EN_WORDS).filter(k => desc.includes(k) && !STOP.has(k))))].map(s => s.toLowerCase());
  const en = [];
  desc.split(/[\s,()·/]+/).forEach(w => Object.keys(EN_WORDS).forEach(k => { if(w.includes(k)) en.push(...EN_WORDS[k]); }));
  return { ko, all: [...new Set(ko.concat(en))] };
}
async function wikiQuery(api, extra){
  const j = await getJSON(api, Object.assign({
    action:'query', redirects:1, prop:'pageimages|extracts|pageprops', piprop:'thumbnail', pithumbsize:1600,
    exintro:1, explaintext:1, exlimit:'max', exchars:700
  }, extra));
  return Object.values((j.query && j.query.pages) || {});
}
/* 제목이 이름과 정확히 같거나 "이름 (구분)" 형식이고, 소개 단어가 본문에 있는 문서만 */
function collectPages(pages, bases, toks){
  const out = [];
  pages.forEach(pg => {
    if(pg.missing !== undefined || pg.invalid !== undefined) return;
    if(pg.pageprops && pg.pageprops.disambiguation !== undefined) return;
    if(!bases.some(b => pg.title === b || pg.title.startsWith(b + ' ('))) return;
    if(!hasTok((pg.extract || '') + ' ' + pg.title, toks)) return;
    out.push({ src: pg.thumbnail ? pg.thumbnail.source : null, qid: pg.pageprops ? pg.pageprops.wikibase_item : null });
  });
  return out;
}
async function entities(ids, props){
  if(!ids.length) return {};
  const j = await getJSON(WD_API, { action:'wbgetentities', ids: ids.slice(0, 50).join('|'), props, languages:'ko|en' });
  return j.entities || {};
}
const isHuman = e => !!(e && e.claims && e.claims.P31 && e.claims.P31.some(c => c.mainsnak.datavalue && c.mainsnak.datavalue.value.id === 'Q5'));
const p18 = e => { const c = e && e.claims && e.claims.P18; return c && c[0] && c[0].mainsnak.datavalue ? commonsURL(c[0].mainsnak.datavalue.value) : null; };

/* 위키백과에서 찾은 후보를 "실제 사람(위키데이터)"인지 확인하고, 한 명으로 좁혀질 때만 사용 */
async function resolveHits(hits){
  const byQid = new Map();
  hits.forEach(h => { if(h.qid && !byQid.has(h.qid)) byQid.set(h.qid, h); });
  if(!byQid.size) return { status:'none' };
  const ents = await entities([...byQid.keys()], 'claims');
  const people = [...byQid.entries()].filter(([id]) => isHuman(ents[id]));
  if(people.length === 0) return { status:'none' };
  if(people.length > 1) return { status:'ambiguous' };      // 동명이인 → 사진 쓰지 않음
  const [id, h] = people[0];
  return { status:'found', src: h.src || p18(ents[id]) };
}

/* 사진 찾는 순서: ① 한국어 위키백과 문서 → ② 한국어 위키백과 검색 → ③ 위키데이터 인물 검색 → ④ 영어 위키백과
   모든 단계에서 "이름 일치 + 소개 단어 일치 + 실제 인물 + 한 명으로 특정" 조건을 모두 통과해야만 사용 */
async function findImage(a){
  const { name, desc } = parsePerson(a);
  const bases = personBases(name);
  const { ko, all } = allTokens(desc);
  if(!ko.length && !all.length) return null;              // 소개가 없으면 확인 불가 → 사진 없음

  // ① 문서 제목 직접
  const cands = titleCandidates(name, desc);
  let hits = collectPages(await wikiQuery(KO_API, { titles: cands.join('|') }), bases, ko);
  // ② 제목이 "이름 (○○○)" 형식인 문서는 검색으로 확인
  if(!hits.length){
    for(const b of bases){
      hits = hits.concat(collectPages(await wikiQuery(KO_API, { generator:'search', gsrsearch: b, gsrlimit:10, gsrnamespace:0 }), bases, ko));
    }
  }
  if(hits.length){
    const r = await resolveHits(hits);
    if(r.status === 'found') return r.src || null;
    if(r.status === 'ambiguous') return null;
  }

  // ③ 위키데이터 (이름이 정확히 같고, 설명에 직업·소속이 맞는 실제 인물 1명)
  const found = new Map();
  for(const b of bases){
    const sr = await getJSON(WD_API, { action:'wbsearchentities', search:b, language:'ko', uselang:'ko', type:'item', limit:10 });
    const ids = (sr.search || []).filter(x => x.match && x.match.text === b).map(x => x.id);
    const ents = await entities(ids, 'claims|descriptions');
    ids.forEach(id => {
      const e = ents[id];
      const d = ['ko', 'en'].map(l => e && e.descriptions && e.descriptions[l] ? e.descriptions[l].value : '').join(' ');
      if(isHuman(e) && d.trim() && hasTok(d, all)) found.set(id, p18(e));
    });
  }
  if(found.size === 1) return [...found.values()][0] || null;
  if(found.size > 1) return null;

  // ④ 영어 위키백과 (영문 이름이 있는 인물만)
  const latin = bases.filter(x => /[A-Za-z]/.test(x));
  if(latin.length){
    const eh = collectPages(await wikiQuery(EN_API, { titles: latin.join('|') }), latin, all);
    const r = await resolveHits(eh);
    if(r.status === 'found') return r.src || null;
  }
  return null;
}

function lookupImage(a){
  if(!a) return Promise.resolve(null);
  if(imgCache.has(a)) return imgCache.get(a);
  const key = 'quoteimg:v3:' + a;   // 이전 버전에서 저장된(틀릴 수 있는) 결과는 사용하지 않음
  try{
    const saved = localStorage.getItem(key);
    if(saved !== null){ const p = Promise.resolve(saved || null); imgCache.set(a, p); return p; }
  }catch(e){}
  const p = findImage(a).then(src => {
    try{ localStorage.setItem(key, src || ''); }catch(e){}
    return src;
  }).catch(() => { imgCache.delete(a); return null; });   // 네트워크 오류는 저장하지 않고 다음에 다시 시도
  imgCache.set(a, p);
  return p;
}
try{ Object.keys(localStorage).forEach(k => { if(/^quoteimg:v[12]:/.test(k)) localStorage.removeItem(k); }); }catch(e){}
let bgToken = 0;
function showBackground(a){
  const my = ++bgToken;
  sBg.classList.remove('on');
  lookupImage(a).then(src => {
    if(!src || my !== bgToken) return;
    const im = new Image();
    im.onload = () => {
      if(my !== bgToken) return;
      sBg.style.backgroundImage = `url("${src}")`;
      requestAnimationFrame(() => sBg.classList.add('on'));
    };
    im.src = src;
  });
}
function prefetch(){
  for(let s = 1; s <= 3; s++){
    const a = QUOTES[deck[(sIdx + s) % deck.length]][1];
    lookupImage(a).then(src => { if(src){ const im = new Image(); im.src = src; } });
  }
}

function renderSlide(){
  const [q, a] = QUOTES[deck[sIdx]];
  const k = a.indexOf(',');
  // 쉼표·마침표 단위로 나눈 뒤, 각 부분 안에서는 단어 단위로 줄 길이를 고르게 맞춤
  sQuote.innerHTML = breakLines(q).split('\n').map(p => `<span class="ln">${esc(p)}</span>`).join('');
  sAuthor.innerHTML = a ? (k < 0 ? `<strong>${esc(a)}</strong>` : `<strong>${esc(a.slice(0, k).trim())}</strong>${esc(a.slice(k + 1).trim())}`) : '';
  showEl.style.setProperty('--sc', COLORS[sIdx % COLORS.length]);
  sBar.style.width = ((sIdx + 1) / deck.length * 100) + '%';
  showBackground(a);
  prefetch();
}
function go(step){
  sIdx = (sIdx + step + deck.length) % deck.length;   // 끝나면 처음으로 (무한 반복)
  slideEl.classList.add('out');
  setTimeout(() => { renderSlide(); slideEl.classList.remove('out'); }, 180);
}
function schedule(){
  clearInterval(timer);
  if(playing) timer = setInterval(() => go(1), speed);
}
function setPlaying(p){
  playing = p;
  sPlay.innerHTML = p ? ICON_PAUSE : ICON_PLAY;
  sPlay.setAttribute('aria-label', p ? '멈춤' : '재생');
  schedule();
}
function openShow(){
  deck = shuffle([...QUOTES.keys()]);   // 전체 어록을 랜덤 순서로
  sIdx = 0;
  renderSlide();
  showEl.hidden = false;
  document.body.classList.add('presenting');
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); }catch(e){}
  setPlaying(true);
}
function closeShow(){
  clearInterval(timer);
  bgToken++;
  sBg.classList.remove('on');
  showEl.hidden = true;
  document.body.classList.remove('presenting');
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
document.getElementById('btnPresent').addEventListener('click', openShow);
document.getElementById('sClose').addEventListener('click', closeShow);
document.getElementById('sPrev').addEventListener('click', () => { setPlaying(false); go(-1); });
document.getElementById('sNext').addEventListener('click', () => { setPlaying(false); go(1); });
sPlay.addEventListener('click', () => setPlaying(!playing));
document.querySelectorAll('.speed button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.speed button').forEach(x => x.classList.toggle('on', x === b));
  speed = +b.dataset.speed;
  schedule();
}));
document.addEventListener('keydown', e => {
  if(showEl.hidden) return;
  if(e.key === 'Escape'){ closeShow(); }
  else if(e.key === 'ArrowRight'){ setPlaying(false); go(1); }
  else if(e.key === 'ArrowLeft'){ setPlaying(false); go(-1); }
  else if(e.key === ' '){ e.preventDefault(); setPlaying(!playing); }
});
document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement && !showEl.hidden) closeShow();   // 브라우저에서 전체화면을 해제하면 함께 종료
});

/* ===== 프레젠테이션 화면을 JPG로 전체 저장 (ZIP) ===== */
const HEX = ['#E2B55E','#E78A6E','#6CC3B0','#A99BE6','#72AEE6'];
const W = 1920, H = 1080;

function loadCorsImage(src){
  return new Promise(res => {
    if(!src) return res(null);
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => res(null);
    im.src = src;
    setTimeout(() => res(null), 15000);
  });
}
/* 한글은 띄어쓰기 단위로 줄바꿈 (단어가 너무 길면 글자 단위) */
function wrapLines(ctx, text, maxW){
  // 필요한 줄 수는 그대로 두고, 줄 길이를 고르게 나눔 (마지막 줄에 한두 단어만 남지 않도록)
  const k = greedyWrap(ctx, text, maxW).length;
  if(k <= 1) return greedyWrap(ctx, text, maxW);
  let lo = 1, hi = maxW;
  for(let it = 0; it < 24; it++){
    const mid = (lo + hi) / 2;
    if(greedyWrap(ctx, text, mid).length <= k) hi = mid; else lo = mid;
  }
  return greedyWrap(ctx, text, hi);
}
function greedyWrap(ctx, text, maxW){
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width <= maxW){ cur = test; return; }
    if(cur) lines.push(cur);
    if(ctx.measureText(w).width <= maxW){ cur = w; return; }
    cur = '';
    for(const ch of w){
      if(ctx.measureText(cur + ch).width > maxW){ lines.push(cur); cur = ch; } else cur += ch;
    }
  });
  if(cur) lines.push(cur);
  return lines;
}
function drawSlide(ctx, idx, n, photo){
  const [q, a] = QUOTES[idx];
  const color = HEX[n % HEX.length];
  // 배경
  ctx.fillStyle = '#0C0E12'; ctx.fillRect(0, 0, W, H);
  let g = ctx.createRadialGradient(W * .8, 0, 0, W * .8, 0, 1000);
  g.addColorStop(0, 'rgba(226,181,94,.12)'); g.addColorStop(.6, 'rgba(226,181,94,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(0, H, 0, 0, H, 900);
  g.addColorStop(0, 'rgba(108,195,176,.10)'); g.addColorStop(.6, 'rgba(108,195,176,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 인물 사진 (화면과 같은 흐림·어둡게)
  if(photo){
    const s = Math.max(W / photo.width, H / photo.height) * 1.02;
    const dw = photo.width * s, dh = photo.height * s;
    ctx.save();
    ctx.globalAlpha = .22;
    ctx.filter = 'grayscale(30%) saturate(80%) brightness(80%) blur(2px)';
    ctx.drawImage(photo, (W - dw) / 2, (H - dh) * .22, dw, dh);
    ctx.restore();
    ctx.filter = 'none';
  }
  // 어두운 막
  g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .55);
  g.addColorStop(0, 'rgba(12,14,18,.78)'); g.addColorStop(.7, 'rgba(12,14,18,.5)'); g.addColorStop(1, 'rgba(12,14,18,.8)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(12,14,18,.45)'); g.addColorStop(.25, 'rgba(12,14,18,.2)'); g.addColorStop(.7, 'rgba(12,14,18,.2)'); g.addColorStop(1, 'rgba(12,14,18,.85)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 어록 글씨 크기 자동 맞춤
  const maxW = 1560;
  let size = 80, lines, lh;
  for(; size >= 40; size -= 2){
    ctx.font = `800 ${size}px "Nanum Myeongjo", serif`;
    lines = breakLines(q).split('\n').flatMap(par => wrapLines(ctx, par, maxW));
    lh = size * 1.55;
    if(lines.length * lh <= 560) break;
  }
  const markH = 0, authorGap = 60, authorH = 40;
  const blockH = markH + lines.length * lh + authorGap + authorH;
  let y = (H - blockH) / 2;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  y += markH;
  // 어록
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 3;
  ctx.fillStyle = '#F4F0E8';
  ctx.font = `800 ${size}px "Nanum Myeongjo", serif`;
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, y + i * lh + size * 1.05));
  ctx.restore();
  y += lines.length * lh + authorGap;
  // 인물
  if(a){
    const k = a.indexOf(',');
    const nm = (k < 0 ? a : a.slice(0, k)).trim();
    const ds = k < 0 ? '' : a.slice(k + 1).trim();
    ctx.font = '700 32px "Noto Sans KR", sans-serif';
    const w1 = ctx.measureText(nm).width;
    ctx.font = '400 32px "Noto Sans KR", sans-serif';
    const w2 = ds ? ctx.measureText(ds).width + 16 : 0;
    let x = W / 2 - (w1 + w2) / 2;
    ctx.textAlign = 'left';
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 12;
    ctx.fillStyle = color; ctx.font = '700 32px "Noto Sans KR", sans-serif';
    ctx.fillText(nm, x, y + 32);
    if(ds){ ctx.fillStyle = '#B4BBC7'; ctx.font = '400 32px "Noto Sans KR", sans-serif'; ctx.fillText(ds, x + w1 + 16, y + 32); }
    ctx.restore();
  }
}

/* --- 간단한 ZIP 만들기 (압축 없이 묶기) --- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  files.forEach(f => {
    const name = enc.encode(f.name);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, f.crc, true);
    h.setUint32(18, f.data.length, true); h.setUint32(22, f.data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, f.data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, f.crc, true);
    c.setUint32(20, f.data.length, true); c.setUint32(24, f.data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    central.push(c.buffer, name);
    offset += 30 + name.length + f.data.length;
  });
  const cdSize = central.reduce((s, p) => s + (p.byteLength || p.length), 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [e.buffer]), { type: 'application/zip' });
}

const expEl = document.getElementById('exp');
const expStart = document.getElementById('expStart');
const expCancel = document.getElementById('expCancel');
const expState = document.getElementById('expState');
const expBar = document.getElementById('expBar');
let exporting = false, cancelExport = false;

const isWindowsPC = (() => {
  const plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  const win = /win/i.test(plat) || /Windows NT/i.test(navigator.userAgent);
  const fine = window.matchMedia('(pointer: fine)').matches;
  return win && fine;
})();
document.getElementById('expZone').hidden = !isWindowsPC;

document.getElementById('btnExport').addEventListener('click', () => {
  if(playing) setPlaying(false);   // 저장 창을 여는 동안 재생 멈춤
  document.getElementById('expTotal').textContent = fmt(QUOTES.length);
  document.getElementById('expProg').hidden = true;
  expState.textContent = '';
  expStart.disabled = false;
  expCancel.textContent = '닫기';
  expEl.hidden = false;
});
expCancel.addEventListener('click', () => {
  if(exporting){ cancelExport = true; expState.textContent = '취소하는 중…'; return; }
  expEl.hidden = true;
});
expStart.addEventListener('click', async () => {
  exporting = true; cancelExport = false;
  expStart.disabled = true;
  expCancel.textContent = '취소';
  document.getElementById('expProg').hidden = false;
  const withPhoto = document.getElementById('expPhoto').checked;
  try{
    await Promise.all([
      document.fonts.load('800 80px "Nanum Myeongjo"', '가나다'),
      document.fonts.load('700 32px "Noto Sans KR"', '가나다'),
      document.fonts.load('400 32px "Noto Sans KR"', '가나다')
    ]);
  }catch(e){}
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const files = [];
  const total = QUOTES.length;
  const pad = String(total).length;
  // 사진 찾기는 여러 개를 미리 동시에 진행
  const photoJobs = new Map();
  const want = i => { if(withPhoto && i < total && !photoJobs.has(i)) photoJobs.set(i, lookupImage(QUOTES[i][1]).then(loadCorsImage).catch(() => null)); };
  for(let i = 0; i < Math.min(8, total); i++) want(i);
  let photos = 0;
  for(let i = 0; i < total; i++){
    if(cancelExport) break;
    want(i + 8);
    const photo = withPhoto ? await photoJobs.get(i) : null;
    photoJobs.delete(i);
    drawSlide(ctx, i, i, photo);
    let blob;
    try{
      blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
    }catch(e){
      drawSlide(ctx, i, i, null);   // 사진 때문에 저장이 막히면 사진 없이 저장
      blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88));
    }
    if(!blob){ drawSlide(ctx, i, i, null); blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.88)); }
    else if(photo) photos++;
    const data = new Uint8Array(await blob.arrayBuffer());
    const who = parsePerson(QUOTES[i][1]).name.replace(/[\\/:*?"<>|]/g, '').slice(0, 30) || '어록';
    files.push({ name: `${String(i + 1).padStart(pad, '0')}_${who}.jpg`, data, crc: crc32(data) });
    expBar.style.width = ((i + 1) / total * 100) + '%';
    expState.textContent = `${fmt(i + 1)} / ${fmt(total)}장 만드는 중…` + (withPhoto ? ` (사진 포함 ${fmt(photos)}장)` : '');
  }
  if(files.length){
    expState.textContent = 'ZIP 파일로 묶는 중…';
    await new Promise(r => setTimeout(r, 30));
    const zip = makeZip(files);
    const url = URL.createObjectURL(zip);
    const link = document.createElement('a');
    link.href = url;
    link.download = `인플루언서_어록_이미지_${files.length}장.zip`;
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    expState.textContent = (cancelExport ? '취소되어 여기까지 ' : '완료! ') + `${fmt(files.length)}장을 저장했습니다.` + (withPhoto ? ` (사진 포함 ${fmt(photos)}장)` : '');
  }else{
    expState.textContent = '취소되었습니다.';
  }
  exporting = false;
  expStart.disabled = false;
  expCancel.textContent = '닫기';
});

randomTitle();
showRandom();
