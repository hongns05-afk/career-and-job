<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교사용 실시간 부저 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      display: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #3b82f6;
      padding-bottom: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 { margin: 0; font-size: 24px; color: #1e3a8a; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    button {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .reset-btn { background-color: #ef4444; color: white; }
    .reset-btn:hover { background-color: #dc2626; }
    .excel-btn { background-color: #10b981; color: white; }
    .excel-btn:hover { background-color: #059669; }
    .logout-btn { background-color: #64748b; color: white; }

    .winner-card {
      background: linear-gradient(135deg, #fef3c7 0%, #fde047 100%);
      border: 2px solid #f59e0b;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
    }
    .winner-card h2 { margin: 0 0 8px 0; font-size: 18px; color: #b45309; }
    .winner-name { font-size: 32px; font-weight: 800; color: #78350f; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px 16px; text-align: center; border-bottom: 1px solid #e2e8f0; }
    th { background-color: #f8fafc; color: #475569; font-size: 15px; }
    tr:hover { background-color: #f1f5f9; }

    .rank-badge {
      display: inline-block; width: 32px; height: 32px; line-height: 32px;
      border-radius: 50%; font-weight: bold; color: white; background-color: #94a3b8;
    }
    .rank-1 { background-color: #f59e0b; }
    .rank-2 { background-color: #94a3b8; }
    .rank-3 { background-color: #b45309; }

    .empty-state { text-align: center; padding: 40px; color: #94a3b8; font-size: 16px; }

    .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.92); display: flex; justify-content: center; align-items: center; z-index: 999999; padding: 20px; }
    .auth-card { background: #ffffff; padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 360px; text-align: center; }
    .auth-card h2 { margin: 0 0 10px 0; font-size: 1.3rem; color: #0f172a; }
    .auth-card p { font-size: 0.88rem; color: #64748b; margin-bottom: 20px; }
    .auth-card input { width: 100%; padding: 14px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 1.05rem; text-align: center; margin-bottom: 12px; outline: none; }
    .auth-card input:focus { border-color: #2563eb; }
    .auth-card button { width: 100%; padding: 14px; background: #2563eb; color: white; border-radius: 12px; font-size: 1rem; }
    .auth-card button:disabled { background: #94a3b8; }
    .auth-error { color: #ef4444; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>🔒 교사용 부저 로그인</h2>
    <p>선생님 계정(이메일, 비밀번호)으로 로그인해 주세요.</p>
    <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password">
    <button id="authBtn">로그인</button>
    <div class="auth-error" id="authError">⚠️ 로그인에 실패했습니다.</div>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="header">
    <h1>🚨 실시간 선착순 부저 현황</h1>
    <div class="btn-group">
      <button class="reset-btn" id="resetBtn">🔄 부저 리셋</button>
      <button class="excel-btn" id="excelBtn">📊 엑셀 저장</button>
      <button class="logout-btn" id="logoutBtn">🔒 로그아웃</button>
    </div>
  </div>

  <div class="winner-card" id="winnerCard" style="display: none;">
    <h2>🏆 1등 눌림 감지!</h2>
    <div class="winner-name" id="winnerName">-</div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 15%;">순위</th>
        <th style="width: 40%;">학번 (이름)</th>
        <th style="width: 45%;">눌른 시간</th>
      </tr>
    </thead>
    <tbody id="buzzerList">
      <tr>
        <td colspan="3" class="empty-state">학생들이 부저를 누르면 여기에 실시간으로 표시됩니다.</td>
      </tr>
    </tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
    authDomain: "activity3-bcbca.firebaseapp.com",
    databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
    projectId: "activity3-bcbca",
    storageBucket: "activity3-bcbca.firebasestorage.app",
    messagingSenderId: "698284558768",
    appId: "1:698284558768:web:8f8877735a2580af8a6e75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const buzzerRef = ref(db, 'buzzer_submissions');

  let currentSubmissions = [];
  let unsubscribe = null;

  // 학생이 입력한 글이 화면에서 코드로 실행되지 않도록 바꿔 주는 함수
  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---------- 로그인 / 로그아웃 ----------
  const authOverlay = document.getElementById('authOverlay');
  const mainContainer = document.getElementById('mainContainer');
  const authBtn = document.getElementById('authBtn');
  const authError = document.getElementById('authError');
  const emailInput = document.getElementById('loginEmail');
  const passInput = document.getElementById('loginPassword');

  async function doLogin() {
    const email = emailInput.value.trim();
    const pass = passInput.value;
    if (!email || !pass) {
      authError.innerText = '⚠️ 이메일과 비밀번호를 모두 입력해 주세요.';
      authError.style.display = 'block';
      return;
    }
    authBtn.disabled = true;
    authBtn.innerText = '로그인 중...';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      authError.style.display = 'none';
      passInput.value = '';
    } catch (err) {
      authError.innerText = '⚠️ 이메일 또는 비밀번호가 맞지 않습니다.';
      authError.style.display = 'block';
      passInput.value = '';
    } finally {
      authBtn.disabled = false;
      authBtn.innerText = '로그인';
    }
  }

  authBtn.addEventListener('click', doLogin);
  passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
  emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') passInput.focus(); });
  document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth); });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      authOverlay.style.display = 'none';
      mainContainer.style.display = 'block';
      startListening();
    } else {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      mainContainer.style.display = 'none';
      authOverlay.style.display = 'flex';
    }
  });

  // ---------- 실시간 부저 목록 ----------
  function startListening() {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    unsubscribe = onValue(buzzerRef, (snapshot) => {
      const data = snapshot.val();
      const tbody = document.getElementById('buzzerList');
      const winnerCard = document.getElementById('winnerCard');
      const winnerName = document.getElementById('winnerName');

      if (!data) {
        currentSubmissions = [];
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">학생들이 부저를 누르면 여기에 실시간으로 표시됩니다.</td></tr>';
        winnerCard.style.display = 'none';
        return;
      }

      const list = Object.keys(data).map(key => ({
        id: key,
        name: data[key].name || data[key].studentInfo || '미입력',
        timestamp: data[key].timestamp || 0
      })).sort((a, b) => a.timestamp - b.timestamp);

      currentSubmissions = list;
      tbody.innerHTML = '';

      if (list.length > 0) {
        winnerCard.style.display = 'block';
        winnerName.innerText = list[0].name;
      }

      list.forEach((item, index) => {
        const rank = index + 1;
        const date = item.timestamp ? new Date(item.timestamp) : new Date();
        const timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}.${date.getMilliseconds().toString().padStart(3, '0')}`;

        let rankClass = 'rank-badge';
        if (rank === 1) rankClass += ' rank-1';
        else if (rank === 2) rankClass += ' rank-2';
        else if (rank === 3) rankClass += ' rank-3';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="${rankClass}">${rank}</span></td>
          <td style="font-weight: bold; font-size: 16px;">${esc(item.name)}</td>
          <td style="color: #64748b;">${timeStr}</td>
        `;
        tbody.appendChild(tr);
      });
    }, (error) => {
      document.getElementById('buzzerList').innerHTML = '<tr><td colspan="3" class="empty-state">데이터를 불러오지 못했습니다: ' + esc(error.message) + '</td></tr>';
    });
  }

  // 🔄 부저 초기화 (리셋) - 선생님 로그인 상태에서만 가능
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm("부저 현황을 초기화하시겠습니까? (학생들이 다시 누를 수 있게 됩니다)")) {
      remove(buzzerRef).then(() => {
        alert("부저가 성공적으로 리셋되었습니다!");
      }).catch(err => {
        alert("리셋 실패: " + err.message);
      });
    }
  });

  // 📊 엑셀(CSV) 저장
  document.getElementById('excelBtn').addEventListener('click', () => {
    if (currentSubmissions.length === 0) {
      alert("다운로드할 부저 기록이 없습니다.");
      return;
    }

    let csvContent = "\uFEFF순위,학번(이름),시간\n";
    currentSubmissions.forEach((item, index) => {
      const date = item.timestamp ? new Date(item.timestamp) : new Date();
      const timeStr = `${date.getHours()}:${date.getMinutes()}:${date.getSeconds()}.${date.getMilliseconds()}`;
      const safeName = String(item.name).replace(/"/g, '""');
      csvContent += `${index + 1},"${safeName}","${timeStr}"\n`;
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `선착순_부저_기록_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>

</body>
</html>
