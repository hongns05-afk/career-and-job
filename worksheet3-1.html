<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3-1. 나의 학습 성격 유형 진단</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #fdf2f4; color: #1e293b; margin: 0; padding: 15px; }
    
    .container { max-width: 750px; margin: 0 auto; background: white; padding: 25px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    
    .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }
    .header h1 { font-size: 1.4rem; color: #0f172a; margin: 0 0 8px 0; }
    .header p { font-size: 0.9rem; color: #64748b; margin: 0; }

    /* 학번/이름 입력 */
    .user-info { display: flex; gap: 10px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 12px; }
    .user-info input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    .user-info input:focus { border-color: #2563eb; }

    .section-title { font-size: 1.05rem; font-weight: bold; color: #1e293b; margin: 25px 0 12px 0; display: flex; align-items: center; gap: 8px; }
    .section-title span.badge { background: #2563eb; color: white; border-radius: 50%; width: 22px; height: 22px; display: inline-flex; justify-content: center; align-items: center; font-size: 0.8rem; }

    /* 진단 문항 스타일 */
    .question-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .question-card { background: #fafafa; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .question-text { font-size: 0.95rem; font-weight: 500; color: #334155; flex: 1; }
    .options { display: flex; gap: 8px; }
    .opt-btn { padding: 8px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px; background: white; font-weight: bold; cursor: pointer; transition: 0.2s; user-select: none; }
    .opt-btn.yes.selected { background: #2563eb; color: white; border-color: #2563eb; }
    .opt-btn.no.selected { background: #ef4444; color: white; border-color: #ef4444; }

    /* 진단 결과 카드 스타일 (동점 대응) */
    .result-box { display: none; background: #eff6ff; border: 2px solid #bfdbfe; border-radius: 16px; padding: 20px; margin-bottom: 25px; }
    .result-header { font-size: 1.2rem; font-weight: bold; color: #1d4ed8; margin-bottom: 15px; text-align: center; }
    .type-card { background: white; border: 1px solid #cbd5e1; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
    .type-card:last-child { margin-bottom: 0; }
    .type-title { font-size: 1.1rem; font-weight: bold; color: #2563eb; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .type-desc { font-size: 0.9rem; color: #475569; line-height: 1.6; }
    .type-desc strong { color: #0f172a; }

    /* 주관식 입력 */
    textarea { width: 100%; height: 100px; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 0.95rem; outline: none; resize: none; margin-top: 5px; font-family: inherit; }
    textarea:focus { border-color: #2563eb; }

    /* 안내 메시지 및 버튼 */
    .status-msg { font-size: 0.85rem; color: #ef4444; text-align: center; margin-top: 15px; font-weight: bold; }
    .status-msg.ok { color: #059669; }

    .btn-submit { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; background: #94a3b8; color: white; cursor: not-allowed; margin-top: 15px; transition: 0.3s; }
    .btn-submit.active { background: #2563eb; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📘 3-1. 나의 학습 성격 유형 진단</h1>
    <p>솔직하게 답변하여 나의 학습 유형을 파악하고 최선의 학습법을 찾아봅시다.</p>
  </div>

  <!-- 인적사항 입력 -->
  <div class="user-info">
    <input type="text" id="studentId" placeholder="학번 (예: 10101)" inputmode="numeric">
    <input type="text" id="studentName" placeholder="이름 (예: 홍길동)">
  </div>

  <!-- 1단계: 진단 문항 -->
  <div class="section-title">
    <span class="badge">1</span> 학습 성격 진단 문항 (<span id="answeredCount">0</span>/8 문항 답변됨)
  </div>
  <div class="question-list" id="questionList"></div>

  <!-- 진단 결과 영역 (동점 시 복수 유형 자동 표시) -->
  <div class="result-box" id="resultBox">
    <div class="result-header" id="resultHeader">📊 진단 결과</div>
    <div id="resultCardsContainer"></div>
  </div>

  <!-- 2단계: 주관식 작성 -->
  <div class="section-title">
    <span class="badge">2</span> 진단 소감 및 나만의 학습 개선 계획
  </div>
  <textarea id="improvementInput" placeholder="진단 결과에 따른 나의 강점과 앞으로 보완할 학습 계획을 작성해 주세요. (최소 5자 이상)"></textarea>

  <!-- 상태 안내 및 제출 버튼 -->
  <div class="status-msg" id="statusMsg">⚠️ 학번, 이름 및 모든 문항에 답변해 주세요.</div>
  <button class="btn-submit" id="submitBtn" disabled>제출하기</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
    authDomain: "activity3-bcbca.firebaseapp.com",
    databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
    projectId: "activity3-bcbca",
    storageBucket: "activity3-bcbca.firebasestorage.app",
    messagingSenderId: "698284558768",
    appId: "1:698284558768:web:8f8877735a2580af8a6e75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 학습 성격 유형 질문 데이터
  const questions = [
    { id: 1, type: "행동형", text: "나는 직접 체험하거나 실습하며 공부할 때 가장 기억에 잘 남는다." },
    { id: 2, type: "행동형", text: "오래 앉아 이론 공부를 하기보다는 활발하게 활동하는 수업을 선호한다." },
    { id: 3, type: "규범형", text: "체계적인 계획표를 세우고 매일 정해진 분량을 규칙적으로 공부하는 편이다." },
    { id: 4, type: "규범형", text: "노트 정리나 자료 정리를 깔끔하게 순서대로 기록하는 것을 좋아한다." },
    { id: 5, type: "탐구형", text: "원리나 이유를 깊이 있게 원론적으로 이해해야 마음이 편하다." },
    { id: 6, type: "탐구형", text: "새로운 지식을 접하면 스스로 추가 자료를 찾아 탐구하는 편이다." },
    { id: 7, type: "이상형", text: "친구들과 토론하거나 내 생각을 자유롭게 나누며 학습할 때 흥미를 느낀다." },
    { id: 8, type: "이상형", text: "학습 내용이 나와 세상에 어떤 의미가 있는지 가치를 고민해 본다." }
  ];

  // 유형별 상세 설명
  const typeDetails = {
    "행동형": {
      title: "🏃‍♂️ 행동형 (Action Learner)",
      desc: "<strong>특징:</strong> 몸으로 경험하고 직접 실습할 때 집중력이 극대화됩니다.<br><strong>추천 학습법:</strong> 실험, 실습, 암기 시 손으로 직접 쓰거나 롤플레잉 적용하기"
    },
    "규범형": {
      title: "📋 규범형 (Structured Learner)",
      desc: "<strong>특징:</strong> 체계적인 계획과 정돈된 환경에서 최고 효율을 냅니다.<br><strong>추천 학습법:</strong> 스터디 플래너 작성, 목차별 요약 노트 정리, 정해진 시간표 준수"
    },
    "탐구형": {
      title: "🔍 탐구형 (Inquisitive Learner)",
      desc: "<strong>특징:</strong> '왜?'라는 질문을 던지고 인과관계를 이해하는 것을 중요하게 생각합니다.<br><strong>추천 학습법:</strong> 마인드맵 그리기, 관련 전문 서적이나 다큐멘터리 찾아보기"
    },
    "이상형": {
      title: "💡 이상형 (Creative/Collaborative Learner)",
      desc: "<strong>특징:</strong> 상상력이 풍부하며 타인과의 소통과 상호작용을 좋아합니다.<br><strong>추천 학습법:</strong> 친구와 서로 가르쳐주기, 토론 학습, 아이디어 다이어그램 활용"
    }
  };

  // 학생 답변 저장 객체
  let answers = {}; // { 1: true, 2: false, ... }
  let topResultTypes = []; // 최고 점수 유형 배열 (동점 처리용)

  const questionListElem = document.getElementById('questionList');
  const studentIdInput = document.getElementById('studentId');
  const studentNameInput = document.getElementById('studentName');
  const improvementInput = document.getElementById('improvementInput');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  const answeredCountSpan = document.getElementById('answeredCount');

  // 문항 렌더링
  questions.forEach(q => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `
      <div class="question-text">Q${q.id}. ${q.text}</div>
      <div class="options">
        <button class="opt-btn yes" data-id="${q.id}" data-val="true">예</button>
        <button class="opt-btn no" data-id="${q.id}" data-val="false">아니오</button>
      </div>
    `;
    questionListElem.appendChild(card);
  });

  // 버튼 클릭 이벤트 (언제든 재선택 가능)
  document.querySelectorAll('.opt-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const qId = parseInt(e.target.dataset.id);
      const val = e.target.dataset.val === "true";

      answers[qId] = val;

      // 스타일 업데이트
      const parent = e.target.parentElement;
      parent.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
      e.target.classList.add('selected');

      answeredCountSpan.innerText = Object.keys(answers).length;
      calculateAndRenderResults();
      validateForm();
    });
  });

  // 점수 계산 및 결과 렌더링 (동점 감지 로직)
  function calculateAndRenderResults() {
    if (Object.keys(answers).length < questions.length) {
      document.getElementById('resultBox').style.display = 'none';
      return;
    }

    // 유형별 점수 집계
    const scores = { "행동형": 0, "규범형": 0, "탐구형": 0, "이상형": 0 };
    questions.forEach(q => {
      if (answers[q.id] === true) {
        scores[q.type]++;
      }
    });

    // 최고 점수 계산
    const maxScore = Math.max(...Object.values(scores));
    
    // 최고 점수를 받은 모든 유형 추출 (동점 포함)
    topResultTypes = Object.keys(scores).filter(type => scores[type] === maxScore);

    const resultBox = document.getElementById('resultBox');
    const resultHeader = document.getElementById('resultHeader');
    const container = document.getElementById('resultCardsContainer');
    
    container.innerHTML = '';
    resultBox.style.display = 'block';

    if (topResultTypes.length > 1) {
      resultHeader.innerText =
