<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 제출 현황판</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #fdf2f4; color: #1e293b; margin: 0; padding: 15px; }
    
    /* [모바일 완벽 대응] 비밀번호 인증 레이어 */
    .auth-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center;
      z-index: 999999 !important; /* 모바일 최상단 고정 */
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%; max-width: 360px;
      text-align: center;
    }
    .auth-card h2 { margin: 0 0 10px 0; font-size: 1.3rem; color: #0f172a; }
    .auth-card p { font-size: 0.88rem; color: #64748b; margin-bottom: 20px; word-break: keep-all; }
    .auth-card input {
      width: 100%; padding: 14px;
      border: 2px solid #cbd5e1; border-radius: 12px;
      font-size: 1.1rem; text-align: center; margin-bottom: 15px; outline: none;
      -webkit-appearance: none;
    }
    .auth-card input:focus { border-color: #2563eb; }
    .auth-card button {
      width: 100%; padding: 14px; background: #2563eb; color: white;
      border: none; border-radius: 12px; font-size: 1rem; font-weight: bold;
      cursor: pointer; transition: 0.2s;
    }
    .auth-card button:active { background: #1d4ed8; }
    .auth-error { color: #ef4444; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: bold; }

    /* 대시보드 메인 영역 (인증 전 강력 숨김) */
    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: none; }
    
    /* 상단 헤더 */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 8px; color: #0f172a; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
    .btn-presentation { background: #a855f7; color: white; }
    .btn-excel { background: #10b981; color: white; }
    .btn-delete { background: #ef4444; color: white; }
    .btn-logout { background: #64748b; color: white; }

    /* 필터 바 */
    .filter-bar { background: #f1f5f9; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .filter-group { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9rem; width: 100%; justify-content: space-between; }
    @media (min-width: 640px) {
      .filter-group { width: auto; justify-content: start; }
    }
    select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; background: white; }

    /* 학생 그리드 모바일 대응 */
    .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .student-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 25px; }
    @media (min-width: 640px) {
      .student-grid { grid-template-columns: repeat(10, 1fr); }
    }
    .student-card { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 8px; padding: 10px 2px; text-align: center; }
    .student-card .num { font-weight: bold; font-size: 0.85rem; color: #334155; }
    .student-card .status { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
    .student-card.submitted { background: #eff6ff; border-color: #bfdbfe; }
    .student-card.submitted .num { color: #1d4ed8; }
    .student-card.submitted .status { color: #2563eb; font-weight: bold; }

    /* 테이블 모바일 가로 스크롤 보장 */
    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px 12px; text-align: left; font-size: 0.85rem; }
    th { background: #f8fafc; color: #475569; font-weight: bold; }
    .text-center { text-align: center; }
    
    .del-item-btn { background: #fee2e2; color: #ef4444; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
    .sub-text { font-size: 0.78rem; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>

<!-- 모바일 최적화 비밀번호 창 -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>🔒 교사용 대시보드 인증</h2>
    <p>선생님 관리용 비밀번호를 입력해 주세요.</p>
    <input type="password" id="adminPasswordInput" placeholder="비밀번호 입력" inputmode="numeric">
    <button id="authBtn">확인 및 접속</button>
    <div class="auth-error" id="authError">⚠️ 비밀번호가 불일치합니다.</div>
  </div>
</div>

<div class="container" id="mainContainer">
  <!-- 헤더 -->
  <div class="header">
    <h1>📊 실시간 제출 현황판</h1>
    <div class="header-btns">
      <button class="btn btn-presentation" id="btnPresentation">🔮 발표</button>
      <button class="btn btn-excel" id="btnExcel">🧪 엑셀</button>
      <button class="btn btn-delete" id="btnDeleteAll">🗑️ 전체삭제</button>
      <button class="btn btn-logout" id="btnLogout">🔒 잠금</button>
    </div>
  </div>

  <!-- 필터 선택 바 -->
  <div class="filter-bar">
    <div class="filter-group">
      <span>📘 활동지:</span>
      <select id="activitySelect">
        <option value="1단원">1단원 (진로 특성 직업)</option>
        <option value="2단원">2단원 (창업가 정신)</option>
        <option value="3단원">3단원 (학습 성격 유형)</option>
      </select>
    </div>
    <div class="filter-group">
      <span>🏫 학급:</span>
      <select id="classSelect">
        <option value="1">1반</option>
        <option value="2">2반</option>
        <option value="3">3반</option>
        <option value="4">4반</option>
        <option value="5">5반</option>
        <option value="6">6반</option>
        <option value="7">7반</option>
        <option value="8">8반</option>
        <option value="9">9반</option>
        <option value="10">10반</option>
      </select>
    </div>
  </div>

  <!-- 학급 제출 현황 그리드 -->
  <div class="section-title">
    <span>📌 학급 제출 현황 (1~40번)</span>
    <span style="color: #2563eb;" id="submissionCounter">제출: 0명 / 40명</span>
  </div>
  <div class="student-grid" id="studentGrid"></div>

  <!-- 답변 내역 테이블 -->
  <div class="section-title" id="tableTitle">
    📝 [1단원] 진로 특성에 맞는 직업 찾기 답변 내역
  </div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 12%;">학번</th>
          <th style="width: 25%;" id="thHeaderType">대표 선택/유형</th>
          <th id="thHeaderContent">작성 내용</th>
          <th style="width: 18%;">제출 시간</th>
          <th style="width: 10%; text-align: center;">관리</th>
        </tr>
      </thead>
      <tbody id="submissionTable">
        <tr><td colspan="5" class="text-center">데이터를 불러오는 중입니다... ⏳</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
    authDomain: "activity3-bcbca.firebaseapp.com",
    databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
    projectId: "activity3-bcbca",
    storageBucket: "activity3-bcbca.firebasestorage.app",
    messagingSenderId: "698284558768",
    appId: "1:698284558768:web:8f8877735a2580af8a6e75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let rawData = {};

  // 비밀번호 설정 (필요시 변경 가능)
  const ADMIN_PASSWORD = "1234";

  // 인증 관련 요소
  const authOverlay = document.getElementById('authOverlay');
  const mainContainer = document.getElementById('mainContainer');
  const passwordInput = document.getElementById('adminPasswordInput');
  const authBtn = document.getElementById('authBtn');
  const authError = document.getElementById('authError');

  function checkPassword() {
    if (passwordInput.value.trim() === ADMIN_PASSWORD) {
      authOverlay.style.display = 'none';
      mainContainer.style.display = 'block';
      authError.style.display = 'none';
      passwordInput.value = '';
      attachRealtimeListener();
    } else {
      authError.style.display = 'block';
      passwordInput.value = '';
      passwordInput.focus();
    }
  }

  authBtn.addEventListener('click', checkPassword);
  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  document.getElementById('btnLogout').addEventListener('click', () => {
    mainContainer.style.display = 'none';
    authOverlay.style.display = 'flex';
  });

  function renderGrid() {
    const grid = document.getElementById('studentGrid');
    grid.innerHTML = '';
    for (let i = 1; i <= 40; i++) {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.id = `card-num-${i}`;
      card.innerHTML = `
        <div class="num">${i}번</div>
        <div class="status" id="status-num-${i}">미제출</div>
      `;
      grid.appendChild(card);
    }
  }

  function parseStudentInfo(infoStr) {
    if (!infoStr) return { classNum: '', seatNum: 0 };
    const cleanStr = String(infoStr).replace(/[^0-9]/g, '');
    
    if (cleanStr.length === 5) {
      return {
        classNum: parseInt(cleanStr.substring(1, 3), 10).toString(),
        seatNum: parseInt(cleanStr.substring(3), 10)
      };
    } else if (cleanStr.length === 4) {
      return {
        classNum: cleanStr.substring(1, 2),
        seatNum: parseInt(cleanStr.substring(2), 10)
      };
    }
    return { classNum: '', seatNum: 0 };
  }

  function getPathByUnit(unit) {
    if (unit === '1단원') return 'worksheet1_submissions';
    if (unit === '2단원') return 'yeep_activity_submissions';
    if (unit === '3단원') return 'learning_activity_submissions';
    return 'worksheet1_submissions';
  }

  function updateDashboard() {
    renderGrid();
    
    const selectedUnit = document.getElementById('activitySelect').value;
    const selectedClass = document.getElementById('classSelect').value;
    
    if (selectedUnit === '1단원') {
      document.getElementById('tableTitle').innerText = '📝 [1단원] 진로 특성에 맞는 직업 찾기 답변 내역';
      document.getElementById('thHeaderType').innerText = '관심 직업';
      document.getElementById('thHeaderContent').innerText = '진로 특성 및 작성 내용';
    } else if (selectedUnit === '2단원') {
      document.getElementById('tableTitle').innerText = '📝 [2단원] 창업가 정신 핵심 역량 진단 답변 내역';
      document.getElementById('thHeaderType').innerText = '상위 역량군 / 역량';
      document.getElementById('thHeaderContent').innerText = '추천 창업가 & 꿈을 이루기 위한 노력';
    } else if (selectedUnit === '3단원') {
      document.getElementById('tableTitle').innerText = '📝 [3단원] 나의 학습 성격 유형 진단 답변 내역';
      document.getElementById('thHeaderType').innerText = '학습 유형 / 강점';
      document.getElementById('thHeaderContent').innerText = '개선점 및 계획';
    }

    const tableBody = document.getElementById('submissionTable');
    tableBody.innerHTML = '';

    if (!rawData || Object.keys(rawData).length === 0) {
      document.getElementById('submissionCounter').innerText = '제출: 0명 / 40명';
      tableBody.innerHTML = '<tr><td colspan="5" class="text-center">제출된 데이터가 없습니다.</td></tr>';
      return;
    }

    let submittedCount = 0;
    const items = Object.entries(rawData);

    items.forEach(([key, item]) => {
      const studentStr = item.studentId || item.studentInfo || '';
      const { classNum, seatNum } = parseStudentInfo(studentStr);

      if (classNum === selectedClass) {
        submittedCount++;

        if (seatNum >= 1 && seatNum <= 40) {
          const card = document.getElementById(`card-num-${seatNum}`);
          const status = document.getElementById(`status-num-${seatNum}`);
          if (card && status) {
            card.classList.add('submitted');
            status.innerText = '제출완료';
          }
        }

        let typeVal = '-';
        let contentVal = '-';

        if (selectedUnit === '1단원') {
          typeVal = item.jobTitle || '-';
          contentVal = item.jobDesc || '-';
        } else if (selectedUnit === '2단원') {
          typeVal = `<div><strong>${item.topGroup || '-'}</strong></div><div class="sub-text">1~3순위: ${item.topAbilitiesText || '-'}</div>`;
          contentVal = `<div>👤 <strong>창업가:</strong> ${item.entrepreneurText || '-'}</div><div style="margin-top:4px;">🎯 <strong>다짐:</strong> ${item.futurePlan || '-'}</div>`;
        } else {
          typeVal = item.learningType || item.strength || '-';
          contentVal = item.improvement || item.content || '-';
        }

        let timeVal = '-';
        if (item.submittedAt) {
          timeVal = item.submittedAt;
        } else if (item.timestamp) {
          timeVal = new Date(item.timestamp).toLocaleString('ko-KR');
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${studentStr}</strong></td>
          <td><span style="color:#2563eb;">${typeVal}</span></td>
          <td><div>${contentVal}</div></td>
          <td style="font-size:0.8rem; color:#64748b;">${timeVal}</td>
          <td class="text-center">
            <button class="del-item-btn" onclick="deleteData('${key}')">삭제</button>
          </td>
        `;
        tableBody.appendChild(tr);
      }
    });

    document.getElementById('submissionCounter').innerText = `제출: ${submittedCount}명 / 40명`;

    if (submittedCount === 0) {
      tableBody.innerHTML = '<tr><td colspan="5" class="text-center">선택한 학급의 제출 내역이 없습니다.</td></tr>';
    }
  }

  function attachRealtimeListener() {
    const selectedUnit = document.getElementById('activitySelect').value;
    const path = getPathByUnit(selectedUnit);

    const submissionsRef = ref(db, path);
    
    onValue(submissionsRef, (snapshot) => {
      rawData = snapshot.val() || {};
      updateDashboard();
    });
  }

  document.getElementById('activitySelect').addEventListener('change', attachRealtimeListener);
  document.getElementById('classSelect').addEventListener('change', updateDashboard);

  window.deleteData = function(key) {
    const selectedUnit = document.getElementById('activitySelect').value;
    const path = getPathByUnit(selectedUnit);
    
    if (confirm("이 제출 내역을 삭제하시겠습니까?")) {
      remove(ref(db, `${path}/${key}`));
    }
  };

  document.getElementById('btnDeleteAll').addEventListener('click', () => {
    const selectedUnit = document.getElementById('activitySelect').value;
    const path = getPathByUnit(selectedUnit);
    
    if (confirm(`⚠️ 정말로 [${selectedUnit}]의 모든 제출 데이터를 삭제하시겠습니까?`)) {
      remove(ref(db, path));
    }
  });

  renderGrid();
</script>

</body>
</html>
