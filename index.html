<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진로와 직업 온라인 활동지</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; padding: 40px 20px; color: #1e293b; margin: 0; }
        .main-container { max-width: 900px; margin: 0 auto; text-align: center; }
        h1 { font-size: 2rem; color: #0f172a; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .card { background: white; border-radius: 16px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: left; }
        .card h2 { font-size: 1.2rem; color: #1e3a8a; margin-top: 0; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; margin-bottom: 20px; }
        
        .btn-link { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 10px; font-weight: bold; text-decoration: none; color: white; transition: opacity 0.2s; margin-bottom: 10px; }
        .btn-link:hover { opacity: 0.9; }
        
        /* 버튼 색상 정의 */
        .bg-blue { background: #2563eb; }
        .bg-dark { background: #0f172a; }
        .bg-green { background: #059669; }
        .bg-purple { background: #7c3aed; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>📚 진로와 직업 온라인 활동지</h1>

    <div class="grid">
        <!-- Ⅰ단원 -->
        <div class="card">
            <h2>Ⅰ . 진로와 나의 이해</h2>
            <!-- files/activity1.html 또는 저장하신 1단원 파일명으로 연결 -->
            <a href="files/activity1.html" class="btn-link bg-blue">
                <span>🧩 활동지 3. 진로 특성에 맞는 직업 찾기</span>
                <span>풀기 ➔</span>
            </a>
        </div>

        <!-- Ⅱ단원 -->
        <div class="card">
            <h2>Ⅱ . 직업 세계와 진로 탐색</h2>
            <!-- files/activity2.html 또는 저장하신 2단원 파일명으로 연결 -->
            <a href="files/activity2.html" class="btn-link bg-blue">
                <span>🚀 활동지. 창업가 정신의 핵심 역량 찾기</span>
                <span>풀기 ➔</span>
            </a>
        </div>

        <!-- Ⅲ단원 -->
        <div class="card">
            <h2>Ⅲ . 진로 설계와 실천</h2>
            <!-- files/activity3.html 또는 저장하신 3단원 파일명으로 연결 -->
            <a href="files/activity3.html" class="btn-link bg-blue">
                <span>🧠 활동지. 나의 학습 성격 유형 알아보기</span>
                <span>풀기 ➔</span>
            </a>
        </div>

        <!-- Ⅳ단원 기타 -->
        <div class="card">
            <h2>Ⅳ. 기타 (수업 도우미)</h2>
            <a href="files/dashboard.html" class="btn-link bg-dark">
                <span>📊 [선생님용] 실시간 제출 현황판</span>
                <span>열기 ➔</span>
            </a>
            <a href="files/buzzer_student.html" class="btn-link bg-green">
                <span>🔔 [학생용] 실시간 퀴즈 부저</span>
                <span>열기 ➔</span>
            </a>
            <a href="files/buzzer_teacher.html" class="btn-link bg-purple">
                <span>🚨 [선생님용] 부저 실시간 순위판</span>
                <span>열기 ➔</span>
            </a>
        </div>
    </div>
</div>

</body>
</html>
