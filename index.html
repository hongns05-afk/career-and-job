<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진로와 직업 온라인 활동지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: '맑은 고딕', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      color: #334155;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 24px;
      color: #1e3a8a;
      text-align: center;
      margin-top: 0;
      margin-bottom: 25px;
    }
    .unit-box {
      margin-bottom: 25px;
    }
    .unit-title {
      font-size: 16px;
      font-weight: bold;
      color: #475569;
      border-left: 4px solid #2563eb;
      padding-left: 10px;
      margin-bottom: 12px;
    }
    .activity-card {
      display: block;
      background: #f1f5f9;
      padding: 16px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: #0f172a;
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 10px;
      transition: all 0.2s;
      border: 1px solid #e2e8f0;
    }
    .activity-card:hover {
      background: #2563eb;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
    }
    .dashboard-link {
      display: block;
      text-align: center;
      margin-top: 30px;
      padding: 12px;
      background: #0f172a;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📚 진로와 직업 온라인 활동지</h1>

  <!-- 1단원 -->
  <div class="unit-box">
    <div class="unit-title">1단원 : 자아 이해와 사회적 적응</div>
    <a href="files/activity_learning_style.html" class="activity-card">
      🧠 학습 성격 유형 알아보기
    </a>
  </div>

  <!-- 2단원 (신규 추가) -->
  <div class="unit-box">
    <div class="unit-title">2단원 : 직업 세계와 진로 탐색</div>
    <a href="files/activity_yeep.html" class="activity-card">
      🚀 창업가 정신의 핵심 역량 찾기 (YEEP 연계)
    </a>
  </div>

  <!-- 선생님용 대시보드 -->
  <a href="files/dashboard.html" class="dashboard-link">
    📊 선생님용 실시간 제출 현황판
  </a>
</div>

</body>
</html>
