<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창업가 정신 핵심 역량 진단</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f7fb; color: #1e293b; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1e3a8a; border-bottom: 2px solid #2563eb; padding-bottom: 10px; }
        .student-info { margin-bottom: 24px; background: #e0f2fe; padding: 14px 18px; border-radius: 10px; display: flex; align-items: center; gap: 12px; }
        .student-info label { font-weight: bold; color: #0369a1; }
        .student-info input { padding: 8px 12px; font-size: 1rem; border: 1px solid #7dd3fc; border-radius: 6px; width: 180px; outline: none; }
        .question-title { font-weight: 700; font-size: 1.05rem; margin: 24px 0 12px; color: #0f172a; }
        .text-input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; resize: vertical; outline: none; line-height: 1.5; }
        .submit-btn { width: 100%; padding: 16px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>창업가 정신 핵심 역량 진단</h1>

    <div class="student-info">
        <label for="student-id">학번</label>
        <input type="text" id="student-id" placeholder="예: 10101" autocomplete="off">
    </div>

    <div class="question-title">1. 나의 최고 역량군을 입력하세요.</div>
    <input type="text" id="top-group" class="text-input" placeholder="예: 문제해결 역량군" autocomplete="off">

    <div class="question-title">2. 나의 핵심 역량 3가지를 입력하세요 (쉼표로 구분).</div>
    <input type="text" id="top-abilities" class="text-input" placeholder="예: 창의적 사고, 도전 정신, 협동심" autocomplete="off">

    <div class="question-title">3. 나의 꿈과 이를 이루기 위한 노력을 작성하세요.</div>
    <textarea id="future-plan" class="text-input" rows="4" placeholder="자신의 꿈과 노력 과정을 작성해 주세요." autocomplete="off"></textarea>

    <button id="submit-btn" class="submit-btn" onclick="submitWorksheet2()">제출하기</button>
</div>

<script>
    const FIREBASE_URL = "https://activity3-bcbca-default-rtdb.firebaseio.com/yeep_activity_submissions.json";

    async function submitWorksheet2() {
        const btn = document.getElementById('submit-btn');

        const studentId = document.getElementById('student-id').value.trim();
        const topGroup = document.getElementById('top-group').value.trim();
        const topAbilitiesStr = document.getElementById('top-abilities').value.trim();
        const futurePlan = document.getElementById('future-plan').value.trim();

        if(!studentId) { alert('학번을 입력해주세요.'); return; }
        if(!topGroup || !topAbilitiesStr || !futurePlan) { alert(' 모든 항목을 작성해 주세요.'); return; }

        const topAbilities = topAbilitiesStr.split(',').map(item => item.trim()).filter(item => item.length > 0);

        btn.disabled = true;
        btn.innerText = '제출 중...';

        try {
            // 중복 제출 체크
            let isDuplicate = false;
            const checkRes = await fetch(FIREBASE_URL, { method: 'GET' });
            if (checkRes.ok) {
                const data = await checkRes.json();
                if (data) {
                    for (let key in data) {
                        const item = data[key];
                        if (item && (item.studentId === studentId || item.studentInfo === studentId)) {
                            isDuplicate = true;
                            break;
                        }
                    }
                }
            }

            if (isDuplicate) {
                btn.disabled = false;
                btn.innerText = '제출하기';
                alert('이미 제출된 학번입니다. 수정이 필요하면 선생님께 문의해 주세요.');
                return;
            }

            const payload = {
                studentId: studentId,
                topGroup: topGroup,
                topAbilities: topAbilities,
                futurePlan: futurePlan,
                submittedAt: new Date().toLocaleString('ko-KR')
            };

            const postRes = await fetch(FIREBASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (postRes.ok) {
                alert('성공적으로 제출되었습니다!');
                location.href = 'index.html';
            } else {
                throw new Error('전송 실패');
            }

        } catch (err) {
            btn.disabled = false;
            btn.innerText = '제출하기';
            alert('제출 처리 중 오류가 발생했습니다. 다시 시도해 주세요.');
        }
    }
</script>

</body>
</html>
