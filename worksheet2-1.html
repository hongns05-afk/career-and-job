<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워크시트 2-2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #f4f7fb; color: #1e293b; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1e3a8a; border-bottom: 2px solid #2563eb; padding-bottom: 10px; }
        
        /* 학번 입력 영역 */
        .student-info { margin-bottom: 24px; background: #e0f2fe; padding: 14px 18px; border-radius: 10px; display: flex; align-items: center; gap: 12px; }
        .student-info label { font-weight: bold; color: #0369a1; }
        .student-info input { padding: 8px 12px; font-size: 1rem; border: 1px solid #7dd3fc; border-radius: 6px; width: 180px; outline: none; }

        .question-title { font-weight: 700; font-size: 1.05rem; margin: 24px 0 12px; color: #0f172a; }

        /* 입력창 */
        .text-input { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; resize: vertical; outline: none; line-height: 1.5; }
        .text-input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        /* 제출 버튼 */
        .submit-btn { width: 100%; padding: 16px; background: #2563eb; color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .submit-btn:hover { background: #1d4ed8; }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>활동지 2-2</h1>

    <div class="student-info">
        <label for="student-id">학번</label>
        <input type="text" id="student-id" placeholder="예: 10101" autocomplete="off">
    </div>

    <div class="question-title">활동 내용을 입력하세요.</div>
    <textarea id="answer-content" class="text-input" rows="6" placeholder="내용을 적어주세요." autocomplete="off"></textarea>

    <button id="submit-btn" class="submit-btn" onclick="submitWorksheet()">제출하기</button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        databaseURL: "https://career-and-job-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function submitWorksheet() {
        const btn = document.getElementById('submit-btn');
        const studentId = document.getElementById('student-id').value.trim();
        const content = document.getElementById('answer-content').value.trim();

        if(!studentId) {
            alert('학번을 입력해주세요.');
            return;
        }

        if(!content) {
            alert('내용을 입력해주세요.');
            return;
        }

        btn.disabled = true;
        btn.innerText = '확인 중...';

        // 이미 제출된 학번이 있는지 검사
        db.ref('worksheet2_2_submissions')
          .orderByChild('studentId')
          .equalTo(studentId)
          .once('value')
          .then(snapshot => {
              if (snapshot.exists()) {
                  btn.disabled = false;
                  btn.innerText = '제출하기';
                  alert('이미 제출된 학번입니다. 수정이 필요하면 선생님께 문의해 주세요.');
              } else {
                  // 제출 기록이 없으면 저장 진행
                  btn.innerText = '제출 중...';
                  db.ref('worksheet2_2_submissions').push({
                      studentId: studentId,
                      content: content,
                      submittedAt: new Date().toLocaleString('ko-KR')
                  }).then(() => {
                      alert('성공적으로 제출되었습니다.');
                      location.href = 'index.html';
                  }).catch(err => {
                      btn.disabled = false;
                      btn.innerText = '제출하기';
                      alert('제출 실패: ' + err.message);
                  });
              }
          })
          .catch(err => {
              btn.disabled = false;
              btn.innerText = '제출하기';
              alert('조회 오류: ' + err.message);
          });
    }
</script>

</body>
</html>
