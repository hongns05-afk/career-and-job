<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2-2. SDGs 직업 카드 작성하기 (개인용)</title>
  
  <!-- PDF & 이미지 저장을 위한 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 15px; }
    
    .container { max-width: 850px; margin: 0 auto; background: #ffffff; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    
    /* 상단 헤더 */
    .card-header { border-bottom: 3px solid #0f172a; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    .header-text { flex: 1; min-width: 280px; }
    .card-title { font-size: 1.6rem; font-weight: 800; color: #0f172a; margin: 0 0 5px 0; display: flex; align-items: center; gap: 8px; }
    .card-subtitle { font-size: 0.9rem; color: #64748b; margin: 0; }

    /* 워크넷 미래직업 카드뉴스 외부 링크 버튼 */
    .btn-worknet { display: inline-flex; align-items: center; gap: 6px; background-color: #0284c7; color: white; text-decoration: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; font-size: 0.9rem; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2); }
    .btn-worknet:hover { background-color: #0369a1; transform: translateY(-1px); }

    /* 학번 입력란 */
    .student-info-box { background: #eff6ff; border-left: 4px solid #2563eb; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .student-info-box label { font-weight: bold; color: #1e40af; font-size: 0.95rem; white-space: nowrap; }
    .student-info-box input { flex: 1; max-width: 250px; padding: 10px 14px; border: 1px solid #93c5fd; border-radius: 8px; outline: none; font-weight: bold; font-size: 1rem; background: white; }
    .student-info-box input:focus { border-color: #2563eb; }

    /* 메인 카드 레이아웃 (좌우 2열) */
    .card-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 768px) { .card-grid { grid-template-columns: 260px 1fr; } }

    /* 왼쪽 영역: 목표 / 직업명 */
    .left-col { display: flex; flex-direction: column; gap: 15px; }
    .info-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 15px; }
    .info-label { font-size: 0.9rem; font-weight: bold; color: #334155; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .info-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; background: white; }
    .info-input:focus { border-color: #2563eb; }

    /* 오른쪽 영역: 세부 내용 */
    .right-col { display: flex; flex-direction: column; gap: 18px; }
    
    .section-block { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; }
    .block-header { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; font-weight: bold; color: white; font-size: 0.9rem; margin-bottom: 12px; }
    .bg-green { background-color: #16a34a; }
    .bg-blue { background-color: #0284c7; }
    .bg-amber { background-color: #d97706; }
    .bg-slate { background-color: #475569; }

    .block-question { font-size: 0.95rem; font-weight: bold; color: #0f172a; margin-bottom: 10px; }

    /* 주요 업무 4개 작성란 */
    .task-inputs { display: grid; grid-template-columns: 1fr; gap: 8px; }
    @media (min-width: 500px) { .task-inputs { grid-template-columns: 1fr 1fr; } }
    .task-item { display: flex; align-items: center; gap: 6px; }
    .task-item span { font-weight: bold; color: #64748b; }
    .task-item input { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; }

    textarea { width: 100%; height: 85px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; resize: none; font-family: inherit; }
    textarea:focus { border-color: #2563eb; }

    /* 체크박스 영역 */
    .competency-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; font-size: 0.9rem; font-weight: 500; }
    @media (min-width: 500px) { .competency-grid { grid-template-columns: repeat(3, 1fr); } }
    .check-item { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .check-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #d97706; cursor: pointer; }

    .etc-wrap { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .etc-wrap input { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }

    /* 한줄평 연출 */
    .one-line-box { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 1rem; font-weight: bold; color: #0f172a; }
    .one-line-box input { flex: 1; min-width: 180px; padding: 10px; border: 1.5px solid #0f172a; border-radius: 8px; font-size: 0.95rem; outline: none; text-align: center; font-weight: bold; }

    /* 하단 버튼 그룹 */
    .btn-group-bottom { display: flex; flex-direction: column; gap: 10px; margin-top: 25px; }
    @media (min-width: 600px) { .btn-group-bottom { flex-direction: row; } }

    .submit-btn { flex: 2; padding: 16px; background-color: #2563eb; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .submit-btn:hover { background-color: #1d4ed8; }
    .submit-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .save-btn { flex: 1; padding: 16px; background-color: #059669; color: white; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .save-btn:hover { background-color: #047857; }

    .save-btn-img { background-color: #4f46e5; }
    .save-btn-img:hover { background-color: #4338ca; }

    /* 프린트/저장 시 스타일 조정 */
    @media print {
      .btn-worknet, .btn-group-bottom { display: none !important; }
      body { background: white; padding: 0; }
      .container { border: none; box-shadow: none; width: 100%; max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="container" id="printableArea">
  <form id="sdgsForm">
    <!-- 상단 헤더 및 워크넷 카드뉴스 링크 버튼 -->
    <div class="card-header">
      <div class="header-text">
        <h1 class="card-title">🌐 SDGs 직업 카드</h1>
        <p class="card-subtitle">지속가능발전목표(SDGs) 문제 해결에 기여하는 나만의 미래 직업을 탐색해 봅시다.</p>
      </div>
      <a href="https://www.wagework.go.kr/pt/b/b/retrieveCardNewsList.do?topPageId=PT06000000&pageId=PT06030200" target="_blank" class="btn-worknet" title="새 창으로 워크넷 미래직업 카드뉴스 이동">
        🔍 워크넷 미래직업 카드뉴스 참고하기 ↗
      </a>
    </div>

    <!-- 학번 전용 입력란 -->
    <div class="student-info-box">
      <label for="studentId">👤 학번 입력:</label>
      <input type="text" id="studentId" placeholder="예: 10305 (5자리)" inputmode="numeric" required autocomplete="off">
      <span style="font-size:0.82rem; color:#475569;">※ 반/번호 수합을 위해 학번 5자리를 입력하세요.</span>
    </div>

    <div class="card-grid">
      <!-- 왼쪽 열: 목표 & 직업명 -->
      <div class="left-col">
        <div class="info-card">
          <div class="info-label">🌍 내가 선택한 SDGs 목표</div>
          <input type="text" id="sdgsGoal" class="info-input" placeholder="예: 13번 기후변화 대응" required autocomplete="off">
        </div>

        <div class="info-card">
          <div class="info-label">💼 탐색할 직업 이름</div>
          <input type="text" id="jobTitle" class="info-input" placeholder="예: 기후변화 데이터 분석가" required autocomplete="off">
        </div>
      </div>

      <!-- 오른쪽 열: 주요 업무 / 기여점 / 역량 / 한줄평 -->
      <div class="right-col">
        <!-- 1. 주요 업무 -->
        <div class="section-block">
          <div class="block-header bg-green">주요 업무</div>
          <div class="block-question">Q. 이 직업은 주로 어떤 일을 하나요?</div>
          <div class="task-inputs">
            <div class="task-item"><span>•</span> <input type="text" id="task1" placeholder="주요 업무 1" required></div>
            <div class="task-item"><span>•</span> <input type="text" id="task2" placeholder="주요 업무 2"></div>
            <div class="task-item"><span>•</span> <input type="text" id="task3" placeholder="주요 업무 3"></div>
            <div class="task-item"><span>•</span> <input type="text" id="task4" placeholder="주요 업무 4"></div>
          </div>
        </div>

        <!-- 2. SDGs 기여점 -->
        <div class="section-block">
          <div class="block-header bg-blue">SDGs 기여점</div>
          <div class="block-question">Q. 이 직업은 내가 선택한 SDGs 문제를 어떻게 해결해 주나요?</div>
          <textarea id="contribution" placeholder="지속가능발전목표 문제 해결에 기여하는 방식을 작성하세요." required></textarea>
        </div>

        <!-- 3. 필요 역량 -->
        <div class="section-block">
          <div class="block-header bg-amber">필요 역량</div>
          <div class="block-question">Q. 이 직업을 가지려면 어떤 능력이나 태도가 필요할까요?</div>
          <div class="competency-grid">
            <label class="check-item"><input type="checkbox" name="competency" value="창의·융합 사고력"> 창의·융합 사고력</label>
            <label class="check-item"><input type="checkbox" name="competency" value="의사소통·협력"> 의사소통·협력</label>
            <label class="check-item"><input type="checkbox" name="competency" value="비판적 사고력"> 비판적 사고력</label>
            <label class="check-item"><input type="checkbox" name="competency" value="디지털·IT 기술력"> 디지털·IT 기술력</label>
            <label class="check-item"><input type="checkbox" name="competency" value="복합 문제해결력"> 복합 문제해결력</label>
            <label class="check-item"><input type="checkbox" name="competency" value="도전정신·적응력"> 도전정신·적응력</label>
            <label class="check-item"><input type="checkbox" name="competency" value="세계시민의식·공감"> 세계시민의식·공감</label>
            <label class="check-item"><input type="checkbox" name="competency" value="리더십·기획력"> 리더십·기획력</label>
          </div>
          <div class="etc-wrap">
            <span>기타:</span>
            <input type="text"
