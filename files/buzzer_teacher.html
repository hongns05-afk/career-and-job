<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선생님용 선착순 정답 부저 대시보드</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f1f5f9; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #3b82f6; padding-bottom: 15px; margin-bottom: 20px; }
        h1 { font-size: 1.6rem; color: #0f172a; margin: 0; }
        
        .reset-btn { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .reset-btn:hover { background: #dc2626; }

        .list-container { margin-top: 20px; }
        .buzzer-item { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border: 2px solid #e2e8f0; padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; transition: all 0.3s; }
        
        /* 1등 강조 스타일 */
        .buzzer-item.first { background: #fef3c7; border-color: #f59e0b; transform: scale(1.02); }
        .rank { font-size: 1.3rem; font-weight: bold; color: #64748b; width: 60px; }
        .buzzer-item.first .rank { color: #d97706; font-size: 1.5rem; }
        
        .student-id { font-size: 1.2rem; font-weight: bold; color: #0f172a; flex: 1; }
        .time { font-size: 0.9rem; color: #94a3b8; }

        .empty-msg { text-align: center; padding: 50px 0; color: #94a3b8; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚨 선착순 정답 부저 (선생님용)</h1>
        <button id="resetBtn" class="reset-btn">🔄 다음 문제 (초기화)</button>
    </div>

    <div class="list-container" id="buzzerList">
        <div class="empty-msg">아직 부저를 누른 학생이 없습니다.</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
      authDomain: "activity3-bcbca.firebaseapp.com",
      databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
      projectId: "activity3-bcbca",
      storageBucket: "activity3-bcbca.firebasestorage.app",
      messagingSenderId: "698284558768",
      appId: "1:698284558768:web:8f8877735a2580af8a6e75"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const buzzerListEl = document.getElementById('buzzerList');
    const resetBtn = document.getElementById('resetBtn');

    // 실시간 부저 입력 감지
    const buzzerRef = ref(db, 'buzzer_queue');
    onValue(buzzerRef, (snapshot) => {
        const data = snapshot.val();
        buzzerListEl.innerHTML = '';

        if (!data) {
            buzzerListEl.innerHTML = '<div class="empty-msg">아직 부저를 누른 학생이 없습니다.</div>';
            return;
        }

        // 시간순 정렬
        const sortedList = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);

        sortedList.forEach((item, index) => {
            const isFirst = index === 0;
            const date = new Date(item.timestamp);
            const timeStr = `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}.${Math.floor(date.getMilliseconds()/100)}`;

            const div = document.createElement('div');
            div.className = `buzzer-item ${isFirst ? 'first' : ''}`;
            div.innerHTML = `
                <div class="rank">${isFirst ? '🥇 1등' : `${index + 1}등`}</div>
                <div class="student-id">${item.studentInfo}</div>
                <div class="time">${timeStr}</div>
            `;
            buzzerListEl.appendChild(div);
        });
    });

    // 다음 문제 준비 (부저 리셋)
    resetBtn.addEventListener('click', () => {
        if (confirm("부저 기록을 초기화하고 다음 문제를 진행하시겠습니까?")) {
            remove(ref(db, 'buzzer_queue')).then(() => {
                alert("초기화되었습니다.");
            }).catch((err) => {
                alert("초기화 실패: " + err.message);
            });
        }
    });
</script>

</body>
</html>
