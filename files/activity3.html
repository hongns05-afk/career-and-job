<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1단원. 진로 특성에 맞는 직업 찾기</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; padding: 20px; color: #1e293b; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 1.5rem; color: #1e3a8a; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #334155; }
        input[type="text"], textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        textarea { height: 120px; resize: vertical; }
        .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧩 [1단원] 진로 특성에 맞는 직업 찾기</h1>
    <form id="activityForm">
        <div class="form-group">
            <label for="studentInfo">🎓 학번 (예: 1학년 2반 5번 -> 10205)</label>
            <input type="text" id="studentInfo" placeholder="숫자 5자리 입력 (예: 10205)" required>
        </div>

        <div class="form-group">
            <label for="interestType">💡 나의 주요 흥미 / 적성 유형</label>
            <select id="interestType" required>
                <option value="">선택해 주세요</option>
                <option value="현장형(R)">현장형 (R) - 실천적, 기계/도구 활용</option>
                <option value="탐구형(I)">탐구형 (I) - 논리적, 분석 및 학구적</option>
                <option value="예술형(A)">예술형 (A) - 창의적, 독창적 표현</option>
                <option value="사회형(S)">사회형 (S) - 봉사, 타인 조력 및 교육</option>
                <option value="기업형(E)">기업형 (E) - 리더십, 설득 및 관리</option>
                <option value="관습형(C)">관습형 (C) - 체계적, 자료 및 데이터 정리</option>
            </select>
        </div>

        <div class="form-group">
            <label for="jobAnswer">🔍 탐색한 어울리는 직업과 선택 이유</label>
            <textarea id="jobAnswer" placeholder="자신의 흥미 유형과 잘 어울리는 직업을 찾아서 적고, 그렇게 생각한 이유를 구체적으로 작성해 보세요." required></textarea>
        </div>

        <button type="submit" class="btn-submit">제출하기</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
      authDomain: "activity3-bcbca.firebaseapp.com",
      databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
      projectId: "activity3-bcbca",
      storageBucket: "activity3-bcbca.firebasestorage.app",
      messagingSenderId: "698284558768",
      appId: "1:698284558768:web:8f8877735a2580af8a6e75"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('activityForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const studentNum = document.getElementById('studentInfo').value.trim();
        const resultVal = document.getElementById('interestType').value;
        const answerVal = document.getElementById('jobAnswer').value.trim();

        if(!studentNum || !resultVal || !answerVal) {
            alert(" 모든 항목을 입력해 주세요.");
            return;
        }

        const newRef = push(ref(db, 'yeep_activity_submissions'));
        set(newRef, {
            unit: '1단원',
            studentInfo: studentNum,
            result: resultVal,
            answer: answerVal,
            timestamp: Date.now()
        }).then(() => {
            alert(" 성공적으로 제출되었습니다!");
            document.getElementById('activityForm').reset();
        }).catch((err) => {
            alert("제출 실패: " + err.message);
        });
    });
</script>

</body>
</html>
