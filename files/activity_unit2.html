<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선생님용 통합 제출 현황판</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; padding: 20px; background: #f8fafc; color: #1e293b; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; margin: 0; }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-excel { background: #16a34a; color: white; }
        .btn-clear { background: #ef4444; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 0.95rem; }
        th { background: #f1f5f9; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; background: #e0f2fe; color: #0369a1; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📊 통합 제출 현황판</h1>
        <div>
            <button class="btn btn-excel" onclick="downloadCSV()">📥 Excel(CSV) 다운로드</button>
            <button class="btn btn-clear" onclick="clearData()">🗑️ 데이터 초기화</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>제출 단원</th>
                <th>학번</th>
                <th>성격 유형 / 결과</th>
                <th>주관식 작성 내용</th>
                <th>제출 시간</th>
            </tr>
        </thead>
        <tbody id="dataList"></tbody>
    </table>
</div>

<script>
    function loadData() {
        const data = JSON.parse(localStorage.getItem('career_submissions') || '[]');
        const tbody = document.getElementById('dataList');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 20px; color: #94a3b8;">제출된 데이터가 없습니다.</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="badge">${item.unit || '1단원'}</span></td>
                <td>${item.num}</td>
                <td>${item.result || '-'}</td>
                <td>${item.answer}</td>
                <td>${item.time}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function downloadCSV() {
        const data = JSON.parse(localStorage.getItem('career_submissions') || '[]');
        if (data.length === 0) return alert("다운로드할 데이터가 없습니다.");

        let csv = "\uFEFF단원,학번,결과/유형,주관식답변,제출시간\n";
        data.forEach(item => {
            const cleanAnswer = `"${(item.answer || '').replace(/"/g, '""')}"`;
            csv += `"${item.unit || '1단원'}","${item.num}","${item.result || '-'}",${cleanAnswer},"${item.time}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.append ? document.createElement('a') : document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `진로활동_제출현황_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }

    function clearData() {
        if (confirm("정말로 모든 제출 데이터를 삭제하시겠습니까?")) {
            localStorage.removeItem('career_submissions');
            loadData();
        }
    }

    loadData();
</script>

</body>
</html>
