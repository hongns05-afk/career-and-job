<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진로 활동지 - 1단원/2단원</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
    }
    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
      font-size: 24px;
      border-bottom: 2px solid #4A90E2;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    .submit-btn {
      width: 100%;
      background-color: #4A90E2;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background-color: #357ABD;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📋 진로 탐색 활동지 (1단원)</h1>
  
  <div class="form-group">
    <label for="studentNum">학번 및 이름</label>
    <input type="text" id="studentNum" placeholder="예: 10101 홍길동">
  </div>

  <div class="form-group">
    <label for="resultText">나의 진로 적성 / 탐색 결과</label>
    <input type="text" id="resultText" placeholder="예: 컴퓨터 공학 / 기계 공학">
  </div>

  <div class="form-group">
    <label for="answerText">활동 소감 및 주관식 답변</label>
    <textarea id="answerText" placeholder="활동을 하며 느끼고 배운 점을 자유롭게 적어주세요."></textarea>
  </div>

  <button class="submit-btn" id="submitBtn">선생님께 제출하기</button>
</div>

<!-- Firebase SDK 및 연동 로직 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // activity3의 Firebase 설정 사용
  const firebaseConfig = {
    apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
    authDomain: "activity3-bcbca.firebaseapp.com",
    databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
    projectId: "activity3-bcbca",
    storageBucket: "activity3-bcbca.firebasestorage.app",
    messagingSenderId: "698284558768",
    appId: "1:698284558768:web:8f8877735a2580af8a6e75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 제출 버튼 클릭 이벤트 연결
  document.getElementById('submitBtn').addEventListener('click', function() {
    const studentNum = document.getElementById('studentNum').value.trim();
    const resultText = document.getElementById('resultText').value.trim();
    const answerText = document.getElementById('answerText').value.trim();

    if (!studentNum) {
      alert("학번과 이름을 입력해 주세요.");
      return;
    }

    const submissionData = {
      num: studentNum,
      result: resultText || "제출 완료",
      answer: answerText || "",
      unit: "1단원", // 대시보드에서 1단원으로 필터링됨
      time: new Date().toLocaleString('ko-KR')
    };

    // Firebase에 저장
    push(ref(db, 'career_submissions'), submissionData)
      .then(() => {
        alert("1단원 활동지가 성공적으로 제출되었습니다!");
        // 제출 후 입력창 초기화
        document.getElementById('studentNum').value = '';
        document.getElementById('resultText').value = '';
        document.getElementById('answerText').value = '';
      })
      .catch((error) => {
        alert("제출 중 오류가 발생했습니다: " + error.message);
      });
  });
</script>

</body>
</html>
