<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3단원. 창업가정신 성향 진단검사 및 실행계획</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f8fafc; color: #1e293b; margin: 0; padding: 15px 10px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px 15px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { font-size: 1.3rem; color: #0f172a; border-bottom: 3px solid #3b82f6; padding-bottom: 10px; margin-top: 0; }

        .student-info { display: flex; gap: 10px; margin-bottom: 20px; background: #f1f5f9; padding: 12px; border-radius: 10px; }
        .student-info input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; width: 100%; outline: none; }

        .section-title { font-size: 1.05rem; font-weight: bold; margin: 25px 0 10px 0; color: #1d4ed8; }
        .guide-text { font-size: 0.88rem; color: #64748b; margin-bottom: 15px; line-height: 1.4; }

        /* 진단 문항 스타일 */
        .q-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
        .q-title { font-size: 0.95rem; font-weight: 500; margin-bottom: 10px; color: #334155; }
        .q-options { display: flex; justify-content: space-between; gap: 5px; }
        .q-options label { flex: 1; text-align: center; padding: 8px 0; background: white; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }
        .q-options input[type="radio"] { display: none; }
        .q-options input[type="radio"]:checked + span { color: #2563eb; font-weight: bold; }
        .q-options label.selected { background: #eff6ff; border-color: #2563eb; color: #2563eb; font-weight: bold; }

        /* 결과 요약 박스 */
        .result-box { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 12px; padding: 15px; margin: 20px 0; display: none; }
        .result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; text-align: center; }
        .result-item { background: white; padding: 10px; border-radius: 8px; border: 1px solid #e0f2fe; }
        .result-item .score { font-size: 1.2rem; font-weight: bold; color: #0284c7; }

        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; resize: vertical; outline: none; }

        .submit-btn { width: 100%; padding: 14px; background: #cbd5e1; color: white; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: not-allowed; transition: all 0.3s; margin-top: 15px; }
        .submit-btn.active { background: #2563eb; cursor: pointer; }
        .submit-btn.active:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="container">
    <h1>3단원. 창업가정신 성향 진단검사 및 실행계획</h1>

    <!-- 학번/이름 입력 -->
    <div class="student-info">
        <input type="text" id="studentNum" placeholder="학번 및 이름 입력 (예: 10101 홍길동)">
    </div>

    <!-- 1. 진단문항 -->
    <div class="section-title">1. 창업가정신 성향 진단검사 (Self-Assessment)</div>
    <div class="guide-text">각 문항을 읽고 자신과 가장 가까운 점수를 선택해 주세요. (1점: 전혀 아니다 ~ 5점: 매우 그렇다)</div>

    <div id="quizContainer"></div>

    <!-- 검사 결과 디스플레이 -->
    <div class="result-box" id="resultBox">
        <div style="font-weight: bold; color: #0369a1;">📊 나의 창업가정신 성향 분석 결과</div>
        <div class="result-grid">
            <div class="result-item">행동형 <div class="score" id="score-action">0점</div></div>
            <div class="result-item">규범형 <div class="score" id="score-rules">0점</div></div>
            <div class="result-item">탐구형 <div class="score" id="score-explore">0점</div></div>
            <div class="result-item">이상형 <div class="score" id="score-ideal">0점</div></div>
        </div>
    </div>

    <!-- 2. 실행계획 작성 -->
    <div class="section-title">2. 진단 결과를 바탕으로 한 나만의 실행 계획</div>
    <textarea id="actionPlan" placeholder="자신의 강점 성향을 활용하거나 부족한 성향을 보완하기 위한 구체적인 실행 계획을 작성하세요."></textarea>

    <!-- 제출 버튼 -->
    <button id="submitBtn" class="submit-btn" disabled>모든 검사 문항과 실행 계획을 작성해야 제출할 수 있습니다</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
      authDomain: "activity3-bcbca.firebaseapp.com",
      databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
      projectId: "activity3-bcbca",
      storageBucket: "activity3-bcbca.firebasestorage.app",
      messagingSenderId: "698284558768",
      appId: "1:698284558768:web:8f8877735a2580af8a6e75"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 핵심 대표 검사 문항 구성 (행동/규범/탐구/이상)
    const questions = [
        { id: 'q1', type: 'action', text: '나는 새로운 아이디어가 생기면 즉시 실행에 옮기는 편이다.' },
        { id: 'q2', type: 'action', text: '어려운 상황이 닥쳐도 두려워하지 않고 도전한다.' },
        { id: 'q3', type: 'rules', text: '정해진 규칙과 원칙을 준수하며 체계적으로 일을 처리한다.' },
        { id: 'q4', type: 'rules', text: '약속 시간과 계획을 철저하게 지키는 편이다.' },
        { id: 'q5', type: 'explore', text: '문제가 생겼을 때 원인을 깊이 있게 분석하고 탐구하는 것을 좋아한다.' },
        { id: 'q6', type: 'explore', text: '새로운 지식이나 기술을 배우는 데 높은 흥미를 느낀다.' },
        { id: 'q7', type: 'ideal', text: '세상을 더 좋게 바꾸거나 타인에게 도움이 되는 목표를 정한다.' },
        { id: 'q8', type: 'ideal', text: '창의적이고 원대한 꿈을 그리는 것에 가치를 둔다.' }
    ];

    const quizContainer = document.getElementById('quizContainer');

    // 문항 동적 생성
    questions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML = `
            <div class="q-title">${idx + 1}. ${q.text}</div>
            <div class="q-options" data-q="${q.id}">
                ${[1, 2, 3, 4, 5].map(v => `
                    <label>
                        <input type="radio" name="${q.id}" value="${v}">
                        <span>${v}점</span>
                    </label>
                `).join('')}
            </div>
        `;
        quizContainer.appendChild(card);
    });

    // 라디오 버튼 선택 스타일 및 점수 계산 처리
    quizContainer.addEventListener('change', (e) => {
        if (e.target.type === 'radio') {
            const labels = e.target.closest('.q-options').querySelectorAll('label');
            labels.forEach(l => l.classList.remove('selected'));
            e.target.parentElement.classList.add('selected');
            calculateScores();
            checkForm();
        }
    });

    let scores = { action: 0, rules: 0, explore: 0, ideal: 0 };

    function calculateScores() {
        scores = { action: 0, rules: 0, explore: 0, ideal: 0 };
        questions.forEach(q => {
            const selected = document.querySelector(`input[name="${q.id}"]:checked`);
            if (selected) {
                scores[q.type] += parseInt(selected.value);
            }
        });

        document.getElementById('score-action').innerText = scores.action + '점';
        document.getElementById('score-rules').innerText = scores.rules + '점';
        document.getElementById('score-explore').innerText = scores.explore + '점';
        document.getElementById('score-ideal').innerText = scores.ideal + '점';

        const resultBox = document.getElementById('resultBox');
        if (isAllAnswered()) {
            resultBox.style.display = 'block';
        }
    }

    function isAllAnswered() {
        return questions.every(q => document.querySelector(`input[name="${q.id}"]:checked`));
    }

    const studentNumInput = document.getElementById('studentNum');
    const actionPlanInput = document.getElementById('actionPlan');
    const submitBtn = document.getElementById('submitBtn');

    function checkForm() {
        const num = studentNumInput.value.trim();
        const plan = actionPlanInput.value.trim();

        if (num && plan && isAllAnswered()) {
            submitBtn.disabled = false;
            submitBtn.className = 'submit-btn active';
            submitBtn.innerText = '활동지 제출하기';
        } else {
            submitBtn.disabled = true;
            submitBtn.className = 'submit-btn';
            submitBtn.innerText = '모든 검사 문항과 실행 계획을 작성해야 제출할 수 있습니다';
        }
    }

    studentNumInput.addEventListener('input', checkForm);
    actionPlanInput.addEventListener('input', checkForm);

    // 제출 이벤트
    submitBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (this.disabled) return;

        this.disabled = true;
        this.innerText = "제출 중입니다...";

        const num = studentNumInput.value.trim();
        const plan = actionPlanPlan = actionPlanInput.value.trim();

        // 가장 높은 점수의 유형 추출
        const scoreArr = [
            { type: '행동형', val: scores.action },
            { type: '규범형', val: scores.rules },
            { type: '탐구형', val: scores.explore },
            { type: '이상형', val: scores.ideal }
        ];
        scoreArr.sort((a, b) => b.val - a.val);

        const resultSummary = `${scoreArr[0].type} 중심 (행동:${scores.action}, 규범:${scores.rules}, 탐구:${scores.explore}, 이상:${scores.ideal})`;

        const newRef = push(ref(db, 'yeep_activity_submissions'));
        set(newRef, {
            unit: '3단원',
            studentInfo: num,
            result: resultSummary,
            answer: plan,
            timestamp: Date.now()
        }).then(() => {
            alert("제출이 성공적으로 완료되었습니다!");
            window.location.href = "../index.html";
        }).catch((err) => {
            alert("제출 실패: " + err.message);
            this.disabled = false;
            checkForm();
        });
    });
</script>

</body>
</html>
