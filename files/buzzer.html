<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선착순 정답 부저</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      text-align: center;
      background-color: #f0f3f8;
      color: #333;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.1s ease;
    }
    body.flash-active { background-color: #ffeaa7 !important; }
    .container {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; font-size: 24px; color: #d63031; }
    input[type="text"] {
      width: 90%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #dfe6e9;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: center;
      background-color: #f8f9fa;
      outline: none;
    }
    input[type="text"]:focus { border-color: #d63031; background-color: #fff; }
    .buzzer-wrapper { position: relative; display: inline-block; margin: 10px 0 20px; }
    
    /* 부저 버튼 애니메이션 및 크기 */
    .buzzer-btn-img {
      width: 200px;
      height: 200px;
      border: none;
      background: transparent;
      cursor: pointer;
      outline: none;
      padding: 0;
    }
    .buzzer-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.1s ease;
      user-select: none;
    }
    .buzzer-btn-img:active .buzzer-img, .buzzer-img.pressed {
      transform: translateY(8px) scale(0.95);
    }
    .buzzer-wrapper.glow::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 220px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255,234,167,0.9) 0%, rgba(214,48,49,0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseGlow 0.5s ease-out forwards;
    }
    @keyframes pulseGlow {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    #status { margin-top: 15px; font-size: 18px; font-weight: bold; min-height: 28px; color: #636e72; }
    .success-msg { color: #00b894 !important; }
  </style>
</head>
<body>

<div class="container">
  <h2>🚨 선착순 정답 부저</h2>
  <input type="text" id="studentInfo" placeholder="학번과 이름을 입력하세요">
  
  <div class="buzzer-wrapper" id="buzzerWrapper">
    <button class="buzzer-btn-img" onclick="pressBuzzer()">
      <img src="https://api.iconify.design/emojione-v1:red-button.svg" 
           alt="부저 버튼" 
           class="buzzer-img" 
           id="buzzerImg">
    </button>
  </div>

  <div id="status">이름을 입력하고 부저를 누르세요!</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
    authDomain: "activity3-bcbca.firebaseapp.com",
    databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
    projectId: "activity3-bcbca",
    storageBucket: "activity3-bcbca.firebasestorage.app",
    messagingSenderId: "698284558768",
    appId: "1:698284558768:web:8f8877735a2580af8a6e75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let isSubmitting = false;

  window.pressBuzzer = function() {
    if (isSubmitting) return;

    const info = document.getElementById('studentInfo').value.trim();
    if (!info) {
      alert("학번을 먼저 입력해주세요!");
      return;
    }

    isSubmitting = true;

    document.body.classList.add('flash-active');
    const wrapper = document.getElementById('buzzerWrapper');
    const img = document.getElementById('buzzerImg');
    
    img.classList.add('pressed');
    wrapper.classList.add('glow');

    setTimeout(() => { document.body.classList.remove('flash-active'); }, 200);

    push(ref(db, 'buzzer_submissions'), {
      name: info,
      timestamp: serverTimestamp()
    }).then(() => {
      const statusEl = document.getElementById('status');
      statusEl.innerText = "🔔 성공적으로 부저를 눌렀습니다!";
      statusEl.className = "success-msg";
    }).catch((err) => {
      alert("전송 중 오류 발생: " + err.message);
      isSubmitting = false;
      img.classList.remove('pressed');
    });
  };
</script>

</body>
</html>
