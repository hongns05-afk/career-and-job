<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 제출 현황판</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; background: #fdf2f4; color: #1e293b; margin: 0; padding: 15px; }

    .auth-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 999999 !important; padding: 20px; }
    .auth-card { background: #ffffff; padding: 30px 20px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); width: 100%; max-width: 360px; text-align: center; }
    .auth-card h2 { margin: 0 0 10px 0; font-size: 1.3rem; color: #0f172a; }
    .auth-card p { font-size: 0.88rem; color: #64748b; margin-bottom: 20px; word-break: keep-all; }
    .auth-card input { width: 100%; padding: 14px; border: 2px solid #cbd5e1; border-radius: 12px; font-size: 1.05rem; text-align: center; margin-bottom: 12px; outline: none; -webkit-appearance: none; }
    .auth-card input:focus { border-color: #2563eb; }
    .auth-card button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .auth-card button:active { background: #1d4ed8; }
    .auth-card button:disabled { background: #94a3b8; cursor: not-allowed; }
    .auth-error { color: #ef4444; font-size: 0.85rem; margin-top: 12px; display: none; font-weight: bold; word-break: keep-all; }

    .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .header h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 8px; color: #0f172a; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; transition: 0.2s; }
    .btn-presentation { background: #a855f7; color: white; }
    .btn-excel { background: #10b981; color: white; }
    .btn-logout { background: #64748b; color: white; }

    .filter-bar { background: #f1f5f9; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .filter-group { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 0.9rem; width: 100%; justify-content: space-between; }
    @media (min-width: 640px) { .filter-group { width: auto; justify-content: start; } }
    select { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; outline: none; background: white; }

    .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .student-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 25px; }
    @media (min-width: 640px) { .student-grid { grid-template-columns: repeat(10, 1fr); } }
    .student-card { background: #f8fafc; border: 1px solid #f1f5f9; border-radius: 8px; padding: 10px 2px; text-align: center; }
    .student-card .num { font-weight: bold; font-size: 0.85rem; color: #334155; }
    .student-card .status { font-size: 0.7rem; color: #94a3b8; margin-top: 2px; }
    .student-card.submitted { background: #eff6ff; border-color: #bfdbfe; }
    .student-card.submitted .num { color: #1d4ed8; }
    .student-card.submitted .status { color: #2563eb; font-weight: bold; }

    .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 640px; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px 12px; text-align: left; font-size: 0.85rem; }
    th { background: #f8fafc; color: #475569; font-weight: bold; }
    .text-center { text-align: center; }
    .student-clickable { color: #2563eb; font-weight: bold; cursor: pointer; text-decoration: underline; }
    .student-clickable:hover { color: #1d4ed8; }
    .view-item-btn { background: #e0f2fe; color: #0284c7; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; }
    .del-item-btn { background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-left: 4px; }
    .rej-item-btn { background: #ffedd5; color: #c2410c; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; margin-left: 4px; }
    .badge-rejected { display: inline-block; background: #fed7aa; color: #9a3412; font-size: 0.72rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
    tr.row-rejected { background: #fff7ed; }
    .sub-text { font-size: 0.78rem; color: #64748b; margin-top: 2px; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
    .modal-card { background: white; width: 100%; max-width: 550px; border-radius: 16px; padding: 20px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 15px; }
    .modal-title { font-weight: bold; font-size: 1.1rem; color: #0f172a; }
    .modal-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #64748b; }
    .answer-block { background: #f8fafc; border-left: 4px solid #2563eb; padding: 12px; border-radius: 6px; margin-bottom: 12px; }
    .answer-label { font-size: 0.8rem; font-weight: bold; color: #64748b; margin-bottom: 4px; }
    .answer-content { font-size: 0.95rem; color: #0f172a; white-space: pre-wrap; line-height: 1.5; }

    .presentation-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; color: white; z-index: 900000; padding: 30px; flex-direction: column; justify-content: space-between; }
    .present-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
    .present-student-title { font-size: 2.2rem; font-weight: bold; color: #60a5fa; }
    .present-body { flex: 1; background: #1e293b; margin: 25px 0; border-radius: 16px; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
    /* 2단원-3 직업 카드 (그림) */
    .thumb { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; background: #f8fafc; display: block; margin-bottom: 4px; cursor: pointer; }
    .modal-drawing { width: 100%; border-radius: 10px; border: 1px solid #e2e8f0; background: #f8fafc; aspect-ratio: 4 / 3; object-fit: contain; margin-bottom: 12px; }
    .pc-card { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; width: 100%; }
    @media (min-width: 900px) { .pc-card { grid-template-columns: 1.15fr 1fr; } }
    .pc-img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #ffffff; border-radius: 14px; }
    .pc-title { font-size: calc(var(--ps) * 2.6rem); font-weight: bold; color: #fbbf24; line-height: 1.3; margin-bottom: 14px; word-break: keep-all; }
    .pc-row { background: #0f172a; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
    .pc-label { font-size: calc(var(--ps) * 1rem); color: #93c5fd; font-weight: bold; margin-bottom: 4px; }
    .pc-val { font-size: calc(var(--ps) * 1.45rem); line-height: 1.5; color: #f8fafc; white-space: pre-wrap; word-break: keep-all; }
    /* ---------- 직업 카드 A4 인쇄 (2단원-3) ---------- */
    .btn-print { background: #0f766e; color: white; }
    .pick-label { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 0.75rem; color: #0f766e; font-weight: bold; cursor: pointer; }
    .pick-label input { width: 16px; height: 16px; }
    tr.row-picked { background: #f0fdfa; }
    #printArea { display: none; }
    .pcard { width: 297mm; height: 210mm; padding: 10mm; box-sizing: border-box; background: #ffffff; overflow: hidden;
      break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact;
      font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #0f172a; }
    .pcard:last-child { break-after: auto; page-break-after: auto; }
    .pc-frame { height: 100%; border: 1.2mm solid #7c3aed; border-radius: 6mm; padding: 7mm 8mm 5mm; display: flex; flex-direction: column; gap: 5mm; box-sizing: border-box; }
    .pc-head { display: flex; align-items: baseline; gap: 4mm; flex-wrap: wrap; border-bottom: 0.6mm solid #ddd6fe; padding-bottom: 3mm; }
    .pc-kicker { font-size: 10pt; font-weight: 800; color: #7c3aed; letter-spacing: 0.08em; }
    .pc-job { font-size: 26pt; font-weight: 800; line-height: 1.2; word-break: keep-all; margin: 0; }
    .pc-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 45% 1fr; gap: 7mm; }
    .pc-pic { min-height: 0; display: flex; align-items: center; justify-content: center; border: 0.4mm solid #e2e8f0; border-radius: 4mm; overflow: hidden; background: #ffffff; }
    .pc-pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pc-pic .pc-nopic { color: #94a3b8; font-size: 12pt; }
    .pc-info { min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 0.8em; font-size: 13pt; }
    .pc-item { display: flex; flex-direction: column; gap: 0.25em; }
    .pc-chip { align-self: flex-start; color: #ffffff; font-weight: 800; font-size: 0.78em; padding: 0.15em 0.6em; border-radius: 0.4em; }
    .pc-text { line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; white-space: pre-wrap; }
    .c-rose { background: #e11d48; } .c-green { background: #16a34a; } .c-blue { background: #0284c7; } .c-amber { background: #d97706; } .c-slate { background: #475569; }
    .pc-foot { display: flex; justify-content: space-between; font-size: 9pt; color: #64748b; }
    /* 한 장 카드: 위에 큰 직업 이름, 아래 왼쪽 그림 · 오른쪽 설명 */
    .pc-top { display: flex; flex-direction: column; align-items: center; gap: 1mm; border-bottom: 0.6mm solid #ddd6fe; padding-bottom: 3mm; }
    .pc-bigname { height: 30mm; width: 100%; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden;
      font-size: 46pt; font-weight: 900; line-height: 1.12; color: #4c1d95; word-break: keep-all; letter-spacing: -0.01em; }
    .pc-bigname span { display: block; }
    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body { background: #ffffff !important; margin: 0 !important; padding: 0 !important; }
      body > *:not(#printArea) { display: none !important; }
      #printArea { display: block !important; }
    }
    .present-nav { display: flex; justify-content: center; align-items: center; gap: 20px; }
    .present-nav-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
    .present-nav-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2>🔒 교사용 현황판 로그인</h2>
    <p>선생님 계정(이메일, 비밀번호)으로 로그인해 주세요.</p>
    <input type="email" id="loginEmail" placeholder="이메일" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="비밀번호" autocomplete="current-password">
    <button id="authBtn">로그인</button>
    <div class="auth-error" id="authError">⚠️ 로그인에 실패했습니다.</div>
  </div>
</div>

<div class="container" id="mainContainer">
  <div class="header">
    <h1>📊 실시간 제출 현황판</h1>
    <div class="header-btns">
      <button class="btn btn-presentation" id="btnPresentation">🔮 발표</button>
      <button class="btn btn-excel" id="btnExcel">🧪 엑셀</button>
      <button class="btn btn-print" id="btnPrint" style="display:none;">🖨️ 카드 인쇄</button>
      <button class="btn btn-logout" id="btnLogout">🔒 로그아웃</button>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <span>📘 활동지:</span>
      <select id="activitySelect">
        <option value="1단원">1단원 (진로 특성 직업)</option>
        <option value="2단원">2단원 (창업가 정신)</option>
        <option value="2단원-2">2단원-2 (SDGs 직업 카드)</option>
        <option value="2단원-3" selected>2단원-3 (필요한 직업 카드)</option>
        <option value="3단원">3단원 (학습 성격 유형)</option>
      </select>
    </div>
    <div class="filter-group">
      <span>🏫 학급:</span>
      <select id="classSelect">
        <option value="all">전체 보기 (모든 학생)</option>
        <option value="1">1반</option>
        <option value="2">2반</option>
        <option value="3">3반</option>
        <option value="4">4반</option>
        <option value="5">5반</option>
        <option value="6">6반</option>
        <option value="7">7반</option>
        <option value="8">8반</option>
        <option value="9">9반</option>
        <option value="10">10반</option>
      </select>
    </div>
    <div class="filter-group">
      <label style="cursor:pointer; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="showRejected"> 반려된 제출도 보기</label>
    </div>
    <div class="filter-group" id="printOptions" style="display:none;">
      <span>🖨️ 인쇄:</span>
      <label style="cursor:pointer; display:flex; align-items:center; gap:6px;"><input type="checkbox" id="printShowId" checked> 학번 넣기</label>
    </div>
  </div>

  <div class="section-title">
    <span>📌 제출 현황 <span style="font-size:0.8rem; color:#64748b;">(전체 보기일 때는 그리드가 비활성화됩니다)</span></span>
    <span style="color: #2563eb;" id="submissionCounter">제출 건수: 0건</span>
  </div>
  <div class="student-grid" id="studentGrid"></div>

  <div class="section-title" id="tableTitle">📝 답변 내역</div>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 12%;">입력된 학번</th>
          <th style="width: 24%;" id="thHeaderType">대표 선택/유형</th>
          <th id="thHeaderContent">작성 내용</th>
          <th style="width: 16%;">제출 시간</th>
          <th style="width: 14%; text-align: center;">상세 / 삭제</th>
        </tr>
      </thead>
      <tbody id="submissionTable">
        <tr><td colspan="5" class="text-center">데이터를 불러오는 중입니다... ⏳</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="detailModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title" id="modalStudentTitle">👤 학생 상세 답변</div>
      <button class="modal-close" id="btnModalClose">✕</button>
    </div>
    <div id="modalAnswersBody"></div>
  </div>
</div>

<div class="presentation-overlay" id="presentationOverlay">
  <div class="present-header">
    <div class="present-student-title" id="presentStudentTitle">👤 학번: -</div>
    <button class="btn btn-logout" id="btnClosePresent">✕ 발표 종료 (ESC)</button>
  </div>
  <div class="present-body" id="presentContent"></div>
  <div class="present-nav">
    <button class="present-nav-btn" id="btnPrevPresent">◀ 이전</button>
    <span id="presentIndexText" style="font-size: 1.1rem; font-weight: bold;">0 / 0</span>
    <button class="present-nav-btn" id="btnNextPresent">다음 ▶</button>
    <button class="present-nav-btn" id="btnFontDown" style="background:#475569;">글씨 −</button>
    <button class="present-nav-btn" id="btnFontUp" style="background:#475569;">글씨 +</button>
    <button class="present-nav-btn" id="btnPrintOne" style="background:#0f766e; display:none;">🖨️ 이 카드 인쇄</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB52DHJG7_ZDvUaZLzTc4raXE5ClU8ut9c",
    authDomain: "activity3-bcbca.firebaseapp.com",
    databaseURL: "https://activity3-bcbca-default-rtdb.firebaseio.com",
    projectId: "activity3-bcbca",
    storageBucket: "activity3-bcbca.firebasestorage.app",
    messagingSenderId: "698284558768",
    appId: "1:698284558768:web:8f8877735a2580af8a6e75"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let rawData = {};
  let filteredItems = [];
  let currentPresentIndex = 0;
  let unsubscribe = null;

  // 학생이 입력한 글이 화면에서 코드로 실행되지 않도록 바꿔 주는 함수
  function esc(v) {
    if (v === undefined || v === null) return '';
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ---------- 2단원-3 그림 불러오기 (그림은 따로 저장되어 있어서 필요할 때만 가져옵니다) ----------
  const DRAW_PATH = 'worksheet2_3_drawings';
  const drawingCache = {};
  function loadDrawing(key) {
    if (!drawingCache[key]) {
      drawingCache[key] = get(ref(db, DRAW_PATH + '/' + key)).then(snap => {
        const v = snap.val();
        const src = v && typeof v.image === 'string' ? v.image : '';
        return src.startsWith('data:image/') ? src : '';
      }).catch(() => { delete drawingCache[key]; return ''; });
    }
    return drawingCache[key];
  }
  function fillDrawings(root) {
    root.querySelectorAll('img[data-draw-key]').forEach(img => {
      loadDrawing(img.dataset.drawKey).then(src => {
        if (src) img.src = src;
        else img.alt = '그림 없음';
      });
    });
  }

  // ---------- 로그인 / 로그아웃 ----------
  const authOverlay = document.getElementById('authOverlay');
  const mainContainer = document.getElementById('mainContainer');
  const authBtn = document.getElementById('authBtn');
  const authError = document.getElementById('authError');
  const emailInput = document.getElementById('loginEmail');
  const passInput = document.getElementById('loginPassword');

  async function doLogin() {
    const email = emailInput.value.trim();
    const pass = passInput.value;
    if (!email || !pass) {
      authError.innerText = '⚠️ 이메일과 비밀번호를 모두 입력해 주세요.';
      authError.style.display = 'block';
      return;
    }
    authBtn.disabled = true;
    authBtn.innerText = '로그인 중...';
    try {
      await signInWithEmailAndPassword(auth, email, pass);
      authError.style.display = 'none';
      passInput.value = '';
    } catch (err) {
      authError.innerText = '⚠️ 이메일 또는 비밀번호가 맞지 않습니다.';
      authError.style.display = 'block';
      passInput.value = '';
    } finally {
      authBtn.disabled = false;
      authBtn.innerText = '로그인';
    }
  }

  authBtn.addEventListener('click', doLogin);
  passInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doLogin(); });
  emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') passInput.focus(); });
  document.getElementById('btnLogout').addEventListener('click', () => { signOut(auth); });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      authOverlay.style.display = 'none';
      mainContainer.style.display = 'block';
      attachRealtimeListener();
    } else {
      if (unsubscribe) { unsubscribe(); unsubscribe = null; }
      rawData = {};
      mainContainer.style.display = 'none';
      authOverlay.style.display = 'flex';
    }
  });

  // ---------- 화면 그리기 ----------
  let seatIndex = {};   // 번호 -> filteredItems 안의 위치 (칸을 눌렀을 때 크게 보여 주기용)
  function renderGrid() {
    const grid = document.getElementById('studentGrid');
    grid.innerHTML = '';
    for (let i = 1; i <= 40; i++) {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.id = `card-num-${i}`;
      card.innerHTML = `<div class="num">${i}번</div><div class="status" id="status-num-${i}">미제출</div>`;
      card.addEventListener('click', () => {
        const idx = seatIndex[i];
        if (idx === undefined) return;
        currentPresentIndex = idx;
        renderPresentSlide();
        document.getElementById('presentationOverlay').style.display = 'flex';
      });
      grid.appendChild(card);
    }
  }

  function parseStudentInfo(infoStr) {
    if (!infoStr) return { classNum: '', seatNum: 0 };
    const cleanStr = String(infoStr).replace(/[^0-9]/g, '');
    if (cleanStr.length === 5) return { classNum: parseInt(cleanStr.substring(1, 3), 10).toString(), seatNum: parseInt(cleanStr.substring(3), 10) };
    if (cleanStr.length === 4) return { classNum: cleanStr.substring(1, 2), seatNum: parseInt(cleanStr.substring(2), 10) };
    return { classNum: '', seatNum: 0 };
  }

  function getPathByUnit(unit) {
    if (unit === '1단원') return 'worksheet1_submissions';
    if (unit === '2단원') return 'yeep_activity_submissions';
    if (unit === '2단원-2') return 'worksheet2_2_submissions';
    if (unit === '2단원-3') return 'worksheet2_3_submissions';
    return 'learning_activity_submissions';
  }

  function updateDashboard() {
    renderGrid();
    updatePrintControls();
    const selectedUnit = document.getElementById('activitySelect').value;
    const selectedClass = document.getElementById('classSelect').value;
    const showRejected = document.getElementById('showRejected').checked;

    if (selectedUnit === '1단원') {
      document.getElementById('tableTitle').innerText = '📝 [1단원] 진로 특성에 맞는 직업 찾기';
      document.getElementById('thHeaderType').innerText = '관심 직업';
      document.getElementById('thHeaderContent').innerText = '진로 특성 및 작성 내용';
    } else if (selectedUnit === '2단원') {
      document.getElementById('tableTitle').innerText = '📝 [2단원] 창업가 정신 핵심 역량 진단';
      document.getElementById('thHeaderType').innerText = '상위 역량군 / 역량';
      document.getElementById('thHeaderContent').innerText = '추천 창업가 & 꿈을 이루기 위한 노력';
    } else if (selectedUnit === '2단원-2') {
      document.getElementById('tableTitle').innerText = '📝 [2단원-2] SDGs 직업 카드';
      document.getElementById('thHeaderType').innerText = 'SDGs 목표 / 직업명';
      document.getElementById('thHeaderContent').innerText = '기여점 및 한줄평';
    } else if (selectedUnit === '2단원-3') {
      document.getElementById('tableTitle').innerText = '📝 [2단원-3] 나와 주변인에게 필요한 직업 카드';
      document.getElementById('thHeaderType').innerText = '그림 / 직업명';
      document.getElementById('thHeaderContent').innerText = '하는 일 및 만든 이유';
    } else {
      document.getElementById('tableTitle').innerText = '📝 [3단원] 나의 학습 성격 유형 진단';
      document.getElementById('thHeaderType').innerText = '학습 유형 / 강점';
      document.getElementById('thHeaderContent').innerText = '개선점 및 계획';
    }

    const tableBody = document.getElementById('submissionTable');
    tableBody.innerHTML = '';
    filteredItems = [];

    if (!rawData || Object.keys(rawData).length === 0) {
      document.getElementById('submissionCounter').innerText = '제출 건수: 0건';
      tableBody.innerHTML = '<tr><td colspan="5" class="text-center">제출된 데이터가 없습니다.</td></tr>';
      return;
    }

    let submittedCount = 0;
    Object.entries(rawData).forEach(([key, item]) => {
      const studentStr = item.studentId || item.studentInfo || '미상';
      const { classNum, seatNum } = parseStudentInfo(studentStr);

      if (selectedClass === 'all' || classNum === selectedClass) {
        const isRejected = item.status === 'rejected';
        if (isRejected && !showRejected) return;
        if (!isRejected) submittedCount++;
        filteredItems.push({ key, ...item, studentStr, classNum, seatNum });

        if (!isRejected && selectedClass !== 'all' && seatNum >= 1 && seatNum <= 40) {
          const card = document.getElementById(`card-num-${seatNum}`);
          const status = document.getElementById(`status-num-${seatNum}`);
          if (card && status) { card.classList.add('submitted'); status.innerText = '제출완료'; }
        }
      }
    });

    if (selectedClass !== 'all') {
      filteredItems.sort((a, b) => a.seatNum - b.seatNum);
    } else {
      filteredItems.reverse();
    }

    seatIndex = {};
    if (selectedClass !== 'all') {
      filteredItems.forEach((it, i) => { if (it.status !== 'rejected') seatIndex[it.seatNum] = i; });
    }
    document.querySelectorAll('.student-card.submitted').forEach(c => { c.style.cursor = 'pointer'; c.title = '눌러서 크게 보기'; });

    filteredItems.forEach((item, index) => {
      let typeVal = '-', contentVal = '-';
      if (selectedUnit === '1단원') {
        typeVal = esc(item.jobTitle) || '-'; contentVal = esc(item.jobDesc || item.content) || '-';
      } else if (selectedUnit === '2단원') {
        typeVal = `<div><strong>${esc(item.topGroup) || '-'}</strong></div><div class="sub-text">1~3순위: ${esc(item.topAbilitiesText) || '-'}</div>`;
        contentVal = `<div>👤 <strong>창업가:</strong> ${esc(item.entrepreneurText || (item.entrepreneur && item.entrepreneur.name)) || '-'}</div><div style="margin-top:4px;">🎯 <strong>다짐:</strong> ${esc(item.futurePlan) || '-'}</div>`;
      } else if (selectedUnit === '2단원-2') {
        typeVal = `<div>🌍 <strong>목표:</strong> ${esc(item.sdgsGoal) || '-'}</div><div style="margin-top:2px; color:#16a34a;">💼 <strong>직업:</strong> ${esc(item.jobTitle) || '-'}</div>`;
        contentVal = `<div>💡 <strong>기여점:</strong> ${esc(item.contribution) || '-'}</div><div class="sub-text" style="color:#2563eb;">💬 "${esc(item.oneLineReview) || '-'}"</div>`;
      } else if (selectedUnit === '2단원-3') {
        typeVal = `<img class="thumb" alt="" data-draw-key="${esc(item.key)}" onclick="openDetailModal(${index})"><div style="color:#7c3aed;">💼 <strong>${esc(item.jobTitle) || '-'}</strong></div><div class="sub-text">💰 ${esc(item.salary) || '-'}</div>`;
        contentVal = `<div>🛠️ <strong>하는 일:</strong> ${esc(item.whatTheyDo) || '-'}</div><div class="sub-text">❓ 만든 이유: ${esc(item.reason) || '-'}</div>`;
      } else {
        typeVal = esc(item.learningType || item.strength) || '-'; contentVal = esc(item.improvement || item.content) || '-';
      }

      let timeVal = esc(item.submittedAt || (item.timestamp ? new Date(item.timestamp).toLocaleString('ko-KR') : '-'));

      const isRej = item.status === 'rejected';
      const rejBadge = isRej ? `<div><span class="badge-rejected">반려됨</span></div><div class="sub-text">${esc(item.rejectReason)}</div>` : '';
      const actionBtns = isRej
        ? `<button class="view-item-btn" onclick="openDetailModal(${index})">보기</button>
           <button class="rej-item-btn" onclick="cancelReject(${index})">반려 취소</button>
           <button class="del-item-btn" onclick="deleteSubmission(${index})">삭제</button>`
        : `<button class="view-item-btn" onclick="openDetailModal(${index})">보기</button>
           <button class="rej-item-btn" onclick="rejectSubmission(${index})">반려</button>
           <button class="del-item-btn" onclick="deleteSubmission(${index})">삭제</button>`;

      const tr = document.createElement('tr');
      if (isRej) tr.className = 'row-rejected';
      else if (selectedUnit === '2단원-3' && pickedKeys.has(item.key)) tr.className = 'row-picked';
      tr.innerHTML = `
        <td><span class="student-clickable" onclick="openDetailModal(${index})">${esc(item.studentStr)}</span>${rejBadge}${(selectedUnit === '2단원-3' && !isRej) ? `<div><label class="pick-label" title="인쇄할 카드로 고르기"><input type="checkbox" onchange="togglePick('${esc(item.key)}', this.checked, this)" ${pickedKeys.has(item.key) ? 'checked' : ''}> 인쇄</label></div>` : ''}</td>
        <td>${typeVal}</td>
        <td><div>${contentVal}</div></td>
        <td style="font-size:0.8rem; color:#64748b;">${timeVal}</td>
        <td class="text-center">
          ${actionBtns}
        </td>
      `;
      tableBody.appendChild(tr);
    });

    if (selectedUnit === '2단원-3') fillDrawings(tableBody);
    updatePrintControls();
    document.getElementById('submissionCounter').innerText = `총 제출 건수: ${submittedCount}건`;
    if (filteredItems.length === 0) tableBody.innerHTML = '<tr><td colspan="5" class="text-center">조건에 맞는 데이터가 없습니다.</td></tr>';
  }

  // 활동지를 바꿀 때 이전 감시를 먼저 끄고 새로 연결합니다.
  function attachRealtimeListener() {
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    const path = getPathByUnit(document.getElementById('activitySelect').value);
    unsubscribe = onValue(ref(db, path), (snapshot) => {
      rawData = snapshot.val() || {};
      updateDashboard();
    }, (error) => {
      document.getElementById('submissionTable').innerHTML = '<tr><td colspan="5" class="text-center">데이터를 불러오지 못했습니다: ' + esc(error.message) + '</td></tr>';
    });
  }

  document.getElementById('activitySelect').addEventListener('change', attachRealtimeListener);
  document.getElementById('classSelect').addEventListener('change', updateDashboard);
  document.getElementById('showRejected').addEventListener('change', updateDashboard);

  // ---------- 개별 삭제 (선생님 로그인 상태에서만 가능) ----------
  window.deleteSubmission = async function(index) {
    const item = filteredItems[index];
    if (!item) return;
    const unit = document.getElementById('activitySelect').value;
    const ok = confirm(`[${unit}] 학번 ${item.studentStr}의 제출 1건을 삭제할까요?\n삭제하면 되돌릴 수 없고, 학생은 다시 제출할 수 있게 됩니다.`);
    if (!ok) return;
    try {
      await remove(ref(db, getPathByUnit(unit) + '/' + item.key));
      if (unit === '2단원-3') {
        try { await remove(ref(db, DRAW_PATH + '/' + item.key)); } catch (e) { /* 그림이 없어도 괜찮음 */ }
        delete drawingCache[item.key];
      }
    } catch (err) {
      alert('삭제하지 못했습니다: ' + err.message);
    }
  };

  // ---------- 반려 / 반려 취소 (선생님 로그인 상태에서만 가능) ----------
  window.rejectSubmission = async function(index) {
    const item = filteredItems[index];
    if (!item) return;
    const unit = document.getElementById('activitySelect').value;
    const reason = prompt(`학번 ${item.studentStr}의 제출을 반려합니다.\n학생에게 보여 줄 사유를 적어 주세요. (예: 직업 이름을 구체적으로 다시 써 주세요)`);
    if (reason === null) return;
    try {
      await update(ref(db, getPathByUnit(unit) + '/' + item.key), {
        status: 'rejected',
        rejectReason: reason.trim().slice(0, 200),
        rejectedAt: Date.now()
      });
    } catch (err) {
      alert('반려하지 못했습니다: ' + err.message);
    }
  };

  window.cancelReject = async function(index) {
    const item = filteredItems[index];
    if (!item) return;
    const unit = document.getElementById('activitySelect').value;
    if (!confirm(`학번 ${item.studentStr}의 반려를 취소하고 정상 제출로 되돌릴까요?`)) return;
    try {
      await update(ref(db, getPathByUnit(unit) + '/' + item.key), {
        status: null,
        rejectReason: null,
        rejectedAt: null
      });
    } catch (err) {
      alert('반려를 취소하지 못했습니다: ' + err.message);
    }
  };

  window.openDetailModal = function(index) {
    const item = filteredItems[index];
    if (!item) return;
    const selectedUnit = document.getElementById('activitySelect').value;
    document.getElementById('modalStudentTitle').innerText = `👤 [${item.studentStr}] 상세 답변`;
    const body = document.getElementById('modalAnswersBody');

    if (selectedUnit === '1단원') {
      body.innerHTML = `<div class="answer-block"><div class="answer-label">🎯 관심 직업</div><div class="answer-content">${esc(item.jobTitle) || '-'}</div></div><div class="answer-block"><div class="answer-label">📝 내용</div><div class="answer-content">${esc(item.jobDesc || item.content) || '-'}</div></div>`;
    } else if (selectedUnit === '2단원') {
      body.innerHTML = `<div class="answer-block"><div class="answer-label">🏆 역량군</div><div class="answer-content">${esc(item.topGroup) || '-'}</div></div><div class="answer-block"><div class="answer-label">💡 추천 창업가</div><div class="answer-content">${esc(item.entrepreneurText) || '-'}</div></div><div class="answer-block"><div class="answer-label">🚀 노력</div><div class="answer-content">${esc(item.futurePlan) || '-'}</div></div>`;
    } else if (selectedUnit === '2단원-2') {
      body.innerHTML = `<div class="answer-block"><div class="answer-label">🌍 SDGs 목표</div><div class="answer-content">${esc(item.sdgsGoal) || '-'}</div></div><div class="answer-block"><div class="answer-label">💼 직업 이름</div><div class="answer-content">${esc(item.jobTitle) || '-'}</div></div><div class="answer-block"><div class="answer-label">📋 주요 업무</div><div class="answer-content">${esc(Array.isArray(item.tasks) ? item.tasks.join(', ') : (item.tasksText || '-'))}</div></div><div class="answer-block"><div class="answer-label">💡 기여점</div><div class="answer-content">${esc(item.contribution) || '-'}</div></div><div class="answer-block"><div class="answer-label">💬 한줄평</div><div class="answer-content">"${esc(item.oneLineReview) || '-'}"</div></div>`;
    } else if (selectedUnit === '2단원-3') {
      const blk = (label, v) => `<div class="answer-block"><div class="answer-label">${label}</div><div class="answer-content">${esc(v) || '-'}</div></div>`;
      body.innerHTML = `<img class="modal-drawing" alt="그림 불러오는 중..." data-draw-key="${esc(item.key)}">`
        + blk('💼 직업명', item.jobTitle) + blk('❓ 만든 이유', item.reason) + blk('🛠️ 하는 일', item.whatTheyDo)
        + blk('💪 필요한 능력', item.abilities) + blk('🎓 되는 방법', item.howTo) + blk('💰 보수', item.salary);
      fillDrawings(body);
    } else {
      body.innerHTML = `<div class="answer-block"><div class="answer-label">📘 학습 유형</div><div class="answer-content">${esc(item.learningType || item.strength) || '-'}</div></div><div class="answer-block"><div class="answer-label">💡 개선점 및 계획</div><div class="answer-content">${esc(item.improvement || item.content) || '-'}</div></div>`;
    }
    document.getElementById('detailModal').style.display = 'flex';
  };

  document.getElementById('btnModalClose').addEventListener('click', () => { document.getElementById('detailModal').style.display = 'none'; });

  document.getElementById('btnExcel').addEventListener('click', () => {
    if (filteredItems.length === 0) return alert('다운로드할 데이터가 없습니다.');
    const selectedUnit = document.getElementById('activitySelect').value;
    const excelData = filteredItems.map(item => {
      let row = { '입력된 학번': item.studentStr };
      if (selectedUnit === '1단원') { row['직업'] = item.jobTitle || ''; row['내용'] = item.jobDesc || item.content || ''; }
      else if (selectedUnit === '2단원-2') { row['목표'] = item.sdgsGoal || ''; row['직업'] = item.jobTitle || ''; row['기여점'] = item.contribution || ''; row['한줄평'] = item.oneLineReview || ''; }
      else if (selectedUnit === '2단원-3') { row['직업명'] = item.jobTitle || ''; row['만든 이유'] = item.reason || ''; row['하는 일'] = item.whatTheyDo || ''; row['필요한 능력'] = item.abilities || ''; row['되는 방법'] = item.howTo || ''; row['보수'] = item.salary || ''; }
      else if (selectedUnit === '2단원') { row['역량군'] = item.topGroup || ''; row['추천 창업가'] = item.entrepreneurText || ''; row['다짐'] = item.futurePlan || ''; }
      else { row['학습 유형'] = item.learningType || item.strength || ''; row['개선점 및 계획'] = item.improvement || item.content || ''; }
      row['제출시간'] = item.submittedAt || '';
      return row;
    });
    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, selectedUnit);
    XLSX.writeFile(workbook, `${selectedUnit}_전체결과.xlsx`);
  });

  document.getElementById('btnPresentation').addEventListener('click', () => {
    if (filteredItems.length === 0) return alert('데이터가 없습니다.');
    currentPresentIndex = 0; renderPresentSlide(); document.getElementById('presentationOverlay').style.display = 'flex';
  });

  function renderPresentSlide() {
    const item = filteredItems[currentPresentIndex];
    document.getElementById('presentStudentTitle').innerText = `👤 학번: ${item.studentStr}`;
    document.getElementById('presentIndexText').innerText = `${currentPresentIndex + 1} / ${filteredItems.length}`;
    document.getElementById('btnPrevPresent').disabled = (currentPresentIndex === 0);
    document.getElementById('btnNextPresent').disabled = (currentPresentIndex === filteredItems.length - 1);

    if (document.getElementById('activitySelect').value === '2단원-3') {
      const row = (label, v) => `<div class="pc-row"><div class="pc-label">${label}</div><div class="pc-val">${esc(v) || '-'}</div></div>`;
      const pc = document.getElementById('presentContent');
      pc.innerHTML = `
        <div class="pc-card">
          <img class="pc-img" alt="그림 불러오는 중..." data-draw-key="${esc(item.key)}">
          <div>
            <div class="pc-title">💼 ${esc(item.jobTitle) || '-'}</div>
            ${row('❓ 만든 이유', item.reason)}
            ${row('🛠️ 하는 일', item.whatTheyDo)}
            ${row('💪 필요한 능력', item.abilities)}
            ${row('🎓 되는 방법', item.howTo)}
            ${row('💰 보수', item.salary)}
          </div>
        </div>`;
      fillDrawings(pc);
      return;
    }

    document.getElementById('presentContent').innerHTML = `
      <div style="font-size:calc(var(--ps) * 3rem); color:#4ade80; margin-bottom:20px;">입력 학번: <strong>${esc(item.studentStr)}</strong></div>
      <div style="font-size:calc(var(--ps) * 3rem); font-weight:bold; line-height:1.4; color:#f8fafc; background:#0f172a; padding:25px; border-radius:12px;">${esc(item.jobTitle || item.sdgsGoal || item.topGroup) || '-'}</div>
      <div style="font-size:calc(var(--ps) * 3.4rem); line-height:1.6; color:#f8fafc; background:#0f172a; padding:30px; border-radius:16px; margin-top: 20px; white-space:pre-wrap;">${esc(item.contribution || item.content || item.jobDesc || item.futurePlan) || '-'}</div>
    `;
  }
  // ---------- 직업 카드 A4 인쇄 (2단원-3) ----------
  const pickedKeys = new Set();   // 인쇄하려고 고른 카드
  window.togglePick = function(key, on, el) {
    if (on) pickedKeys.add(key); else pickedKeys.delete(key);
    const tr = el && el.closest('tr');
    if (tr) tr.classList.toggle('row-picked', on);
    updatePrintControls();
  };
  function updatePrintControls() {
    const on = document.getElementById('activitySelect').value === '2단원-3';
    const btn = document.getElementById('btnPrint');
    btn.style.display = on ? '' : 'none';
    document.getElementById('printOptions').style.display = on ? '' : 'none';
    document.getElementById('btnPrintOne').style.display = on ? '' : 'none';
    const n = filteredItems.filter(it => it.status !== 'rejected' && pickedKeys.has(it.key)).length;
    btn.textContent = n ? `🖨️ 고른 카드 인쇄 (${n}장)` : '🖨️ 카드 인쇄';
  }

  const pcItem = (cls, label, v) => `<div class="pc-item"><span class="pc-chip ${cls}">${label}</span><div class="pc-text">${esc(v) || '-'}</div></div>`;
  const pcFoot = (item, showId, side) => `<div class="pc-foot"><span>진로와 직업 · 우리가 만든 미래 직업 카드${side ? ' · ' + side : ''}</span><span>${showId ? '학번 ' + esc(item.studentStr) : ''}</span></div>`;

  // 한 장 카드: 위에 큰 직업 이름, 아래 왼쪽 그림 · 오른쪽 설명
  function cardOneHtml(item, showId) {
    return `
      <div class="pcard"><div class="pc-frame">
        <div class="pc-top">
          <span class="pc-kicker">나와 주변인에게 필요한 직업</span>
          <div class="pc-bigname"><span>${esc(item.jobTitle) || '-'}</span></div>
        </div>
        <div class="pc-main">
          <div class="pc-pic"><img alt="" data-draw-key="${esc(item.key)}"></div>
          <div class="pc-info">
            ${pcItem('c-rose', '만든 이유', item.reason)}
            ${pcItem('c-green', '하는 일', item.whatTheyDo)}
            ${pcItem('c-blue', '필요한 능력', item.abilities)}
            ${pcItem('c-amber', '되는 방법', item.howTo)}
            ${pcItem('c-slate', '보수', item.salary)}
          </div>
        </div>
        ${pcFoot(item, showId, '')}
      </div></div>`;
  }

  // 칸을 넘치면 글씨를 조금씩 줄입니다. (els 안의 칸이 모두 들어갈 때까지, 같은 크기로)
  function fitGroup(els, start, min, step) {
    let fs = start;
    const over = () => els.some(el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1);
    els.forEach(el => { el.style.fontSize = fs + 'pt'; });
    while (over() && fs > min) {
      fs -= step;
      els.forEach(el => { el.style.fontSize = fs + 'pt'; });
    }
  }

  async function printCards(items) {
    if (!items.length) return;
    const area = document.getElementById('printArea');
    const showId = document.getElementById('printShowId').checked;
    area.innerHTML = items.map(it => cardOneHtml(it, showId)).join('');
    // 화면 밖에 잠깐 펼쳐서 그림을 불러오고 글씨 크기를 맞춥니다.
    area.style.cssText = 'display:block; position:fixed; left:-10000px; top:0;';
    await Promise.all(Array.from(area.querySelectorAll('img[data-draw-key]')).map(async img => {
      const src = await loadDrawing(img.dataset.drawKey);
      if (src) {
        img.src = src;
        try { await img.decode(); } catch (e) {}
      } else {
        img.outerHTML = '<span class="pc-nopic">그림 없음</span>';
      }
    }));
    area.querySelectorAll('.pcard').forEach(card => {
      fitGroup([card.querySelector('.pc-bigname')], 46, 20, 2);
      fitGroup([card.querySelector('.pc-info')], 14, 7, 0.5);
    });
    area.style.cssText = '';
    window.print();
  }

  document.getElementById('btnPrint').addEventListener('click', () => {
    const active = filteredItems.filter(it => it.status !== 'rejected');
    const picked = active.filter(it => pickedKeys.has(it.key));
    if (picked.length) return printCards(picked);
    if (!active.length) return alert('인쇄할 카드가 없습니다.');
    if (confirm(`고른 카드가 없어요. 지금 목록에 보이는 카드 ${active.length}장을 모두 인쇄할까요?\n(잘한 카드만 인쇄하려면 학번 아래 '인쇄'에 체크하세요)`)) printCards(active);
  });
  document.getElementById('btnPrintOne').addEventListener('click', () => {
    const item = filteredItems[currentPresentIndex];
    if (item) printCards([item]);
  });

  // 발표 글씨 크기 조절 (기본 1.0, 0.6 ~ 2.0)
  let presentScale = 1;
  function setPresentScale(v) {
    presentScale = Math.min(2, Math.max(0.6, Math.round(v * 10) / 10));
    document.getElementById('presentationOverlay').style.setProperty('--ps', presentScale);
  }
  setPresentScale(1);
  document.getElementById('btnFontDown').addEventListener('click', () => setPresentScale(presentScale - 0.2));
  document.getElementById('btnFontUp').addEventListener('click', () => setPresentScale(presentScale + 0.2));
  document.getElementById('btnPrevPresent').addEventListener('click', () => { if (currentPresentIndex > 0) { currentPresentIndex--; renderPresentSlide(); } });
  document.getElementById('btnNextPresent').addEventListener('click', () => { if (currentPresentIndex < filteredItems.length - 1) { currentPresentIndex++; renderPresentSlide(); } });
  document.getElementById('btnClosePresent').addEventListener('click', () => { document.getElementById('presentationOverlay').style.display = 'none'; });
</script>

<div id="printArea"></div>
</body>
</html>
